<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>आरोग्य उपकेंद्र व्यवस्थापन प्रणाली</title>
    <!-- Tailwind CSS (डिझाईनसाठी) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS (डेटाबेससाठी) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-6">

    <div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md text-center">
        <h1 class="text-2xl font-bold text-blue-600 mb-4">आरोग्य उपकेंद्र प्रणाली</h1>
        <p class="text-gray-600 mb-6">सिस्टीममध्ये तुमचे स्वागत आहे</p>
        
        <!-- लॉगिन फॉर्मचा सांगाडा -->
        <input type="text" id="mobileNumber" placeholder="१० अंकी मोबाईल नंबर" class="w-full p-2 border rounded mb-4" maxlength="10">
        <button onclick="login()" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">लॉगिन करा</button>
        
        <p id="statusMessage" class="mt-4 text-red-500"></p>
    </div>

    <script>
        // तुमची Supabase ची माहिती येथे टाका
        const SUPABASE_URL = 'तुमची_SUPABASE_URL_येथे_टाका';
        const SUPABASE_KEY = 'तुमची_SUPABASE_ANON_KEY_येथे_टाका';
        
        // Supabase क्लायंट सुरू करणे
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // लॉगिन फंक्शन (सॅम्पल)
        async function login() {
            const mobile = document.getElementById('mobileNumber').value;
            const statusLabel = document.getElementById('statusMessage');

            if(mobile.length !== 10) {
                statusLabel.innerText = "कृपया योग्य १० अंकी मोबाईल नंबर टाका.";
                return;
            }

            statusLabel.style.color = "green";
            statusLabel.innerText = "लॉगिन तपासले जात आहे...";
            
            // येथे आपण डेटाबेसमधून नंबर चेक करण्याचा कोड नंतर टाकू
            console.log("Supabase Connection Ready!");
        }
    </script>
</body>
</html>
