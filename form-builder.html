<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>फॉर्म बिल्डर - तालुका आरोग्य प्रणाली</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
</head>
<body class="bg-gray-100 p-2 md:p-6 min-h-screen">

    <div class="max-w-6xl mx-auto bg-white p-4 rounded-lg shadow-md flex justify-between items-center mb-6 border-t-8 border-green-600">
        <div>
            <h1 class="text-xl md:text-2xl font-extrabold text-green-800" id="pageTitle">🛠️ नवीन फॉर्म तयार करा</h1>
            <p class="text-sm font-bold text-gray-500 mt-1">तालुक्यातील सर्व उपकेंद्रांसाठी डायनॅमिक अहवाल फॉर्म बनवा</p>
        </div>
        <button onclick="window.location.href='dashboard.html'" class="bg-gray-600 text-white px-4 py-2 rounded font-bold shadow-lg hover:bg-gray-700 transition">डॅशबोर्डवर परत जा</button>
    </div>

    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-md mb-8">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 border-b-2 border-gray-200 pb-6">
            <div class="md:col-span-1">
                <label class="block text-sm font-bold text-gray-700 mb-1">फॉर्मचे नाव <span class="text-red-500">*</span></label>
                <input type="text" id="formName" placeholder="उदा. गरोदर माता नोंदणी" class="w-full p-3 border-2 border-gray-300 rounded font-bold focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">अहवालाचा प्रकार <span class="text-red-500">*</span></label>
                <select id="formType" class="w-full p-3 border-2 border-gray-300 rounded font-bold focus:ring-2 focus:ring-green-500 text-blue-800 bg-blue-50">
                    <option value="monthly">📊 मासिक (Monthly) - महिन्यातून एकदाच</option>
                    <option value="progressive">📈 प्रगत (Progressive) - मागील + चालू बेरीज</option>
                    <option value="list">📝 यादी (List) - एका गावात अनेक नोंदी</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">कोणाला भरता येईल? <span class="text-red-500">*</span></label>
                <input type="text" id="allowedRoles" placeholder="उदा. ANM, MPW, CHO" value="ANM,MPW,CHO" class="w-full p-3 border-2 border-gray-300 rounded font-bold text-gray-600">
            </div>
        </div>

        <div class="mb-4 flex justify-between items-center">
            <h2 class="text-lg font-extrabold text-gray-800">प्रश्न आणि रकाने (Form Fields)</h2>
            <button onclick="addField()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-extrabold shadow hover:bg-blue-700 transition">➕ नवीन प्रश्न जोडा</button>
        </div>

        <div id="fieldsContainer" class="space-y-4 mb-8 min-h-[100px] border-2 border-dashed border-gray-300 p-4 rounded-lg bg-gray-50">
            </div>

        <div class="border-t-2 border-gray-200 pt-6 flex justify-end">
            <button id="saveFormBtn" onclick="saveForm()" class="bg-green-600 text-white px-10 py-4 rounded-xl font-extrabold text-xl shadow-xl hover:bg-green-700 transition transform hover:-translate-y-1 w-full md:w-auto">
                💾 फॉर्म सेव्ह आणि पब्लिश करा
            </button>
        </div>
    </div>

    <div id="loader" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl text-center border-t-8 border-green-600">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-green-600 border-t-transparent mb-3"></div>
            <p class="text-xl font-extrabold text-gray-800">फॉर्म सेव्ह होत आहे...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qbmjsfiievcautxybaai.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_sdgZ9G8ko4H_3Mh9RouYFg_JOQ-4Mdx'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let fieldCounter = 0;
        let editFormId = null;

        // 🟢 नवीन: मोबाईल नंबर (१० अंकी) हा पर्याय जोडला आहे
        const fieldTypes = {
            'text': '🔤 सामान्य मजकूर (Text)',
            'number': '🔢 फक्त आकडे (Number)',
            'mobile': '📱 मोबाईल नंबर (१० अंकी)', 
            'date': '📅 दिनांक (Date)',
            'dropdown': '🔽 ड्रॉपडाऊन (Select)',
            'yes_no': '🔘 होय / नाही (Yes/No)',
            'group_header': '📁 ग्रुप हेडिंग (Heading)',
            'formula': '🧮 स्वयंचलित बेरीज (Formula)'
        };

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            editFormId = urlParams.get('edit');

            if (editFormId) {
                document.getElementById('pageTitle').innerText = "🛠️ फॉर्म सुधारा (Edit Form)";
                await loadExistingForm(editFormId);
            } else {
                addField('group_header', 'नवीन ग्रुप (उदा. लसीकरण)'); 
                addField('text', 'उदा. रुग्णाचे नाव');
            }

            // Drag and Drop (Sortable JS)
            var el = document.getElementById('fieldsContainer');
            Sortable.create(el, { animation: 150, handle: '.drag-handle' });
        };

        function showLoader() { document.getElementById('loader').classList.remove('hidden'); }
        function hideLoader() { document.getElementById('loader').classList.add('hidden'); }

        async function loadExistingForm(id) {
            showLoader();
            const { data, error } = await supabaseClient.from('dynamic_forms').select('*').eq('id', id).single();
            hideLoader();
            
            if (error || !data) { alert("फॉर्म सापडला नाही!"); window.location.href="dashboard.html"; return; }

            document.getElementById('formName').value = data.form_name;
            document.getElementById('formType').value = data.form_type;
            if(data.allowed_roles) document.getElementById('allowedRoles').value = data.allowed_roles;

            let fields = data.schema_json.fields || [];
            fields.forEach(f => {
                let actualType = f.type;
                if(f.formula && String(f.formula).trim() !== "") actualType = 'formula';
                addField(actualType, f.label, f.required, f.options, f.formula, f.parent_id, f.id);
            });
        }

        function addField(type = 'text', label = '', isReq = false, options = [], formula = '', parentId = '', forceId = null) {
            fieldCounter++;
            let fId = forceId || `f_${new Date().getTime()}_${fieldCounter}`;
            let container = document.getElementById('fieldsContainer');

            let typeOptionsHtml = '';
            for (let t in fieldTypes) {
                typeOptionsHtml += `<option value="${t}" ${type === t ? 'selected' : ''}>${fieldTypes[t]}</option>`;
            }

            let optsStr = options ? options.join(', ') : '';

            let card = document.createElement('div');
            card.className = "field-card bg-white p-4 rounded-lg border-2 border-gray-200 shadow-sm flex flex-col md:flex-row gap-4 items-start md:items-center relative";
            card.dataset.id = fId;

            let extraInputs = '';
            if (type === 'dropdown') {
                extraInputs = `<input type="text" class="field-options w-full p-2 border border-purple-300 rounded mt-2 text-sm bg-purple-50" placeholder="पर्याय स्वल्पविरामाने (,) वेगळे करा उदा. होय, नाही, इतर" value="${optsStr}">`;
            } else if (type === 'formula') {
                extraInputs = `<input type="text" class="field-formula w-full p-2 border border-orange-300 rounded mt-2 text-sm font-mono text-orange-800 bg-orange-50" placeholder="सूत्र टाका उदा. [f_1]+[f_2]" value="${formula}">`;
            }

            let bgClass = type === 'group_header' ? 'bg-indigo-100 border-indigo-400' : 'bg-white';

            card.innerHTML = `
                <div class="drag-handle cursor-move text-gray-400 hover:text-gray-700 text-2xl px-2" title="वर-खाली हलवा">☰</div>
                
                <div class="flex-1 w-full grid grid-cols-1 md:grid-cols-12 gap-3 ${bgClass} p-2 rounded">
                    
                    <div class="md:col-span-5">
                        <input type="text" class="field-label w-full p-2 border-2 border-gray-300 rounded font-bold" placeholder="${type==='group_header'?'ग्रुपचे नाव टाका':'प्रश्नाचे नाव टाका'}" value="${label}">
                        ${extraInputs}
                    </div>

                    <div class="md:col-span-3">
                        <select class="field-type w-full p-2 border-2 border-gray-300 rounded font-bold text-gray-700" onchange="changeFieldType(this)">
                            ${typeOptionsHtml}
                        </select>
                    </div>

                    <div class="md:col-span-2 flex items-center justify-center">
                        <label class="font-bold text-sm text-gray-700 flex items-center cursor-pointer ${type==='group_header'?'hidden':''}">
                            <input type="checkbox" class="field-required w-5 h-5 mr-2 text-blue-600 rounded focus:ring-blue-500" ${isReq ? 'checked' : ''}> अनिवार्य
                        </label>
                    </div>

                    <div class="md:col-span-2 text-center md:text-right">
                        <button onclick="this.closest('.field-card').remove()" class="text-red-500 font-bold hover:bg-red-100 px-3 py-2 rounded transition">✕ काढा</button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        }

        function changeFieldType(selectEl) {
            let card = selectEl.closest('.field-card');
            let type = selectEl.value;
            let labelVal = card.querySelector('.field-label').value;
            let reqVal = card.querySelector('.field-required') ? card.querySelector('.field-required').checked : false;
            let idVal = card.dataset.id;
            
            // Re-render that specific card
            card.remove();
            addField(type, labelVal, reqVal, [], '', '', idVal);
        }

        async function saveForm() {
            let formName = document.getElementById('formName').value.trim();
            let formType = document.getElementById('formType').value;
            let roles = document.getElementById('allowedRoles').value.trim();

            if (!formName) return alert("कृपया फॉर्मचे नाव टाका!");

            let fieldCards = document.querySelectorAll('.field-card');
            if (fieldCards.length === 0) return alert("फॉर्ममध्ये किमान एक प्रश्न असावा!");

            let schemaFields = [];
            let currentParentId = null;

            for (let i = 0; i < fieldCards.length; i++) {
                let card = fieldCards[i];
                let fId = card.dataset.id;
                let fTypeSelect = card.querySelector('.field-type').value;
                let fLabel = card.querySelector('.field-label').value.trim();
                let fReq = card.querySelector('.field-required') ? card.querySelector('.field-required').checked : false;

                if (!fLabel) { alert(`ओळ क्रमांक ${i+1} मध्ये प्रश्नाचे नाव रिकामे आहे!`); return; }

                let actualType = fTypeSelect;
                let optionsArr = null;
                let formulaStr = null;

                if (fTypeSelect === 'group_header') {
                    currentParentId = fId; // यापुढील प्रश्न या ग्रुपमध्ये जातील
                    fReq = false;
                } else if (fTypeSelect === 'dropdown') {
                    let optVal = card.querySelector('.field-options').value;
                    if(!optVal) { alert(`'${fLabel}' साठी ड्रॉपडाऊन पर्याय दिलेले नाहीत!`); return; }
                    optionsArr = optVal.split(',').map(s => s.trim()).filter(s => s !== "");
                } else if (fTypeSelect === 'formula') {
                    actualType = 'number'; // डेटाबेसमध्ये 'number' म्हणून सेव्ह होते
                    formulaStr = card.querySelector('.field-formula').value.trim();
                    if(!formulaStr) { alert(`'${fLabel}' साठी फॉर्म्युला दिलेला नाही!`); return; }
                }

                let fieldObj = {
                    id: fId,
                    label: fLabel,
                    type: actualType,
                    required: fReq
                };

                if (currentParentId && fTypeSelect !== 'group_header') {
                    fieldObj.parent_id = currentParentId;
                }

                if (optionsArr) fieldObj.options = optionsArr;
                if (formulaStr) fieldObj.formula = formulaStr;

                schemaFields.push(fieldObj);
            }

            let finalSchema = { fields: schemaFields };

            showLoader();
            try {
                let payload = {
                    form_name: formName,
                    form_type: formType,
                    schema_json: finalSchema,
                    allowed_roles: roles,
                    is_active: true
                };

                let errorObj;
                if (editFormId) {
                    const { error } = await supabaseClient.from('dynamic_forms').update(payload).eq('id', editFormId);
                    errorObj = error;
                } else {
                    const { error } = await supabaseClient.from('dynamic_forms').insert([payload]);
                    errorObj = error;
                }

                if (errorObj) throw errorObj;
                alert("✅ फॉर्म यशस्वीरीत्या सेव्ह झाला!");
                window.location.href = "dashboard.html";

            } catch (err) { alert("फॉर्म सेव्ह करताना एरर: " + err.message); }
            hideLoader();
        }
    </script>
</body>
</html>
