<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अहवाल केंद्र - प्राथमिक आरोग्य केंद्र भादा</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #00705a; }
        .report-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; table-layout: auto; }
        .report-table th, .report-table td { border: 1px solid #000; padding: 6px; text-align: center; word-wrap: break-word; }
        .report-table th { background-color: #f4f7f6; font-weight: bold; color: #333; }
        .page-break { page-break-before: always !important; display: block; }
        .table-responsive { width: 100%; overflow-x: auto; }
        @media print {
            .no-print { display: none !important; }
            body { background: #fff; padding: 0; }
            .report-table th { background-color: #e9ecef !important; color: #000 !important; }
        }
    </style>
</head>
<body class="bg-gray-100 p-6 min-h-screen">

    <div class="max-w-7xl mx-auto bg-white p-4 rounded-lg shadow-md flex justify-between items-center mb-6 no-print">
        <div>
            <h1 class="text-xl font-bold text-green-700">📊 प्रगत अहवाल केंद्र (कंट्रोल पॅनेल)</h1>
            <p class="text-xs text-gray-500">प्राथमिक आरोग्य केंद्र भादा, तालुका औसा</p>
        </div>
        <button onclick="window.location.href='dashboard.html'" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 transition text-sm font-bold">डॅशबोर्डवर परत जा</button>
    </div>

    <div class="max-w-7xl mx-auto bg-white p-6 rounded-lg shadow-md border-t-4 border-green-700 mb-6 no-print">
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
            <div class="relative" id="multiSelectContainer">
                <label class="block text-gray-700 text-xs font-bold mb-1">अहवाल / फॉर्म निवडा</label>
                <button onclick="toggleMultiSelect()" class="w-full p-2 border rounded bg-white text-left text-sm font-medium flex justify-between items-center min-h-[38px]">
                    <span id="multiSelectBtnText">सर्व अहवाल (All Forms)</span>
                    <span class="text-xs text-gray-400">▼</span>
                </button>
                <div id="multiSelectDropdown" class="absolute left-0 right-0 mt-1 bg-white border rounded shadow-lg z-50 max-h-60 overflow-y-auto hidden">
                    <div class="p-2 border-b bg-gray-50">
                        <label class="flex items-center gap-2 font-bold text-xs text-green-700 cursor-pointer">
                            <input type="checkbox" id="chkAllReports" checked onchange="toggleAllReports(this)" class="w-4 h-4"> 
                            सर्व फॉर्म्स निवडा (Select All)
                        </label>
                    </div>
                    <div id="multiSelectOptions" class="text-xs"></div>
                </div>
                <select id="reportFormSelect" class="hidden"></select>
            </div>

            <div>
                <label class="block text-gray-700 text-xs font-bold mb-1">अहवाल महिना</label>
                <select id="reportMonth" class="w-full p-2 border rounded bg-white text-sm">
                    <option value="जानेवारी">जानेवारी</option><option value="फेब्रुवारी">फेब्रुवारी</option>
                    <option value="मार्च">मार्च</option><option value="एप्रिल">एप्रिल</option>
                    <option value="मे">मे</option><option value="जून">जून</option>
                    <option value="जुलै">जुलै</option><option value="ऑगस्ट">ऑगस्ट</option>
                    <option value="सप्टेंबर">सप्टेंबर</option><option value="ऑक्टोबर">ऑक्टोबर</option>
                    <option value="नोव्हेंबर">नोव्हेंबर</option><option value="डिसेंबर">डिसेंबर</option>
                </select>
            </div>

            <div>
                <label class="block text-gray-700 text-xs font-bold mb-1">अहवाल वर्ष</label>
                <input type="number" id="reportYear" class="w-full p-2 border rounded text-sm font-mono" value="2026">
            </div>

            <div>
                <label class="block text-gray-700 text-xs font-bold mb-1">उपकेंद्र फिल्टर</label>
                <select id="reportSubCenterFilter" class="w-full p-2 border rounded bg-white text-sm">
                    <option value="सर्व">सर्व उपकेंद्र (All Sub-centers)</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 border-t pt-4">
            <div>
                <label class="block text-gray-700 text-xs font-bold mb-1">अहवाल मांडणी प्रकार (Group View)</label>
                <select id="reportGroupFilter" class="w-full p-2 border rounded bg-white text-sm font-medium text-purple-700">
                    <option value="Village">गाव स्तरावर स्वतंत्र यादी (Village Wise)</option>
                    <option value="SubCenter">उपकेंद्र स्तरावर स्वतंत्र यादी</option>
                    <option value="SubCenterConsolidated">उपकेंद्र एकत्रित उभी मांडणी (Vertical Consolidated)</option>
                </select>
            </div>
            
            <div class="flex items-end gap-2 md:col-span-2">
                <button onclick="fetchReportData()" class="flex-1 bg-blue-600 text-white font-bold p-2 rounded text-sm hover:bg-blue-700 shadow transition">🔍 अहवाल पहा (Show Report)</button>
                <button onclick="generatePendingReport()" class="flex-1 bg-red-600 text-white font-bold p-2 rounded text-sm hover:bg-red-700 shadow transition">⚠️ अपूर्ण यादी शोधा (Pending)</button>
            </div>
        </div>

    </div>

    <div id="reportLoader" class="text-center py-10 hidden no-print">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-green-700 border-t-transparent mb-2"></div>
        <p class="text-gray-500 font-medium text-sm">डेटाबेस मधून प्रगत अहवाल आकडेमोड सुरू आहे, कृपया थांबा...</p>
    </div>

    <div id="downloadButtonsArea" class="max-w-7xl mx-auto mb-4 no-print"></div>

    <div id="reportContentArea" class="max-w-7xl mx-auto bg-white p-6 rounded-lg shadow-md hidden">
        <div id="reportTableContainer"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qbmjsfiievcautxybaai.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_sdgZ9G8ko4H_3Mh9RouYFg_JOQ-4Mdx'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // CONFIG मॅपिंग डिझाईन
        const CONFIG = { hiddenColumns: ["महिना", "वर्ष", "उपकेंद्र", "कर्मचाऱ्याचे नाव", "मोबाईल क्र."] };

        let masterData = { forms: [], villages: [], employees: [], filledStats: [], subCenters: [] };
        let currentReports = [];
        let user = { role: 'Admin', subcenter: 'सर्व', mobile: '' };

        const monthNamesMarathi = {
            "जानेवारी": 1, "फेब्रुवारी": 2, "मार्च": 3, "एप्रिल": 4, "मे": 5, "जून": 6,
            "जुलै": 7, "ऑगस्ट": 8, "सप्टेंबर": 9, "ऑक्टोबर": 10, "नोव्हेंबर": 11, "डिसेंबर": 12
        };
        const monthNamesNumeric = {
            1: "जानेवारी", 2: "फेब्रुवारी", 3: "मार्च", 4: "एप्रिल", 5: "मे", 6: "जून",
            7: "जुलै", 8: "ऑगस्ट", 9: "सप्टेंबर", 10: "ऑक्टोबर", 11: "नोव्हेंबर", 12: "डिसेंबर"
        };

        window.onload = async function() {
            const userDataString = localStorage.getItem('loggedInUser');
            if (!userDataString) { window.location.href = "index.html"; return; }
            const sessionUser = JSON.parse(userDataString);
            
            user.role = sessionUser.role === 'admin' ? 'Admin' : 'User';
            user.mobile = sessionUser.mobile_number || '';

            const mIdx = new Date().getMonth() + 1;
            document.getElementById('reportMonth').value = monthNamesNumeric[mIdx];
            document.getElementById('reportYear').value = new Date().getFullYear();

            await loadInitialMasterData();
        };

        function formatNumberDecimals(val) {
            if (val === "" || val === null || val === undefined || val === "-" || String(val).trim() === "") return val;
            let n = Number(val);
            if (!isNaN(n)) { return Number.isInteger(n) ? n : parseFloat(n.toFixed(2)); }
            return val;
        }

        function toggleMultiSelect() {
            let dropdown = document.getElementById('multiSelectDropdown');
            dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
        }

        document.addEventListener('click', function(event) {
            let container = document.getElementById('multiSelectContainer');
            if (container && !container.contains(event.target)) {
                document.getElementById('multiSelectDropdown').style.display = 'none';
            }
        });

        async function loadInitialMasterData() {
            // १. उपकेंद्रे
            const { data: scData } = await supabaseClient.from('sub_centers').select('*').order('name');
            masterData.subCenters = scData || [];
            
            let scFilter = document.getElementById('reportSubCenterFilter');
            scFilter.innerHTML = '<option value="सर्व">सर्व उपकेंद्र (All Sub-centers)</option>';
            masterData.subCenters.forEach(sc => {
                scFilter.innerHTML += `<option value="${sc.name}">${sc.name}</option>`;
            });

            // २. गावे
            const { data: vData } = await supabaseClient.from('villages').select('*').order('name');
            masterData.villages = vData || [];

            // ३. कर्मचारी (अचूक कॉलम मॅपिंग: mobile_number)
            const { data: empData } = await supabaseClient.from('employees').select('*').order('full_name');
            masterData.employees = empData || [];

            // ४. फॉर्म्स
            const { data: formData } = await supabaseClient.from('dynamic_forms').select('*').eq('is_active', true);
            masterData.forms = formData || [];

            let select = document.getElementById('reportFormSelect');
            let optionsDiv = document.getElementById('multiSelectOptions');
            select.innerHTML = ''; optionsDiv.innerHTML = '';

            masterData.forms.forEach(f => {
                let opt = document.createElement('option');
                opt.value = f.id; opt.text = f.form_name;
                select.appendChild(opt);

                let div = document.createElement('div');
                div.style.padding = "8px"; div.style.borderBottom = "1px solid #eee"; div.style.cursor = "pointer";
                div.innerHTML = `<label style="cursor:pointer; display:flex; align-items:center; gap:6px; font-weight:600;">
                    <input type="checkbox" class="report-chk" value="${f.id}" checked onchange="checkIndividualReport()"> 
                    ${f.form_name}
                </label>`;
                optionsDiv.appendChild(div);
            });

            // ५. भरलेली आकडेवारी
            const { data: respData } = await supabaseClient.from('form_responses').select('form_id, village_id, report_month, report_year');
            masterData.filledStats = respData || [];

            document.getElementById('chkAllReports').checked = true;
            updateMultiSelectText();
        }

        function toggleAllReports(chkAll) {
            let checkboxes = document.querySelectorAll('.report-chk');
            checkboxes.forEach(chk => chk.checked = chkAll.checked);
            updateMultiSelectText();
        }

        function checkIndividualReport() {
            let checkboxes = document.querySelectorAll('.report-chk');
            let allChecked = true;
            checkboxes.forEach(chk => { if(!chk.checked) allChecked = false; });
            document.getElementById('chkAllReports').checked = allChecked;
            updateMultiSelectText();
        }

        function updateMultiSelectText() {
            let chkAll = document.getElementById('chkAllReports');
            let textSpan = document.getElementById('multiSelectBtnText');
            if(chkAll && chkAll.checked) {
                textSpan.innerText = "सर्व अहवाल (All Forms)";
                textSpan.style.color = "var(--primary)";
            } else {
                let selected = document.querySelectorAll('.report-chk:checked');
                if(selected.length === 0) {
                    textSpan.innerText = "-- कोणताही अहवाल निवडलेला नाही --";
                    textSpan.style.color = "red";
                } else if(selected.length === 1) {
                    let lbl = selected[0].parentElement.innerText.trim();
                    textSpan.innerText = lbl.length > 35 ? lbl.substring(0, 35) + "..." : lbl;
                    textSpan.style.color = "#d35400";
                } else {
                    textSpan.innerText = `✔️ ${selected.length} अहवाल निवडले`;
                    textSpan.style.color = "green";
                }
            }
        }

        function getSelectedReportIDs() {
            let chkAll = document.getElementById('chkAllReports');
            if(chkAll && chkAll.checked) return ["ALL"];
            let selected = [];
            document.querySelectorAll('.report-chk:checked').forEach(chk => selected.push(chk.value));
            return selected;
        }

        // ⚠️ PENDING REPORT LOGIC (अपूर्ण अहवाल यादी इंजिन)
        function generatePendingReport() {
            const selMonth = document.getElementById('reportMonth').value;
            const selMonthNum = monthNamesMarathi[selMonth];
            const selYear = document.getElementById('reportYear').value;
            let selectedIDs = getSelectedReportIDs();
            
            if (selectedIDs.length === 0) { alert("कृपया किमान एक अहवाल निवडा!"); return; }

            let groupedData = {}; 
            let filterSubCenter = document.getElementById('reportSubCenterFilter').value;

            let formsToCheck = masterData.forms;
            if(!selectedIDs.includes("ALL")) { 
                formsToCheck = formsToCheck.filter(f => selectedIDs.includes(f.id)); 
            }

            formsToCheck.forEach(f => {
                groupedData[f.form_name] = [];

                masterData.employees.forEach(u => {
                    if (user.role !== "Admin" && String(u.mobile_number).trim() !== String(user.mobile).trim()) return;
                    
                    let scObj = masterData.subCenters.find(s => s.id === u.sub_center_id);
                    let scName = scObj ? scObj.name : "Unknown";

                    if (user.role === "Admin" && filterSubCenter !== "सर्व" && scName !== filterSubCenter) return;

                    let userVillages = masterData.villages.filter(v => v.sub_center_id === u.sub_center_id);
                    userVillages.forEach(v => {
                        let isFilled = masterData.filledStats.some(h => 
                            h.form_id === f.id && h.village_id === v.id && 
                            h.report_month === parseInt(selMonthNum) && h.report_year === parseInt(selYear)
                        );
                        if (!isFilled) { groupedData[f.form_name].push({ sc: scName, name: u.full_name, role: u.role, village: v.name }); }
                    });
                });
            });

            let container = document.getElementById('reportTableContainer');
            let downArea = document.getElementById('downloadButtonsArea');
            
            downArea.innerHTML = `
                <div style="display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; margin-bottom: 12px;">
                    <button onclick="copyPendingListText()" style="background:#6c757d; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer; font-weight:bold; font-size:12px;">📋 यादी कॉपी करा (WhatsApp साठी)</button>
                    <button id="btnPendingPdfDownload" onclick="window.print()" style="background:#e74c3c; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer; font-weight:bold; font-size:12px;">📥 PDF प्रिंट करा</button>
                </div>
            `;
            
            let phcHeader = filterSubCenter === 'सर्व' ? "प्राथमिक आरोग्य केंद्र भादा" : `प्राथमिक आरोग्य केंद्र भादा (उपकेंद्र: ${filterSubCenter})`;

            let html = `<div id="pdfExportArea" class="pdf-container">
                <div style="text-align:center; border-bottom: 2px solid var(--primary); padding-bottom:10px; margin-bottom:20px;">
                    <h2 style="margin:0; color:var(--primary); font-size:24px;">${phcHeader}</h2>
                    <h3 style="margin:5px 0 0 0; color:#444; font-size:18px;">अपूर्ण अहवाल यादी - कालावधी: ${selMonth} ${selYear}</h3>
                </div>`;

            let hasData = false;
            let isFirstPending = true;

            for(let fName in groupedData) {
                if(groupedData[fName].length > 0) {
                    hasData = true;
                    let pbClass = isFirstPending ? "" : "page-break"; 
                    isFirstPending = false;
                    
                    html += `<div class="${pbClass}">`;
                    html += `<div class="pdf-group-header" style="background:#f8f9fa; color:#c0392b; padding:10px; font-weight:bold; font-size:16px; margin-top:10px; border:1px solid #ddd;">📄 फॉर्म: ${fName}</div>`;
                    html += `<table class="report-table pending-data-table" style="width:100%; border-collapse:collapse; margin-bottom:30px;">
                        <thead style="background:#f4f7f6;"><tr>
                        <th style="border: 1px solid #ccc; padding: 8px; width:10%; text-align:center;">अ.क्र.</th>
                        <th style="border: 1px solid #ccc; padding: 8px; text-align:left;">अहवाल अप्राप्त असणारे कर्मचारी (उपकेंद्र) - अपूर्ण गावे</th>
                        </tr></thead><tbody>`;
                    
                    let empMap = {};
                    groupedData[fName].forEach(p => { let key = p.name + "###" + p.sc; if(!empMap[key]) empMap[key] = []; empMap[key].push(p.village); });
                    let idx = 1; let sortedKeys = Object.keys(empMap).sort(); 
                    sortedKeys.forEach(key => {
                        let [empName, scName] = key.split("###"); let villagesStr = empMap[key].join(", ");
                        html += `<tr><td style="border: 1px solid #ccc; padding: 8px; text-align:center; font-weight:bold;">${idx++}</td>
                            <td style="border: 1px solid #ccc; padding: 8px; text-align:left; font-size:15px;" class="copy-target-cell">
                                <span style="color:#0056b3; font-weight:bold;">${empName}</span> - <span style="color:#d35400; font-weight:bold;">${scName}</span> <span style="color:#28a745; font-weight:bold;">(${villagesStr})</span>
                            </td></tr>`;
                    });
                    html += `</tbody></table></div>`;
                }
            }

            if(!hasData) { html = `<h3 style="text-align:center; color:green; padding:30px; font-weight:bold;">🎉 उत्कृष्ट! तुमचे सर्व अहवाल पूर्ण भरले आहेत.</h3>`; downArea.innerHTML = ""; }
            container.innerHTML = html + `</div>`; document.getElementById('reportContentArea').classList.remove('hidden');
        }

        function copyPendingListText() {
            let textToCopy = `*प्राथमिक आरोग्य केंद्र भादा - अपूर्ण अहवाल यादी*\n\n`;
            let tables = document.querySelectorAll('.pending-data-table');
            if(tables.length === 0) { alert("कॉपी करण्यासाठी कोणतीही माहिती नाही."); return; }
            let formHeaders = document.querySelectorAll('.pdf-group-header');
            tables.forEach((table, tableIndex) => {
                let formName = formHeaders[tableIndex] ? formHeaders[tableIndex].innerText.replace('📄 फॉर्म: ', '').trim() : "अहवाल";
                textToCopy += `📌 *${formName}*\n`;
                let rows = table.querySelectorAll('tbody tr');
                rows.forEach((row, rowIndex) => { let cells = row.querySelectorAll('td'); if(cells.length >= 2) { let details = cells[1].innerText.replace(/\n/g, " ").trim(); textToCopy += `${rowIndex + 1}. ${details}\n`; } });
                textToCopy += `\n`;
            });
            navigator.clipboard.writeText(textToCopy).then(() => { alert("✅ यादी यशस्वीरित्या कॉपी झाली!"); });
        }

        function getTotalsRow(data, headers, showIndices) {
            let totals = Array(headers.length).fill(0); let isNumericCol = Array(headers.length).fill(false);
            for(let c of showIndices) {
                let colName = headers[c] || "";
                if(colName.includes("मोबाईल") || colName.includes("क्रमांक") || colName === "तारीख" || colName === "महिना" || colName === "वर्ष" || colName === "उपकेंद्र" || colName === "गाव" || colName === "ग्रामपंचायत" || colName.includes("नाव") || colName.includes("स्तर")) { continue; }
                let isNum = false; let colSum = 0;
                for(let r=1; r<data.length; r++) { 
                    let cellVal = data[r][c];
                    let val = (typeof cellVal === 'object' && cellVal !== null) ? cellVal.M : String(cellVal || "").trim();
                    if(val !== "" && val !== "-") { if(!isNaN(val)) { isNum = true; colSum += parseFloat(val); } else { isNum = false; break; } } 
                }
                if(isNum) { isNumericCol[c] = true; totals[c] = formatNumberDecimals(colSum); }
            }
            return { totals, isNumericCol };
        }

        function getProgressiveTargetMonthsAndYears(selM, selY) {
            const months = ["जानेवारी", "फेब्रुवारी", "मार्च", "एप्रिल", "मे", "जून", "जुलै", "ऑगस्ट", "सप्टेंबर", "ऑक्टोबर", "नोव्हेंबर", "डिसेंबर"];
            const fyStartMonthIdx = 3; let selectedMonthIdx = months.indexOf(selM); let sYear = parseInt(selY); let result = [];
            if (selectedMonthIdx >= fyStartMonthIdx) { for(let i = fyStartMonthIdx; i <= selectedMonthIdx; i++) { result.push({m: months[i], y: String(sYear)}); } } 
            else { for(let i = fyStartMonthIdx; i <= 11; i++) { result.push({m: months[i], y: String(sYear - 1)}); } for(let i = 0; i <= selectedMonthIdx; i++) { result.push({m: months[i], y: String(sYear)}); } }
            return result;
        }

        // 🟢 REPORT FETCHING & CALCULATING LOGIC
        async function fetchReportData() {
            let selectedIDs = getSelectedReportIDs();
            if(selectedIDs.length === 0) { alert("कृपया किमान एक अहवाल निवडा!"); return; }

            const selMonth = document.getElementById('reportMonth').value; 
            const selMonthNum = monthNamesMarathi[selMonth];
            const selYear = document.getElementById('reportYear').value;
            
            let filterSubCenter = document.getElementById('reportSubCenterFilter').value; 

            document.getElementById('reportLoader').style.display = "block"; 
            document.getElementById('reportContentArea').classList.add('hidden'); 
            document.getElementById('reportTableContainer').innerHTML = "";
            
            try {
                // आर्थिक वर्षाच्या हिशोबाने एप्रिलपासून चालू महिन्यापर्यंतचा सर्व डेटा गोळा करणे
                let query = supabaseClient.from('form_responses').select('*').eq('report_year', parseInt(selYear));
                if(selMonthNum < 4) {
                    query = supabaseClient.from('form_responses').select('*')
                        .or(`and(report_year.eq.${parseInt(selYear)}),and(report_year.eq.${parseInt(selYear-1)},report_month.gte.4)`);
                }
                if(!selectedIDs.includes("ALL")) { query = query.in('form_id', selectedIDs); }

                const { data: dbData, error } = await query;
                document.getElementById('reportLoader').style.display = "none";
                
                if (error || !dbData || dbData.length === 0) { alert("डेटाबेसमध्ये माहिती उपलब्ध नाही."); return; }

                let finalReports = [];
                let formsToProcess = selectedIDs.includes("ALL") ? masterData.forms : masterData.forms.filter(f => selectedIDs.includes(f.id));

                formsToProcess.forEach(formObj => {
                    let formResp = dbData.filter(r => r.form_id === formObj.id);
                    if(formResp.length === 0) return;

                    const allFields = formObj.schema_json.fields;
                    const validDataFields = allFields.filter(f => f.type !== 'group_header');
                    const isProgressive = formObj.form_type === 'progressive';

                    let headers = ["महिना", "वर्ष", "उपकेंद्र", "गाव", "कर्मचाऱ्याचे नाव"];
                    validDataFields.forEach(f => { headers.push(getFullFieldLabel(allFields, f)); });

                    let fData = [headers];
                    const targetPeriods = getProgressiveTargetMonthsAndYears(selMonth, selYear);

                    // फक्त चालू फिल्टर महिन्याचा रिस्पॉन्स
                    let currentMonthResp = formResp.filter(r => r.report_month === parseInt(selMonthNum) && r.report_year === parseInt(selYear));

                    currentMonthResp.forEach(res => {
                        let villageObj = masterData.villages.find(v => v.id === res.village_id);
                        let empObj = masterData.employees.find(e => e.id === res.employee_id);
                        let scObj = villageObj ? masterData.subCenters.find(s => s.id === villageObj.sub_center_id) : null;
                        let scName = scObj ? scObj.name : '-';

                        if(filterSubCenter !== "सर्व" && scName !== filterSubCenter) return;

                        let row = [selMonth, selYear, scName, villageObj?villageObj.name:'-', empObj?empObj.full_name:'-'];

                        validDataFields.forEach(f => {
                            let monthlyVal = res.response_data[f.id] ? res.response_data[f.id].value : '';
                            
                            if (isProgressive && f.type === 'number') {
                                // एप्रिलपासून संचित बेरीज लॉजिक
                                let sumProg = 0;
                                targetPeriods.forEach(p => {
                                    let pastRes = formResp.find(r => 
                                        r.village_id === res.village_id && 
                                        r.report_month === monthNamesMarathi[p.m] && 
                                        r.report_year === parseInt(p.y)
                                    );
                                    if(pastRes && pastRes.response_data[f.id]) {
                                        sumProg += parseFloat(pastRes.response_data[f.id].value) || 0;
                                    }
                                });
                                row.push({ M: formatNumberDecimals(monthlyVal), P: formatNumberDecimals(sumProg) });
                            } else {
                                row.push(formatNumberDecimals(monthlyVal));
                            }
                        });
                        fData.push(row);
                    });

                    if(fData.length > 1) {
                        finalReports.push({ formName: formObj.form_name, data: fData, isProg: isProgressive });
                    }
                });

                if(finalReports.length > 0) { 
                    currentReports = finalReports; 
                    renderMultipleTables(finalReports, selMonth, selYear); 
                    document.getElementById('reportContentArea').classList.remove('hidden'); 
                } else { alert("डेटा उपलब्ध नाही."); }

            } catch(e) { document.getElementById('reportLoader').style.display = "none"; alert("एरर: " + e.message); }
        }

        function renderMultipleTables(reports, month, year) {
            let container = document.getElementById('reportTableContainer');
            let groupType = document.getElementById('reportGroupFilter').value;
            let filterSubCenter = document.getElementById('reportSubCenterFilter').value;

            let actionBtnsHtml = `<div class="no-print" style="display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap;">
                <button onclick="downloadConsolidatedExcel()" style="flex:1; min-width:200px; background:#28a745; color:white; border:none; padding:12px; border-radius:5px; cursor:pointer; font-weight:bold; font-size: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">📥 Excel (.xlsx) डाऊनलोड</button>
                <button id="btnPdfDownload" onclick="downloadConsolidatedPDF()" style="flex:1; min-width:200px; background:#dc3545; color:white; border:none; padding:12px; border-radius:5px; cursor:pointer; font-weight:bold; font-size: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">📥 PDF प्रिंट / डाऊनलोड करा</button>
            </div>`;
            
            let html = actionBtnsHtml;
            let isFirstReport = true; 
            let phcHeader = filterSubCenter === 'सर्व' ? "प्राथमिक आरोग्य केंद्र भादा" : `प्राथमिक आरोग्य केंद्र भादा (उपकेंद्र: ${filterSubCenter})`;
            let periodText = `${month} ${year}`;

            reports.forEach(rep => {
                let data = rep.data; let headers = data[0];
                let showIndices = []; for(let i=5; i<headers.length; i++) showIndices.push(i);
                let subCenterIdx = 2; let villageIdx = 3;
                let dataRows = data.slice(1);
                
                // उपकेंद्र स्तरावर डेटा एकत्रित करणे (Roll up Summary)
                if ((groupType === "SubCenter" || groupType === "SubCenterConsolidated")) {
                    let aggregated = {};
                    dataRows.forEach(row => {
                        let sc = String(row[subCenterIdx] || "").trim();
                        if (!aggregated[sc]) {
                            aggregated[sc] = Array(headers.length).fill(0);
                            headers.forEach((h, idx) => { if (!showIndices.includes(idx)) aggregated[sc][idx] = row[idx]; });
                            aggregated[sc][villageIdx] = "एकत्रित (All Villages)";
                            aggregated[sc][subCenterIdx] = sc;
                        }
                        showIndices.forEach(idx => {
                            let val = row[idx];
                            if (typeof val === 'object' && val !== null) {
                                if (typeof aggregated[sc][idx] !== 'object') aggregated[sc][idx] = { M: 0, P: 0 };
                                aggregated[sc][idx].M += parseFloat(val.M || 0); aggregated[sc][idx].P += parseFloat(val.P || 0);
                            } else {
                                let n = parseFloat(val); if (!isNaN(n)) aggregated[sc][idx] = (parseFloat(aggregated[sc][idx]) || 0) + n; else aggregated[sc][idx] = val; 
                            }
                        });
                    });
                    dataRows = Object.values(aggregated);
                }

                let pbClass = isFirstReport ? "" : "page-break"; isFirstReport = false;

                html += `<div class="${pbClass}" style="background:white; padding:15px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1); margin-bottom:20px;">`;
                html += `<div class="report-header" style="text-align:center; border-bottom:2px solid var(--primary); padding-bottom:10px; margin-bottom:15px;">
                    <h2 style="margin:0; color:var(--primary); font-size:22px;">${phcHeader}</h2>
                    <h3 style="margin:5px 0 0 0; color:#555; font-size:16px;">अहवालाचे नाव: ${rep.formName} | कालावधी: ${periodText}</h3>
                </div>`;

                if(groupType === "SubCenterConsolidated") {
                    // 📊 प्रगत उभी एकत्रित मांडणी (Vertical Layout Rendering)
                    let r1Html = `<tr><th rowspan="${rep.isProg ? 2 : 1}" style="background:#f4b400; color:#000; border:1px solid #ddd; text-align:center;">अ.क्र.</th><th rowspan="${rep.isProg ? 2 : 1}" style="background:#f4b400; color:#000; border:1px solid #ddd; text-align:center;">तपशील / प्रश्न</th>`;
                    let r2Html = rep.isProg ? `<tr>` : "";
                    
                    dataRows.forEach((row) => {
                        let vName = row[subCenterIdx] || "-";
                        r1Html += `<th colspan="${rep.isProg ? 2 : 1}" style="background:#ffe082; color:#000; border:1px solid #ddd; text-align:center;">${vName}</th>`;
                        if (rep.isProg) { r2Html += `<th style="background:#fff3e0; color:#000; border:1px solid #ddd; text-align:center; font-size:12px;">मासिक</th><th style="background:#fff3e0; color:#000; border:1px solid #ddd; text-align:center; font-size:12px;">प्रगत</th>`; }
                    });
                    r1Html += `<th colspan="${rep.isProg ? 2 : 1}" style="background:#81c784; color:#000; border:1px solid #ddd; text-align:center;">एकूण बेरीज</th></tr>`;
                    if (rep.isProg) { r2Html += `<th style="background:#c8e6c9; color:#000; border:1px solid #ddd; text-align:center; font-size:12px;">मासिक</th><th style="background:#c8e6c9; color:#000; border:1px solid #ddd; text-align:center; font-size:12px;">प्रगत</th></tr>`; }

                    let tbodyHtml = "";
                    showIndices.forEach((idx, vIndex) => {
                        tbodyHtml += `<tr><td style="background:#fdfdfd; text-align:center;">${vIndex+1}</td><td style="background:#fdfdfd; text-align:left; font-weight:bold;">${headers[idx]}</td>`;
                        let rowTotM = 0; let rowTotP = 0;
                        dataRows.forEach(row => {
                            let val = row[idx]; 
                            let m = (typeof val === 'object' && val !== null) ? val.M : val;
                            tbodyHtml += `<td>${m !== undefined && m !== "" ? formatNumberDecimals(m) : "-"}</td>`; if(!isNaN(parseFloat(m))) rowTotM += parseFloat(m);
                            if(rep.isProg) { let p = (typeof val === 'object' && val !== null) ? val.P : val; tbodyHtml += `<td>${p !== undefined && p !== "" ? formatNumberDecimals(p) : "-"}</td>`; if(!isNaN(parseFloat(p))) rowTotP += parseFloat(p); }
                        });
                        tbodyHtml += `<td style="font-weight:bold; background:#e8f5e9;">${formatNumberDecimals(rowTotM)}</td>`;
                        if(rep.isProg) tbodyHtml += `<td style="font-weight:bold; background:#e8f5e9;">${formatNumberDecimals(rowTotP)}</td>`;
                        tbodyHtml += `</tr>`;
                    });
                    html += `<div class="table-responsive"><table class="report-table"><thead>${r1Html + r2Html}</thead><tbody>${tbodyHtml}</tbody></table></div>`;
                } else {
                    // 📊 आडवी मांडणी व्यवस्था (Horizontal Wise Layout)
                    html += `<div class="table-responsive"><table class="report-table"><thead><tr><th style="background:#f4b400; color:#000;">अ.क्र.</th><th style="background:#f4b400; color:#000;">${groupType !== 'Village' ? 'उपकेंद्र' : 'गाव'}</th>`;
                    showIndices.forEach(idx => {
                        if (rep.isProg) {
                            html += `<th style="background:#f4b400; color:#000;">${headers[idx]} (मासिक)</th>`;
                            html += `<th style="background:#f4b400; color:#000;">${headers[idx]} (प्रगत)</th>`;
                        } else { html += `<th style="background:#f4b400; color:#000;">${headers[idx]}</th>`; }
                    });
                    html += `</tr></thead><tbody>`;
                    dataRows.forEach((row, i) => {
                        html += `<tr><td style="background:#fdfdfd;">${i+1}</td><td style="background:#fdfdfd;">${groupType !== 'Village' ? row[subCenterIdx] : (row[villageIdx] || "-")}</td>`;
                        showIndices.forEach(idx => {
                            let v = row[idx];
                            if (rep.isProg && typeof v === 'object' && v !== null) {
                                html += `<td>${formatNumberDecimals(v.M)}</td><td>${formatNumberDecimals(v.P)}</td>`;
                            } else { html += `<td>${v !== undefined && v !== "" ? formatNumberDecimals(v) : "-"}</td>`; }
                        });
                        html += `</tr>`;
                    });
                    
                    // बेरीज रो जोडणे
                    let { totals, isNumericCol } = getTotalsRow([headers].concat(dataRows), headers, showIndices);
                    html += `<tr style="background:#d4edda; font-weight:bold; color:#155724;"><td style="background:#d4edda;">#</td><td style="background:#d4edda;">एकूण (PHC Total)</td>`;
                    showIndices.forEach(idx => {
                        let v = totals[idx];
                        if(rep.isProg) {
                            let colSumM = 0; let colSumP = 0;
                            dataRows.forEach(r => { if(typeof r[idx] === 'object') { colSumM += parseFloat(r[idx].M || 0); colSumP += parseFloat(r[idx].P || 0); } });
                            html += `<td>${formatNumberDecimals(colSumM)}</td><td>${formatNumberDecimals(colSumP)}</td>`;
                        } else { html += `<td>${isNumericCol[idx] ? v : '-'}</td>`; }
                    });
                    html += `</tr></tbody></table></div>`;
                }
                html += `</div>`;
            });
            container.innerHTML = html;
        }

        // 🟢 PRINT WINDOW PDF HANDLER
        function downloadConsolidatedPDF() {
            window.print();
        }

        // 🟢 📥 प्रिट प्रिव्ह्यू फॉरमॅटशी १००% मॅच होणारे व्यावसायिक एक्सेल निर्मिती इंजिन
        function downloadConsolidatedExcel() {
            if(currentReports.length === 0) return;

            let groupType = document.getElementById('reportGroupFilter').value;
            let wb = XLSX.utils.book_new();
            let month = document.getElementById('reportMonth').value; 
            let year = document.getElementById('reportYear').value;
            let periodText = `${month} ${year}`;
            let phcHeader = "प्राथमिक आरोग्य केंद्र भादा, तालुका औसा";

            currentReports.forEach((rep, index) => {
                let headers = rep.data[0]; let showIndices = []; 
                for(let i=5; i<headers.length; i++) showIndices.push(i);
                
                let subCenterIdx = 2; let villageIdx = 3;
                let dataRows = rep.data.slice(1);

                // उपकेंद्र रोलअप आकडेवारी गोळा करणे
                if ((groupType === "SubCenter" || groupType === "SubCenterConsolidated")) {
                    let aggregated = {};
                    dataRows.forEach(row => {
                        let sc = String(row[subCenterIdx] || "").trim();
                        if (!aggregated[sc]) {
                            aggregated[sc] = Array(headers.length).fill(0);
                            headers.forEach((h, idx) => { if (!showIndices.includes(idx)) aggregated[sc][idx] = row[idx]; });
                            aggregated[sc][villageIdx] = "एकत्रित (All Villages)"; aggregated[sc][subCenterIdx] = sc;
                        }
                        showIndices.forEach(idx => {
                            let val = row[idx];
                            if (typeof val === 'object' && val !== null) {
                                if (typeof aggregated[sc][idx] !== 'object') aggregated[sc][idx] = { M: 0, P: 0 };
                                aggregated[sc][idx].M += parseFloat(val.M || 0); aggregated[sc][idx].P += parseFloat(val.P || 0);
                            } else {
                                let n = parseFloat(val); if (!isNaN(n)) aggregated[sc][idx] = (parseFloat(aggregated[sc][idx]) || 0) + n; else aggregated[sc][idx] = val;
                            }
                        });
                    });
                    dataRows = Object.values(aggregated);
                }

                let sheetData = []; let merges = []; let headerRowIndices = [];
                let reportHeader = `अहवालाचे नाव: ${rep.formName} | कालावधी: ${periodText}`;
                
                sheetData.push([phcHeader]); 
                sheetData.push([reportHeader]); 
                sheetData.push([]); 

                let startR = 3;

                if (groupType === "SubCenterConsolidated") {
                    // 📊 उभ्या मांडणीनुसार गुगल शीट मॅपिंग इंजिन (Vertical Mode)
                    let verticalColCount = 2 + (dataRows.length * (rep.isProg ? 2 : 1)) + (rep.isProg ? 2 : 1);
                    merges.push({ s: { r: 0, c: 0 }, e: { r: 0, c: verticalColCount - 1 } });
                    merges.push({ s: { r: 1, c: 0 }, e: { r: 1, c: verticalColCount - 1 } });

                    let r1 = Array(verticalColCount).fill(""); let r2 = rep.isProg ? Array(verticalColCount).fill("") : null;
                    let currentR = startR; 
                    r1[0] = "अ.क्र."; r1[1] = "तपशील / आरोग्य निर्देशांक प्रश्न";
                    if(rep.isProg) { merges.push({ s: { r: currentR, c: 0 }, e: { r: currentR + 1, c: 0 } }); merges.push({ s: { r: currentR, c: 1 }, e: { r: currentR + 1, c: 1 } }); }

                    let ccIdx = 2;
                    dataRows.forEach(row => {
                        r1[ccIdx] = row[subCenterIdx] || "-";
                        if(rep.isProg) { merges.push({ s: { r: currentR, c: ccIdx }, e: { r: currentR, c: ccIdx + 1 } }); r2[ccIdx] = "मासिक"; r2[ccIdx+1] = "प्रगत"; ccIdx += 2; } else { ccIdx += 1; }
                    });
                    r1[ccIdx] = "एकूण एकत्रित बेरीज";
                    if(rep.isProg) { merges.push({ s: { r: currentR, c: ccIdx }, e: { r: currentR, c: ccIdx + 1 } }); r2[ccIdx] = "मासिक"; r2[ccIdx+1] = "प्रगत"; }

                    sheetData.push(r1); headerRowIndices.push(currentR); currentR++;
                    if(rep.isProg) { sheetData.push(r2); headerRowIndices.push(currentR); }

                    showIndices.forEach((idx, vIndex) => {
                        let rowData = Array(verticalColCount).fill(""); rowData[0] = vIndex + 1; rowData[1] = String(headers[idx]).trim();
                        let cc = 2; let rowTotalM = 0; let rowTotalP = 0;
                        dataRows.forEach(r => {
                            let val = r[idx]; let mObj = (typeof val === 'object' && val !== null) ? val.M : val;
                            rowData[cc] = mObj !== undefined && mObj !== "" ? Number(mObj) : 0; if(!isNaN(parseFloat(mObj))) rowTotalM += parseFloat(mObj); cc++;
                            if(rep.isProg) { let pObj = (typeof val === 'object' && val !== null) ? val.P : val; rowData[cc] = pObj !== undefined && pObj !== "" ? Number(pObj) : 0; if(!isNaN(parseFloat(pObj))) rowTotalP += parseFloat(pObj); cc++; }
                        });
                        rowData[cc] = formatNumberDecimals(rowTotalM); cc++; if(rep.isProg) rowData[cc] = formatNumberDecimals(rowTotalP);
                        sheetData.push(rowData); 
                    });
                } else {
                    // 📊 आडव्या मांडणीनुसार गुगल शीट मॅपिंग इंजिन (Horizontal Mode)
                    let modifiedHeaders = ["अ.क्र.", groupType !== 'Village' ? 'उपकेंद्र' : 'गाव'];
                    showIndices.forEach(idx => {
                        if (rep.isProg) { modifiedHeaders.push(headers[idx] + " - (मासिक)"); modifiedHeaders.push(headers[idx] + " - (प्रगत)"); } 
                        else { modifiedHeaders.push(headers[idx]); }
                    });
                    
                    merges.push({ s: { r: 0, c: 0 }, e: { r: 0, c: modifiedHeaders.length - 1 } });
                    merges.push({ s: { r: 1, c: 0 }, e: { r: 1, c: modifiedHeaders.length - 1 } });
                    sheetData.push(modifiedHeaders); headerRowIndices.push(startR);

                    dataRows.forEach((r, rowIndex) => {
                        let rowData = [rowIndex + 1, groupType !== 'Village' ? r[subCenterIdx] : (r[villageIdx] || "-")];
                        showIndices.forEach(colIdx => { 
                            let v = r[colIdx]; 
                            if (rep.isProg && typeof v === 'object' && v !== null) { rowData.push(Number(v.M)); rowData.push(Number(v.P)); } 
                            else { rowData.push(v !== "" && !isNaN(v) ? Number(v) : v); }
                        });
                        sheetData.push(rowData);
                    });

                    // PHC Total बेरीज ओळ भरणे
                    let totalRow = ["एकूण बेरीज", "प्रा. आ. केंद्र टोटल"];
                    showIndices.forEach(idx => {
                        let colSumM = 0; let colSumP = 0;
                        dataRows.forEach(r => { 
                            let v = r[idx]; 
                            if (typeof v === 'object' && v !== null) { colSumM += parseFloat(v.M || 0); colSumP += parseFloat(v.P || 0); } 
                            else { colSumM += parseFloat(v || 0); } 
                        });
                        if (rep.isProg) { totalRow.push(formatNumberDecimals(colSumM)); totalRow.push(formatNumberDecimals(colSumP)); } 
                        else { totalRow.push(formatNumberDecimals(colSumM)); }
                    });
                    sheetData.push(totalRow); headerRowIndices.push(sheetData.length - 1);
                }

                // 💎 स्टाईल इंजिन डेकोरेशन कोड रन करणे (Professional Dark Green Header Style)
                let ws = XLSX.utils.aoa_to_sheet(sheetData); ws["!merges"] = merges;
                for(let R=0; R<sheetData.length; R++) {
                    for(let C=0; C<verticalColCount || C<50; C++) { 
                        let cellRef = XLSX.utils.encode_cell({r: R, c: C}); if(!ws[cellRef]) continue;
                        let cellStyle = { font: { name: "Arial", sz: 11, color: { rgb: "000000" } }, alignment: { vertical: "center", horizontal: "center", wrapText: true } };
                        if(R === 0) { cellStyle.fill = { fgColor: { rgb: "00705A" } }; cellStyle.font = { name: "Arial", sz: 14, bold: true, color: { rgb: "FFFFFF" } }; } 
                        else if(R === 1) { cellStyle.fill = { fgColor: { rgb: "E8F5E9" } }; cellStyle.font = { name: "Arial", sz: 12, bold: true, color: { rgb: "00705A" } }; } 
                        else if(headerRowIndices.includes(R)) { cellStyle.fill = { fgColor: { rgb: "F4B400" } }; cellStyle.font = { name: "Arial", sz: 11, bold: true, color: { rgb: "000000" } }; cellStyle.border = { top: { style: "thin" }, bottom: { style: "thin" }, left: { style: "thin" }, right: { style: "thin" } }; } 
                        else { cellStyle.border = { top: { style: "thin" }, bottom: { style: "thin" }, left: { style: "thin" }, right: { style: "thin" } }; if (groupType === "SubCenterConsolidated" && C === 1) cellStyle.alignment.horizontal = "left"; }
                        ws[cellRef].s = cellStyle;
                    }
                }
                let wscols = [{ wch: 8 }]; if (groupType === "SubCenterConsolidated") { wscols.push({ wch: 45 }); for(let c=2; c<100; c++) wscols.push({ wch: 14 }); } else { wscols.push({ wch: 18 }); for(let c=wscols.length; c<100; c++) wscols.push({ wch: 15 }); }
                ws["!cols"] = wscols;
                
                let safeSheetName = rep.formName.replace(/[\\\/\?\*\[\]\:]/g, "").substring(0, 31);
                XLSX.utils.book_append_sheet(wb, ws, safeSheetName || "Sheet1");
            });

            XLSX.writeFile(wb, `मासिक_अहवाल_${groupType}_${periodText.replace(/ /g, "_")}.xlsx`);
        }
    </script>
