    <script>
        // 🟢 सुधारित Date Formatter
        function formatDateToDDMMYYYY(val) {
            if (val === null || val === undefined || val === "") return "";
            let sVal = String(val).trim();
            
            // 1. जर जुना एक्सेल नंबर असेल (उदा. 45396)
            let numVal = Number(sVal);
            if (!isNaN(numVal) && numVal > 30000 && numVal < 60000) {
                let jsDate = new Date(Math.round((numVal - 25569) * 86400 * 1000));
                if (!isNaN(jsDate.getTime())) {
                    return `${String(jsDate.getUTCDate()).padStart(2, '0')}-${String(jsDate.getUTCMonth() + 1).padStart(2, '0')}-${jsDate.getUTCFullYear()}`;
                }
            }
            
            // 2. जर ISO Date असेल (YYYY-MM-DD)
            if (sVal.match(/^\d{4}-\d{2}-\d{2}/)) {
                let parts = sVal.split('T')[0].split('-');
                return `${parts[2]}-${parts[1]}-${parts[0]}`;
            }
            
            return sVal;
        }
