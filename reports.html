<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>प्रगत अहवाल केंद्र - प्राथमिक आरोग्य केंद्र भादा</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #00705a; }
        .report-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; table-layout: auto; }
        .report-table th, .report-table td { border: 1px solid #000; padding: 6px; text-align: center; word-wrap: break-word; }
        .report-table th { background-color: #f4f7f6; font-weight: bold; color: #333; }
        .page-break { page-break-before: always !important; display: block; }
        .table-responsive { width: 100%; overflow-x: auto; }
        @media print {
            .no-print { display: none !important; }
            body { background: #fff; padding: 0; }
            .report-table th { background-color: #e9ecef !important; color: #000 !important; }
        }
    </style>
</head>
<body class="bg-gray-100 p-6 min-h-screen">

    <div class="max-w-7xl mx-auto bg-white p-4 rounded-lg shadow-md flex justify-between items-center mb-6 no-print">
        <div>
            <h1 class="text-xl font-bold text-green-700">📊 प्रगत अहवाल केंद्र (मर्ज हेडर प्रणाली)</h1>
            <p class="text-xs text-gray-500">प्राथमिक आरोग्य केंद्र भादा, तालुका औसा</p>
        </div>
        <button onclick="window.location.href='dashboard.html'" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 transition text-sm font-bold">डॅशबोर्डवर परत जा</button>
    </div>

    <div class="max-w-7xl mx-auto bg-white p-6 rounded-lg shadow-md border-t-4 border-green-700 mb-6 no-print">
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
            <div class="relative" id="multiSelectContainer">
                <label class="block text-gray-700 text-xs font-bold mb-1">अहवाल / फॉर्म निवडा</label>
                <button onclick="toggleMultiSelect()" class="w-full p-2 border rounded bg-white text-left text-sm font-medium flex justify-between items-center min-h-[38px]">
                    <span id="multiSelectBtnText">सर्व अहवाल (All Forms)</span>
                    <span class="text-xs text-gray-400">▼</span>
                </button>
                <div id="multiSelectDropdown" class="absolute left-0 right-0 mt-1 bg-white border rounded shadow-lg z-50 max-h-60 overflow-y-auto hidden">
                    <div class="p-2 border-b bg-gray-50">
                        <label class="flex items-center gap-2 font-bold text-xs text-green-700 cursor-pointer">
                            <input type="checkbox" id="chkAllReports" checked onchange="toggleAllReports(this)" class="w-4 h-4"> 
                            सर्व फॉर्म्स निवडा (Select All)
                        </label>
                    </div>
                    <div id="multiSelectOptions" class="text-xs"></div>
                </div>
                <select id="reportFormSelect" class="hidden"></select>
            </div>

            <div>
                <label class="block text-gray-700 text-xs font-bold mb-1">अहवाल महिना</label>
                <select id="reportMonth" class="w-full p-2 border rounded bg-white text-sm">
                    <option value="जानेवारी">जानेवारी</option><option value="फेब्रुवारी">फेब्रुवारी</option>
                    <option value="मार्च">मार्च</option><option value="एप्रिल">एप्रिल</option>
                    <option value="मे">मे</option><option value="जून">जून</option>
                    <option value="जुलै">जुलै</option><option value="ऑगस्ट">ऑगस्ट</option>
                    <option value="सप्टेंबर">सप्टेंबर</option><option value="ऑक्टोबर">ऑक्टोबर</option>
                    <option value="नोव्हेंबर">नोव्हेंबर</option><option value="डिसेंबर">डिसेंबर</option>
                </select>
            </div>

            <div>
                <label class="block text-gray-700 text-xs font-bold mb-1">अहवाल वर्ष</label>
                <input type="number" id="reportYear" class="w-full p-2 border rounded text-sm font-mono" value="2026">
            </div>

            <div>
                <label class="block text-gray-700 text-xs font-bold mb-1">उपकेंद्र फिल्टर</label>
                <select id="reportSubCenterFilter" class="w-full p-2 border rounded bg-white text-sm">
                    <option value="सर्व">सर्व उपकेंद्र (All Sub-centers)</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 border-t pt-4">
            <div>
                <label class="block text-gray-700 text-xs font-bold mb-1">अहवाल मांडणी प्रकार (Group View)</label>
                <select id="reportGroupFilter" class="w-full p-2 border rounded bg-white text-sm font-medium text-purple-700">
                    <option value="Village">गाव स्तरावर स्वतंत्र यादी (Village Wise)</option>
                    <option value="SubCenter">उपकेंद्र स्तरावर स्वतंत्र यादी</option>
                    <option value="SubCenterConsolidated">उपकेंद्र एकत्रित उभी मांडणी (Vertical Consolidated)</option>
                </select>
            </div>
            
            <div class="flex items-end gap-2 md:col-span-2">
                <button onclick="fetchReportData()" class="flex-1 bg-blue-600 text-white font-bold p-2 rounded text-sm hover:bg-blue-700 shadow transition">🔍 अहवाल पहा (Show Report)</button>
                <button onclick="generatePendingReport()" class="flex-1 bg-red-600 text-white font-bold p-2 rounded text-sm hover:bg-red-700 shadow transition">⚠️ अपूर्ण यादी शोधा (Pending)</button>
            </div>
        </div>

    </div>

    <div id="reportLoader" class="text-center py-10 hidden no-print">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-green-700 border-t-transparent mb-2"></div>
        <p class="text-gray-500 font-medium text-sm">डेटाबेस मधून प्रगत अहवाल आकडेमोड सुरू आहे, कृपया थांबा...</p>
    </div>

    <div id="downloadButtonsArea" class="max-w-7xl mx-auto mb-4 no-print"></div>

    <div id="reportContentArea" class="max-w-7xl mx-auto bg-white p-6 rounded-lg shadow-md hidden">
        <div id="reportTableContainer"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qbmjsfiievcautxybaai.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_sdgZ9G8ko4H_3Mh9RouYFg_JOQ-4Mdx'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let masterData = { forms: [], villages: [], employees: [], filledStats: [], subCenters: [] };
        let currentReports = [];
        let user = { role: 'Admin', subcenter: 'सर्व', mobile: '' };

        const monthNamesMarathi = {
            "जानेवारी": 1, "फेब्रुवारी": 2, "मार्च": 3, "एप्रिल": 4, "मे": 5, "जून": 6,
            "जुलै": 7, "ऑगस्ट": 8, "सप्टेंबर": 9, "ऑक्टोबर": 10, "नोव्हेंबर": 11, "डिसेंबर": 12
        };
        const monthNamesNumeric = {
            1: "जानेवारी", 2: "फेब्रुवारी", 3: "मार्च", 4: "एप्रिल", 5: "मे", 6: "जून",
            7: "जुलै", 8: "ऑगस्ट", 9: "सप्टेंबर", 10: "ऑक्टोबर", 11: "नोव्हेंबर", 12: "डिसेंबर"
        };

        window.onload = async function() {
            const userDataString = localStorage.getItem('loggedInUser');
            if (!userDataString) { window.location.href = "index.html"; return; }
            const sessionUser = JSON.parse(userDataString);
            user.role = sessionUser.role === 'admin' ? 'Admin' : 'User';
            user.mobile = sessionUser.mobile_number || '';

            const mIdx = new Date().getMonth() + 1;
            document.getElementById('reportMonth').value = monthNamesNumeric[mIdx];
            document.getElementById('reportYear').value = new Date().getFullYear();

            await loadInitialMasterData();
        };

        function formatNumberDecimals(val) {
            if (val === "" || val === null || val === undefined || val === "-" || String(val).trim() === "") return val;
            let n = Number(val);
            if (!isNaN(n)) { return Number.isInteger(n) ? n : parseFloat(n.toFixed(2)); }
            return val;
        }

        function toggleMultiSelect() {
            let dropdown = document.getElementById('multiSelectDropdown');
            dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
        }

        document.addEventListener('click', function(event) {
            let container = document.getElementById('multiSelectContainer');
            if (container && !container.contains(event.target)) {
                document.getElementById('multiSelectDropdown').style.display = 'none';
            }
        });

        async function loadInitialMasterData() {
            const { data: scData } = await supabaseClient.from('sub_centers').select('*').order('name');
            masterData.subCenters = scData || [];
            
            let scFilter = document.getElementById('reportSubCenterFilter');
            scFilter.innerHTML = '<option value="सर्व">सर्व उपकेंद्र (All Sub-centers)</option>';
            masterData.subCenters.forEach(sc => {
                scFilter.innerHTML += `<option value="${sc.name}">${sc.name}</option>`;
            });

            const { data: vData } = await supabaseClient.from('villages').select('*').order('name');
            masterData.villages = vData || [];

            const { data: empData } = await supabaseClient.from('employees').select('*').order('full_name');
            masterData.employees = empData || [];

            const { data: formData } = await supabaseClient.from('dynamic_forms').select('*').eq('is_active', true);
            masterData.forms = formData || [];

            let select = document.getElementById('reportFormSelect');
            let optionsDiv = document.getElementById('multiSelectOptions');
            select.innerHTML = ''; optionsDiv.innerHTML = '';

            masterData.forms.forEach(f => {
                let opt = document.createElement('option');
                opt.value = f.id; opt.text = f.form_name;
                select.appendChild(opt);

                let div = document.createElement('div');
                div.className = "hover:bg-gray-50";
                div.style.padding = "8px"; div.style.borderBottom = "1px solid #eee"; div.style.cursor = "pointer";
                div.innerHTML = `<label style="cursor:pointer; display:flex; align-items:center; gap:6px; font-weight:600;">
                    <input type="checkbox" class="report-chk" value="${f.id}" checked onchange="checkIndividualReport()"> 
                    ${f.form_name}
                </label>`;
                optionsDiv.appendChild(div);
            });

            const { data: respData } = await supabaseClient.from('form_responses').select('form_id, village_id, report_month, report_year');
            masterData.filledStats = respData || [];

            document.getElementById('chkAllReports').checked = true;
            updateMultiSelectText();
        }

        function toggleAllReports(chkAll) {
            let checkboxes = document.querySelectorAll('.report-chk');
            checkboxes.forEach(chk => chk.checked = chkAll.checked);
            updateMultiSelectText();
        }

        function checkIndividualReport() {
            let checkboxes = document.querySelectorAll('.report-chk');
            let allChecked = true;
            checkboxes.forEach(chk => { if(!chk.checked) allChecked = false; });
            document.getElementById('chkAllReports').checked = allChecked;
            updateMultiSelectText();
        }

        function updateMultiSelectText() {
            let chkAll = document.getElementById('chkAllReports');
            let textSpan = document.getElementById('multiSelectBtnText');
            if(chkAll && chkAll.checked) {
                textSpan.innerText = "सर्व अहवाल (All Forms)";
                textSpan.style.color = "var(--primary)";
            } else {
                let selected = document.querySelectorAll('.report-chk:checked');
                if(selected.length === 0) {
                    textSpan.innerText = "-- कोणताही अहवाल निवडलेला नाही --";
                    textSpan.style.color = "red";
                } else if(selected.length === 1) {
                    let lbl = selected[0].parentElement.innerText.trim();
                    textSpan.innerText = lbl.length > 35 ? lbl.substring(0, 35) + "..." : lbl;
                    textSpan.style.color = "#d35400";
                } else {
                    textSpan.innerText = `✔️ ${selected.length} अहवाल निवडले`;
                    textSpan.style.color = "green";
                }
            }
        }

        function getSelectedReportIDs() {
            let chkAll = document.getElementById('chkAllReports');
            if(chkAll && chkAll.checked) return ["ALL"];
            let selected = [];
            document.querySelectorAll('.report-chk:checked').forEach(chk => selected.push(chk.value));
            return selected;
        }

        function generatePendingReport() {
            const selMonth = document.getElementById('reportMonth').value;
            const selMonthNum = monthNamesMarathi[selMonth];
            const selYear = document.getElementById('reportYear').value;
            let selectedIDs = getSelectedReportIDs();
            if (selectedIDs.length === 0) { alert("कृपया किमान एक अहवाल निवडा!"); return; }

            let groupedData = {}; 
            let filterSubCenter = document.getElementById('reportSubCenterFilter').value;
            let formsToCheck = masterData.forms;
            if(!selectedIDs.includes("ALL")) { formsToCheck = formsToCheck.filter(f => selectedIDs.includes(f.id)); }

            formsToCheck.forEach(f => {
                groupedData[f.form_name] = [];
                masterData.employees.forEach(u => {
                    if (user.role !== "Admin" && String(u.mobile_number).trim() !== String(user.mobile).trim()) return;
                    let scObj = masterData.subCenters.find(s => s.id === u.sub_center_id);
                    let scName = scObj ? scObj.name : "Unknown";
                    if (user.role === "Admin" && filterSubCenter !== "सर्व" && scName !== filterSubCenter) return;

                    let userVillages = masterData.villages.filter(v => v.sub_center_id === u.sub_center_id);
                    userVillages.forEach(v => {
                        let isFilled = masterData.filledStats.some(h => 
                            h.form_id === f.id && h.village_id === v.id && 
                            h.report_month === parseInt(selMonthNum) && h.report_year === parseInt(selYear)
                        );
                        if (!isFilled) { groupedData[f.form_name].push({ sc: scName, name: u.full_name, role: u.role, village: v.name }); }
                    });
                });
            });

            let container = document.getElementById('reportTableContainer');
            let downArea = document.getElementById('downloadButtonsArea');
            downArea.innerHTML = `<div class="no-print flex justify-end gap-2 mb-3"><button onclick="copyPendingListText()" class="bg-gray-600 text-white px-4 py-2 rounded text-xs font-bold shadow">📋 यादी कॉपी करा</button><button onclick="window.print()" class="bg-red-600 text-white px-4 py-2 rounded text-xs font-bold shadow">📥 PDF प्रिंट करा</button></div>`;
            let phcHeader = filterSubCenter === 'सर्व' ? "प्राथमिक आरोग्य केंद्र भादा" : `प्राथमिक आरोग्य केंद्र भादा (उपकेंद्र: ${filterSubCenter})`;

            let html = `<div id="pdfExportArea" class="pdf-container"><div style="text-align:center; border-bottom: 2px solid var(--primary); padding-bottom:10px; margin-bottom:20px;"><h2 style="margin:0; color:var(--primary); font-size:24px;">${phcHeader}</h2><h3 style="margin:5px 0 0 0; color:#444; font-size:18px;">अपूर्ण अहवाल यादी - कालावधी: ${selMonth} ${selYear}</h3></div>`;
            let hasData = false; let isFirstPending = true;

            for(let fName in groupedData) {
                if(groupedData[fName].length > 0) {
                    hasData = true; let pbClass = isFirstPending ? "" : "page-break"; isFirstPending = false;
                    html += `<div class="${pbClass}"><div class="pdf-group-header" style="background:#f8f9fa; color:#c0392b; padding:10px; font-weight:bold; font-size:16px; margin-top:10px; border:1px solid #ddd;">📄 फॉर्म: ${fName}</div><table class="report-table pending-data-table" style="width:100%; border-collapse:collapse; margin-bottom:30px;"><thead style="background:#f4f7f6;"><tr><th style="border: 1px solid #ccc; padding: 8px; width:10%; text-align:center;">अ.क्र.</th><th style="border: 1px solid #ccc; padding: 8px; text-align:left;">अहवाल प्रलंबित असणारे कर्मचारी (उपकेंद्र) - अपूर्ण गावे</th></tr></thead><tbody>`;
                    let empMap = {}; groupedData[fName].forEach(p => { let key = p.name + "###" + p.sc; if(!empMap[key]) empMap[key] = []; empMap[key].push(p.village); });
                    let sortedKeys = Object.keys(empMap).sort();
                    sortedKeys.forEach((key, idx) => {
                        let [empName, scName] = key.split("###"); let villagesStr = empMap[key].join(", ");
                        html += `<tr><td style="border: 1px solid #ccc; padding: 8px; text-align:center; font-weight:bold;">${idx+1}</td><td style="border: 1px solid #ccc; padding: 8px; text-align:left; font-size:15px;"><span style="color:#0056b3; font-weight:bold;">${empName}</span> - <span style="color:#d35400; font-weight:bold;">${scName}</span> <span style="color:#28a745; font-weight:bold;">(${villagesStr})</span></td></tr>`;
                    });
                    html += `</tbody></table></div>`;
                }
            }
            if(!hasData) { html = `<h3 style="text-align:center; color:green; padding:30px; font-weight:bold;">🎉 उत्कृष्ट! तुमचे सर्व अहवाल पूर्ण भरले आहेत.</h3>`; downArea.innerHTML = ""; }
            container.innerHTML = html + `</div>`; document.getElementById('reportContentArea').classList.remove('hidden');
        }

        function copyPendingListText() {
            let textToCopy = `*प्राथमिक आरोग्य केंद्र भादा - अपूर्ण अहवाल यादी*\n\n`;
            let tables = document.querySelectorAll('.pending-data-table'); if(tables.length === 0) return;
            let formHeaders = document.querySelectorAll('.pdf-group-header');
            tables.forEach((table, tableIndex) => {
                let formName = formHeaders[tableIndex] ? formHeaders[tableIndex].innerText.replace('📄 फॉर्म: ', '').trim() : "अहवाल";
                textToCopy += `📌 *${formName}*\n`;
                table.querySelectorAll('tbody tr').forEach((row, rowIndex) => { let cells = row.querySelectorAll('td'); if(cells.length >= 2) textToCopy += `${rowIndex + 1}. ${cells[1].innerText.replace(/\n/g, " ").trim()}\n`; });
                textToCopy += `\n`;
            });
            navigator.clipboard.writeText(textToCopy).then(() => { alert("✅ यादी व्हॉट्सॲप मेसेजसाठी कॉपी झाली आहे!"); });
        }

        // 🧠 लेव्हल ३ नुसार प्रत्येक प्रत्यक्ष इनपुटच्या वर किती लेव्हल हेडर आहेत, त्यांची साखळी (Array) शोधणारे इंजिन
        function getFieldHierarchyChain(fields, fieldObj) {
            let chain = []; let current = fieldObj;
            while (current && current.parent_id) {
                let parent = fields.find(f => f.id === current.parent_id);
                if (parent) { if (parent.type === 'group_header') chain.unshift(parent.label); current = parent; } 
                else { break; }
            }
            return chain; // Returns like ["NCD रुग्ण", "मधुमेह"]
        }

        async function fetchReportData() {
            let selectedIDs = getSelectedReportIDs(); if(selectedIDs.length === 0) { alert("कृपया किमान एक अहवाल निवडा!"); return; }
            const selMonth = document.getElementById('reportMonth').value; const selMonthNum = monthNamesMarathi[selMonth]; const selYear = document.getElementById('reportYear').value;
            let filterSubCenter = document.getElementById('reportSubCenterFilter').value; let groupType = document.getElementById('reportGroupFilter').value;

            document.getElementById('reportLoader').classList.remove('hidden'); document.getElementById('reportContentArea').classList.add('hidden'); document.getElementById('reportTableContainer').innerHTML = "";
            try {
                let query = supabaseClient.from('form_responses').select('*').eq('report_month', parseInt(selMonthNum)).eq('report_year', parseInt(selYear));
                const progressivePeriods = getProgressiveMonthsList(selMonthNum, selYear);
                if (selMonthNum < 4) {
                    query = supabaseClient.from('form_responses').select('*').or(`and(report_year.eq.${parseInt(selYear)}),and(report_year.eq.${parseInt(selYear-1)},report_month.gte.4)`);
                }
                if(!selectedIDs.includes("ALL")) { query = query.in('form_id', selectedIDs); }
                const { data: dbData, error } = await query; document.getElementById('reportLoader').classList.add('hidden');
                if (error || !dbData || dbData.length === 0) { alert("डेटाबेसमध्ये माहिती उपलब्ध नाही."); return; }

                let finalReports = [];
                let formsToProcess = selectedIDs.includes("ALL") ? masterData.forms : masterData.forms.filter(f => selectedIDs.includes(f.id));

                formsToProcess.forEach(formObj => {
                    let formResp = dbData.filter(r => r.form_id === formObj.id); if(formResp.length === 0) return;
                    const allFields = formObj.schema_json.fields;
                    const validDataFields = allFields.filter(f => f.type !== 'group_header');
                    const isProgressive = formObj.form_type === 'progressive';

                    // प्रत्येक प्रत्यक्ष प्रश्नासाठी त्याची लेव्हल ३ साखळी काढून हेडर ऑब्जेक्ट्स तयार करणे
                    let fieldMetaList = validDataFields.map(f => {
                        let chain = getFieldHierarchyChain(allFields, f);
                        return { id: f.id, label: f.label, type: f.type, l1: chain[0] || "", l2: chain[1] || "", l3: f.label };
                    });

                    let fData = [];
                    let currentMonthResp = formResp.filter(r => r.report_month === parseInt(selMonthNum) && r.report_year === parseInt(selYear));
                    currentMonthResp.forEach(res => {
                        let villageObj = masterData.villages.find(v => v.id === res.village_id);
                        let empObj = masterData.employees.find(e => e.id === res.employee_id);
                        let scObj = villageObj ? masterData.subCenters.find(s => s.id === villageObj.sub_center_id) : null;
                        let scName = scObj ? scObj.name : '-';
                        if(filterSubCenter !== "सर्व" && scName !== filterSubCenter) return;

                        let row = { month: selMonth, year: selYear, subcenter: scName, village: villageObj?villageObj.name:'-', employee: empObj?empObj.full_name:'-', values: {} };
                        validDataFields.forEach(f => {
                            let monthlyVal = res.response_data[f.id] ? res.response_data[f.id].value : '';
                            if (isProgressive && f.type === 'number') {
                                let sumProg = 0;
                                getProgressiveMonthsList(selMonthNum, selYear).forEach(p => {
                                    let pastRes = formResp.find(r => r.village_id === res.village_id && r.report_month === p.month && r.report_year === p.year);
                                    if(pastRes && pastRes.response_data[f.id]) sumProg += parseFloat(pastRes.response_data[f.id].value) || 0;
                                });
                                row.values[f.id] = { M: formatNumberDecimals(monthlyVal), P: formatNumberDecimals(sumProg) };
                            } else { row.values[f.id] = formatNumberDecimals(monthlyVal); }
                        });
                        fData.push(row);
                    });

                    if(fData.length > 0) { finalReports.push({ formName: formObj.form_name, fields: fieldMetaList, rows: fData, isProg: isProgressive }); }
                });

                if(finalReports.length > 0) { currentReports = finalReports; renderMultipleTables(finalReports, selMonth, selYear, groupType); document.getElementById('reportContentArea').classList.remove('hidden'); } 
                else { alert("डेटा उपलब्ध नाही."); }
            } catch(e) { alert("एरर: " + e.message); }
        }

        // 📊 पीडीएफ/स्क्रीन प्रिव्ह्यूसाठी ३ लेव्हल कॉलम मर्जिंगसह तक्ता बनवणे
        function renderMultipleTables(reports, month, year, groupType) {
            let container = document.getElementById('reportTableContainer');
            let downArea = document.getElementById('downloadButtonsArea');
            downArea.innerHTML = `<div class="flex justify-end gap-2 p-2 bg-gray-50 rounded border mb-4"><button onclick="downloadConsolidatedExcel()" class="bg-green-600 text-white font-bold px-4 py-2 rounded text-xs shadow hover:bg-green-700">📥 Google Sheet (.xlsx) डाऊनलोड</button><button onclick="window.print()" class="bg-red-600 text-white font-bold px-4 py-2 rounded text-xs shadow hover:bg-red-700">📥 PDF प्रिंट काढा</button></div>`;

            let html = '';
            reports.forEach(rep => {
                let columns = rep.fields; let rows = rep.rows;
                if(groupType === "SubCenter") {
                    // उपकेंद्र वाईज समरी कम्पाईलर
                    let agg = {};
                    rows.forEach(r => {
                        if(!agg[r.subcenter]) { agg[r.subcenter] = { month: month, year: year, subcenter: r.subcenter, village: "एकत्रित", employee: "एकत्रित", values: {} }; }
                        columns.forEach(c => {
                            let cv = r.values[c.id];
                            if(typeof cv === 'object') {
                                if(!agg[r.subcenter].values[c.id]) agg[r.subcenter].values[c.id] = { M:0, P:0 };
                                agg[r.subcenter].values[c.id].M += parseFloat(cv.M || 0); agg[r.subcenter].values[c.id].P += parseFloat(cv.P || 0);
                            } else {
                                let n = parseFloat(cv) || 0; agg[r.subcenter].values[c.id] = (parseFloat(agg[r.subcenter].values[c.id]) || 0) + n;
                            }
                        });
                    });
                    rows = Object.values(agg);
                }

                html += `<div class="mb-8 p-4 border rounded bg-white shadow-sm"><div class="text-center border-b pb-2 mb-4 bg-green-50 p-2 rounded"><h2 class="text-md font-bold text-green-800">📋 अहवाल: ${rep.formName}</h2><p class="text-xs text-gray-500">प्राथमिक आरोग्य केंद्र भादा | कालावधी: ${month} ${year}</p></div>`;

                // 🌳 ३ लेव्हल हेडर कॅल्क्युलेशन (मर्जिंग आकडेमोड)
                let l1Row = `<tr><th rowspan="3" class="border p-2">अ.क्र.</th><th rowspan="3" class="border p-2">${groupType==='Village'?'गाव':'उपकेंद्र'}</th>`;
                let l2Row = `<tr>`; let l3Row = `<tr>`;

                let i = 0;
                while(i < columns.length) {
                    let c = columns[i];
                    let span = 1; let j = i + 1;
                    if(c.l1 !== "") {
                        while(j < columns.length && columns[j].l1 === c.l1) { span++; j++; }
                        let colSpanMultiplier = rep.isProg && c.type === 'number' ? 2 : 1; // प्रगत असेल तर डबल कॉलम
                        l1Row += `<th colspan="${span * colSpanMultiplier}" class="border p-2 bg-purple-100 text-purple-900">${c.l1}</th>`;
                        
                        // लेव्हल २ प्रोसेसिंग
                        let k = i;
                        while(k < j) {
                            let c2 = columns[k]; let span2 = 1; let m = k + 1;
                            if(c2.l2 !== "") {
                                while(m < j && columns[m].l2 === c2.l2) { span2++; m++; }
                                l2Row += `<th colspan="${span2 * colSpanMultiplier}" class="border p-2 bg-blue-50 text-blue-900">${c2.l2}</th>`;
                                
                                let n = k;
                                while(n < m) {
                                    if(rep.isProg && columns[n].type === 'number') {
                                        l3Row += `<th class="border p-1 bg-yellow-50 text-[10px]">मासिक</th><th class="border p-1 bg-orange-50 text-[10px]">प्रगत</th>`;
                                    } else { l3Row += `<th class="border p-2 text-xs">${columns[n].l3}</th>`; }
                                    n++;
                                }
                                k = m;
                            } else {
                                // लेव्हल २ कोरी असल्यास लेव्हल ३ लाच वर ओढणे
                                l2Row += `<th colspan="${colSpanMultiplier}" rowspan="2" class="border p-2 text-xs">${c2.l3}</th>`;
                                k++;
                            }
                        }
                        i = j;
                    } else {
                        // मुख्य लेव्हल १ लाच पूर्ण ३ लेव्हल खाली ओढणे (Rowspan=3)
                        let colSpanMultiplier = rep.isProg && c.type === 'number' ? 2 : 1;
                        if(colSpanMultiplier === 2) {
                            l1Row += `<th colspan="2" class="border p-2 text-xs">${c.l3}</th>`;
                            l2Row += `<th class="border p-1 bg-yellow-50 text-[10px]">मासिक</th><th class="border p-1 bg-orange-50 text-[10px]">प्रगत</th>`;
                        } else { l1Row += `<th rowspan="3" class="border p-2 text-xs">${c.l3}</th>`; }
                        i++;
                    }
                }
                l1Row += `</tr>`; l2Row += `</tr>`; l3Row += `</tr>`;

                // तक्ता बॉडी भरणे
                let tbodyHtml = '';
                rows.forEach((row, rIdx) => {
                    tbodyHtml += `<tr class="hover:bg-gray-50 text-xs">
                        <td class="border p-2">${rIdx+1}</td>
                        <td class="border p-2 font-bold text-gray-800">${groupType==='Village'?row.village:row.subcenter}</td>`;
                    columns.forEach(c => {
                        let val = row.values[c.id];
                        if(typeof val === 'object' && val !== null) {
                            tbodyHtml += `<td class="border p-2 text-blue-800">${val.M}</td><td class="border p-2 font-medium bg-orange-50/30 text-orange-800">${val.P}</td>`;
                        } else { tbodyHtml += `<td class="border p-2">${val !== '' ? val : '-'}</td>`; }
                    });
                    tbodyHtml += `</tr>`;
                });

                html += `<div class="table-responsive"><table class="report-table"><thead>${l1Row + l2Row + l3Row}</thead><tbody>${tbodyHtml}</tbody></table></div></div>`;
            });
            container.innerHTML = html;
        }

        // 🟢 📥 प्रिट प्रिव्ह्यू फॉरमॅटशी १००% मॅच होणारे व्यावसायिक ३-लेव्हल एक्सल इंजिन
        function downloadConsolidatedExcel() {
            if(currentReports.length === 0) return;
            let groupType = document.getElementById('reportGroupFilter').value;
            let wb = XLSX.utils.book_new();
            let monthStr = document.getElementById('reportMonth').value;
            let yearStr = document.getElementById('reportYear').value;

            currentReports.forEach((rep, index) => {
                let columns = rep.fields; let rows = rep.rows;
                if(groupType === "SubCenter") {
                    let agg = {};
                    rows.forEach(r => {
                        if(!agg[r.subcenter]) { agg[r.subcenter] = { month: monthStr, year: yearStr, subcenter: r.subcenter, village: "एकत्रित", employee: "एकत्रित", values: {} }; }
                        columns.forEach(c => {
                            let cv = r.values[c.id];
                            if(typeof cv === 'object') {
                                if(!agg[r.subcenter].values[c.id]) agg[r.subcenter].values[c.id] = { M:0, P:0 };
                                agg[r.subcenter].values[c.id].M += parseFloat(cv.M || 0); agg[r.subcenter].values[c.id].P += parseFloat(cv.P || 0);
                            } else { agg[r.subcenter].values[c.id] = (parseFloat(agg[r.subcenter].values[c.id]) || 0) + (parseFloat(cv) || 0); }
                        });
                    });
                    rows = Object.values(agg);
                }

                let sheetData = []; let merges = [];
                sheetData.push(["प्राथमिक आरोग्य केंद्र भादा, तालुका औसा"]);
                sheetData.push([`व्यावसायिक अहवाल: ${rep.formName} | कालावधी: ${monthStr} ${yearStr} (${groupType})`]);
                sheetData.push([]); // कोरी जागा

                // ३ लेव्हलच्या ३ रिकाम्या ओळी तयार करणे
                let r1 = ["अ.क्र.", groupType==='Village'?'गाव':'उपकेंद्र'];
                let r2 = ["", ""]; let r3 = ["", ""];

                let i = 0;
                while(i < columns.length) {
                    let c = columns[i]; let span = 1; let j = i + 1;
                    let mult = rep.isProg && c.type === 'number' ? 2 : 1;

                    if(c.l1 !== "") {
                        while(j < columns.length && columns[j].l1 === c.l1) { span++; j++; }
                        r1.push(c.l1); for(let s=1; s<(span*mult); s++) r1.push("");
                        merges.push({ s: { r: 3, c: r1.length - (span*mult) }, e: { r: 3, c: r1.length - 1 } });

                        let k = i;
                        while(k < j) {
                            let c2 = columns[k]; let span2 = 1; let m = k + 1;
                            let mult2 = rep.isProg && c2.type === 'number' ? 2 : 1;
                            if(c2.l2 !== "") {
                                while(m < j && columns[m].l2 === c2.l2) { span2++; m++; }
                                r2.push(c2.l2); for(let s=1; s<(span2*mult2); s++) r2.push("");
                                merges.push({ s: { r: 4, c: r2.length - (span2*mult2) }, e: { r: 4, c: r2.length - 1 } });

                                let n = k;
                                while(n < m) {
                                    if(rep.isProg && columns[n].type === 'number') { r3.push("मासिक"); r3.push("प्रगत"); } 
                                    else { r3.push(columns[n].l3); }
                                    n++;
                                }
                                k = m;
                            } else {
                                r2.push(c2.l3); if(mult2===2) r2.push("");
                                merges.push({ s: { r: 4, c: r2.length - mult2 }, e: { r: 5, c: r2.length - 1 } });
                                if(mult2===2) { r3.push("मासिक"); r3.push("प्रगत"); } else { r3.push(""); }
                                k++;
                            }
                        }
                        i = j;
                    } else {
                        r1.push(c.l3); if(mult===2) r1.push("");
                        if(mult===2) {
                            merges.push({ s: { r: 3, c: r1.length - 2 }, e: { r: 3, c: r1.length - 1 } });
                            r2.push("मासिक"); r2.push("प्रगत"); r3.push(""); r3.push("");
                        } else {
                            merges.push({ s: { r: 3, c: r1.length - 1 }, e: { r: 5, c: r1.length - 1 } });
                            r2.push(""); r3.push("");
                        }
                        i++;
                    }
                }

                // अ.क्र. आणि गाव रकान्यांना उभं (Vertical 3 Row Merge) करणे
                merges.push({ s: { r: 3, c: 0 }, e: { r: 5, c: 0 } });
                merges.push({ s: { r: 3, c: 1 }, e: { r: 5, c: 1 } });

                sheetData.push(r1); sheetData.push(r2); sheetData.push(r3);

                // डेटा रोज पुश करणे
                rows.forEach((row, rIdx) => {
                    let rowData = [rIdx + 1, groupType==='Village'?row.village:row.subcenter];
                    columns.forEach(c => {
                        let val = row.values[c.id];
                        if(typeof val === 'object' && val !== null) {
                            rowData.push(val.M !== '' ? Number(val.M) : 0); rowData.push(val.P !== '' ? Number(val.P) : 0);
                        } else { rowData.push(val !== '' ? (isNaN(val) ? val : Number(val)) : ''); }
                    });
                    sheetData.push(rowData);
                });

                let ws = XLSX.utils.aoa_to_sheet(sheetData);
                
                // टायटल रोज मर्जिंग
                merges.push({ s: { r: 0, c: 0 }, e: { r: 0, c: r1.length - 1 } });
                merges.push({ s: { r: 1, c: 0 }, e: { r: 1, c: r1.length - 1 } });
                ws["!merges"] = merges;

                // 💎 सेल डेकोरेशन आणि प्रोफेशनल बॉर्डर्स रंगांचे कोडिंग
                for(let R=0; R<sheetData.length; R++) {
                    for(let C=0; C<r1.length; C++) {
                        let cellRef = XLSX.utils.encode_cell({r: R, c: C}); if(!ws[cellRef]) continue;
                        let style = { font: { name: "Arial", sz: 10 }, alignment: { vertical: "center", horizontal: "center", wrapText: true }, border: { top:{style:"thin",color:{rgb:"000"}}, bottom:{style:"thin",color:{rgb:"000"}}, left:{style:"thin",color:{rgb:"000"}}, right:{style:"thin",color:{rgb:"000"}} } };
                        
                        if(R === 0) { style.fill = { fgColor: { rgb: "00705A" } }; style.font = { sz: 14, bold: true, color: { rgb: "FFF" } }; }
                        else if(R === 1) { style.fill = { fgColor: { rgb: "E8F5E9" } }; style.font = { sz: 11, bold: true, color: { rgb: "00705A" } }; }
                        else if(R >= 3 && R <= 5) {
                            // ३ लेव्हल हेडर बॅकग्राउंड कलर्स
                            if(R===3) style.fill = { fgColor: { rgb: "F4B400" } };
                            else if(R===4) style.fill = { fgColor: { rgb: "FFE082" } };
                            else style.fill = { fgColor: { rgb: "FFF3E0" } };
                            style.font.bold = true;
                        } else {
                            if (C === 1) { style.alignment.horizontal = "left"; style.font.bold = true; }
                            if (rep.isProg && C >= 2 && C % 2 !== 0) style.fill = { fgColor: { rgb: "FFF9F2" } }; // प्रगत शेड
                        }
                        ws[cellRef].s = style;
                    }
                }

                let wscols = [{ wch: 6 }, { wch: 25 }];
                for(let c=2; c<r1.length; c++) wscols.push({ wch: 14 });
                ws["!cols"] = wscols;

                XLSX.utils.book_append_sheet(wb, ws, rep.formName.substring(0, 30));
            });

            XLSX.writeFile(wb, `प्रगत_मर्ज_अहवाल_${monthStr}_${yearStr}.xlsx`);
        }
    </script>
</body>
