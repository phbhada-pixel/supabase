<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अहवाल आणि डेटा डाउनलोड</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-6 min-h-screen">

    <div class="max-w-6xl mx-auto bg-white p-4 rounded-lg shadow-md flex justify-between items-center mb-6">
        <h1 class="text-xl font-bold text-purple-600">अहवाल आणि डेटा डाउनलोड</h1>
        <button onclick="window.location.href='dashboard.html'" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">डॅशबोर्डवर परत जा</button>
    </div>

    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-md border-t-4 border-purple-500">
        
        <!-- फिल्टर सेक्शन -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div>
                <label class="block text-gray-700 font-bold mb-2">फॉर्म निवडा</label>
                <select id="filterForm" class="w-full p-2 border rounded bg-white">
                    <option value="">-- सर्व फॉर्म्स --</option>
                </select>
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-2">महिना</label>
                <select id="filterMonth" class="w-full p-2 border rounded bg-white">
                    <option value="">-- सर्व महिने --</option>
                    <option value="1">जानेवारी</option><option value="2">फेब्रुवारी</option>
                    <option value="3">मार्च</option><option value="4">एप्रिल</option>
                    <option value="5">मे</option><option value="6">जून</option>
                    <option value="7">जुलै</option><option value="8">ऑगस्ट</option>
                    <option value="9">सप्टेंबर</option><option value="10">ऑक्टोबर</option>
                    <option value="11">नोव्हेंबर</option><option value="12">डिसेंबर</option>
                </select>
            </div>
            <div class="flex items-end gap-2">
                <button onclick="loadData()" class="w-full bg-blue-500 text-white font-bold p-2 rounded hover:bg-blue-600">डेटा शोधा</button>
            </div>
            <div class="flex items-end">
                <button onclick="downloadCSV()" class="w-full bg-green-600 text-white font-bold p-2 rounded hover:bg-green-700">Excel/Sheet डाउनलोड</button>
            </div>
        </div>

        <!-- डेटा टेबल -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse" id="dataTable">
                <thead>
                    <tr class="bg-gray-200" id="tableHead">
                        <!-- हेडर्स डायनॅमिकली येतील -->
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="5" class="p-4 text-center text-gray-500">कृपया फॉर्म निवडा आणि डेटा शोधा.</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://qbmjsfiievcautxybaai.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_sdgZ9G8ko4H_3Mh9RouYFg_JOQ-4Mdx'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let reportData = [];
        let formSchemas = {};
        let villagesMap = {};
        let employeesMap = {};

        window.onload = async function() {
            const user = JSON.parse(localStorage.getItem('loggedInUser') || '{}');
            if (user.role !== 'admin') {
                alert("तुम्हाला या पानावर जाण्याची परवानगी नाही!");
                window.location.href = "index.html";
                return;
            }

            // बेसिक डेटा लोड करणे (फॉर्म्स, गावे, कर्मचारी नावे)
            await loadInitialData();
        };

        async function loadInitialData() {
            // फॉर्म्स
            const { data: forms } = await supabaseClient.from('dynamic_forms').select('*');
            let formOptions = '<option value="">-- सर्व फॉर्म्स --</option>';
            forms.forEach(f => {
                formOptions += `<option value="${f.id}">${f.form_name}</option>`;
                formSchemas[f.id] = f.schema_json.fields;
            });
            document.getElementById('filterForm').innerHTML = formOptions;

            // गावे
            const { data: villages } = await supabaseClient.from('villages').select('id, name');
            villages.forEach(v => villagesMap[v.id] = v.name);

            // कर्मचारी
            const { data: employees } = await supabaseClient.from('employees').select('id, full_name');
            employees.forEach(e => employeesMap[e.id] = e.full_name);
        }

        async function loadData() {
            const formId = document.getElementById('filterForm').value;
            const month = document.getElementById('filterMonth').value;

            if(!formId) return alert("कृपया पाहण्यासाठी एखादा फॉर्म निवडा.");

            let query = supabaseClient.from('form_responses').select('*').eq('form_id', formId);
            if(month) query = query.eq('report_month', month);

            const { data, error } = await query;
            
            if(error) return alert("डेटा आणताना एरर: " + error.message);
            
            reportData = data;
            renderTable(formId);
        }

        function renderTable(formId) {
            const headRow = document.getElementById('tableHead');
            const body = document.getElementById('tableBody');
            
            if(reportData.length === 0) {
                headRow.innerHTML = '';
                body.innerHTML = '<tr><td class="p-4 text-center text-red-500">या महिन्यासाठी कोणताही डेटा उपलब्ध नाही.</td></tr>';
                return;
            }

            const schema = formSchemas[formId];
            
            // टेबलचे हेडर्स तयार करणे
            let headHTML = '<th class="p-2 border border-gray-300">महिना/वर्ष</th><th class="p-2 border border-gray-300">गाव</th><th class="p-2 border border-gray-300">कर्मचारी</th>';
            schema.forEach(field => {
                headHTML += `<th class="p-2 border border-gray-300">${field.label}</th>`;
            });
            headRow.innerHTML = headHTML;

            // टेबलमधील डेटा (Rows) तयार करणे
            let bodyHTML = '';
            reportData.forEach(row => {
                let tr = `<tr>
                    <td class="p-2 border border-gray-300">${row.report_month}/${row.report_year}</td>
                    <td class="p-2 border border-gray-300">${villagesMap[row.village_id] || '-'}</td>
                    <td class="p-2 border border-gray-300">${employeesMap[row.employee_id] || '-'}</td>`;
                
                schema.forEach(field => {
                    // JSON मधील डेटा काढणे
                    let answer = row.response_data[field.id] ? row.response_data[field.id].value : '-';
                    tr += `<td class="p-2 border border-gray-300">${answer}</td>`;
                });
                tr += '</tr>';
                bodyHTML += tr;
            });
            body.innerHTML = bodyHTML;
        }

        // CSV (Google Sheet) मध्ये डेटा डाउनलोड करणे
        function downloadCSV() {
            if(reportData.length === 0) return alert("डाउनलोड करण्यासाठी कोणताही डेटा उपलब्ध नाही.");
            
            const formId = document.getElementById('filterForm').value;
            const schema = formSchemas[formId];

            // CSV हेडर्स
            let csvContent = "Month/Year,Village,Employee";
            schema.forEach(field => {
                csvContent += `,"${field.label.replace(/"/g, '""')}"`; // Labels with quotes safety
            });
            csvContent += "\n";

            // CSV डेटा
            reportData.forEach(row => {
                let rowData = [
                    `${row.report_month}/${row.report_year}`,
                    villagesMap[row.village_id] || '-',
                    employeesMap[row.employee_id] || '-'
                ];
                
                schema.forEach(field => {
                    let answer = row.response_data[field.id] ? row.response_data[field.id].value : '-';
                    rowData.push(`"${String(answer).replace(/"/g, '""')}"`);
                });
                
                csvContent += rowData.join(",") + "\n";
            });

            // डाउनलोड लिंक बनवणे
            const blob = new Blob(["\uFEFF"+csvContent], { type: 'text/csv;charset=utf-8;' }); // \uFEFF is for Marathi UTF-8 support in Excel
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "SubCenter_Report.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
