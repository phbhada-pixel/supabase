<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अहवाल केंद्र - आरोग्य प्रणाली</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-2 md:p-6 min-h-screen">

    <div class="max-w-7xl mx-auto bg-white p-4 rounded-lg shadow-md flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <div>
            <h1 class="text-2xl font-extrabold text-purple-700">📊 अहवाल केंद्र (Report Center)</h1>
            <p class="text-sm text-gray-500 font-bold mt-1" id="roleSubtitle">भरलेली माहिती पहा आणि डाऊनलोड करा</p>
        </div>
        <button onclick="window.location.href='dashboard.html'" class="bg-gray-600 text-white px-4 py-2 rounded font-bold shadow hover:bg-gray-700 transition">डॅशबोर्डवर परत जा</button>
    </div>

    <div class="max-w-7xl mx-auto bg-white p-6 rounded-lg shadow-md mb-8 border-t-4 border-purple-500">
        <h2 class="font-bold text-gray-700 mb-4 text-lg border-b pb-2">🔍 फिल्टर निवडा</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <!-- फॉर्म निवडणे (अनिवार्य) -->
            <div class="md:col-span-2">
                <label class="block text-sm font-bold text-gray-700 mb-1">फॉर्मचा प्रकार निवडा <span class="text-red-500">*</span></label>
                <select id="formSelect" class="w-full p-2 border-2 border-purple-300 rounded focus:ring-2 focus:ring-purple-500 font-bold bg-purple-50">
                    <option value="">-- फॉर्म निवडा --</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">महिना</label>
                <select id="monthSelect" class="w-full p-2 border border-gray-300 rounded font-bold">
                    <option value="">-- सर्व महिने --</option>
                    <option value="1">जानेवारी</option><option value="2">फेब्रुवारी</option><option value="3">मार्च</option><option value="4">एप्रिल</option>
                    <option value="5">मे</option><option value="6">जून</option><option value="7">जुलै</option><option value="8">ऑगस्ट</option>
                    <option value="9">सप्टेंबर</option><option value="10">ऑक्टोबर</option><option value="11">नोव्हेंबर</option><option value="12">डिसेंबर</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">वर्ष</label>
                <select id="yearSelect" class="w-full p-2 border border-gray-300 rounded font-bold">
                    <option value="">-- सर्व वर्षे --</option>
                    <option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option>
                </select>
            </div>
        </div>

        <div class="flex gap-4">
            <button onclick="generateReport()" class="bg-purple-600 text-white px-8 py-2 rounded font-bold shadow-lg hover:bg-purple-700">अहवाल तयार करा</button>
            <button onclick="downloadCSV()" id="downloadBtn" class="hidden bg-green-600 text-white px-6 py-2 rounded font-bold shadow-lg hover:bg-green-700">📥 Excel/CSV डाऊनलोड</button>
        </div>
    </div>

    <!-- अहवाल टेबल -->
    <div class="max-w-7xl mx-auto bg-white p-4 rounded-lg shadow-md overflow-x-auto border border-gray-200">
        <table id="reportTable" class="w-full text-left border-collapse whitespace-nowrap text-sm">
            <thead>
                <tr id="tableHeaderRow" class="bg-purple-100 text-purple-900 font-bold border-b-2 border-purple-300">
                    <th class="p-3 border">कृपया वरील फिल्टर निवडून 'अहवाल तयार करा' वर क्लिक करा.</th>
                </tr>
            </thead>
            <tbody id="tableBody" class="text-gray-800"></tbody>
        </table>
    </div>

    <!-- लोडर -->
    <div id="loader" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl text-center border-4 border-purple-500"><div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-purple-600 border-t-transparent mb-3"></div><p class="text-lg font-bold text-gray-800">माहिती लोड होत आहे...</p></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qbmjsfiievcautxybaai.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_sdgZ9G8ko4H_3Mh9RouYFg_JOQ-4Mdx'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let userRole = '';
        let globalForms = [];
        let globalVillages = [];
        let globalSubCenters = [];
        let globalEmployees = [];

        window.onload = async function() {
            const userString = localStorage.getItem('loggedInUser');
            if (!userString) { window.location.href = "index.html"; return; }
            currentUser = JSON.parse(userString);
            userRole = String(currentUser.role || '').toLowerCase().trim();

            let subtitle = document.getElementById('roleSubtitle');
            if (userRole === 'admin' || userRole === 'taluka_admin') subtitle.innerText = "(तालुका ॲडमिन: संपूर्ण तालुक्याचा डेटा)";
            else if (userRole === 'phc_admin') subtitle.innerText = "(PHC ॲडमिन: तुमच्या PHC चा डेटा)";
            else subtitle.innerText = `(कर्मचारी: तुम्ही भरलेला डेटा)`;

            await fetchBaseData();
        };

        function showLoader() { document.getElementById('loader').classList.remove('hidden'); }
        function hideLoader() { document.getElementById('loader').classList.add('hidden'); }

        async function fetchBaseData() {
            showLoader();
            try {
                const [formsRes, vRes, scRes, empRes] = await Promise.all([
                    supabaseClient.from('dynamic_forms').select('*').eq('is_active', true),
                    supabaseClient.from('villages').select('*'),
                    supabaseClient.from('sub_centers').select('*'),
                    supabaseClient.from('employees').select('id, full_name')
                ]);

                globalForms = formsRes.data || [];
                globalVillages = vRes.data || [];
                globalSubCenters = scRes.data || [];
                globalEmployees = empRes.data || [];

                let formSel = document.getElementById('formSelect');
                globalForms.forEach(f => {
                    formSel.innerHTML += `<option value="${f.id}">${f.form_name} (${f.form_type})</option>`;
                });
            } catch(e) { console.error(e); alert("डेटा लोड करण्यात त्रुटी."); }
            hideLoader();
        }

        async function generateReport() {
            let formId = document.getElementById('formSelect').value;
            if (!formId) return alert("कृपया फॉर्मचा प्रकार निवडा!");

            let month = document.getElementById('monthSelect').value;
            let year = document.getElementById('yearSelect').value;

            showLoader();
            document.getElementById('downloadBtn').classList.add('hidden');

            try {
                // १. फॉर्मचे प्रश्न (Schema) आणणे
                let formObj = globalForms.find(f => f.id === formId);
                let fields = formObj.schema_json.fields.filter(f => f.type !== 'group_header');

                // २. भरलेला डेटा (Responses) आणणे
                let query = supabaseClient.from('form_responses').select('*').eq('form_id', formId);
                if (month) query = query.eq('report_month', month);
                if (year) query = query.eq('report_year', year);
                
                let { data: responses, error } = await query;
                if(error) throw error;

                // 🟢 ३. सुरक्षेनुसार डेटा फिल्टर करणे (Role-Based Filtering)
                if (userRole === 'phc_admin') {
                    // PHC ॲडमिनला फक्त त्यांच्या उपकेंद्रातील गावांचा डेटा दिसेल
                    let myScIds = globalSubCenters.filter(sc => sc.phc_id === currentUser.phc_id).map(sc => sc.id);
                    let myVillageIds = globalVillages.filter(v => myScIds.includes(v.sub_center_id)).map(v => v.id);
                    responses = responses.filter(r => myVillageIds.includes(r.village_id));
                } else if (userRole !== 'admin' && userRole !== 'taluka_admin') {
                    // कर्मचाऱ्याला फक्त त्याने स्वतः भरलेला डेटा दिसेल
                    responses = responses.filter(r => r.employee_id === currentUser.id);
                }

                buildTable(fields, responses);

            } catch (err) { alert("त्रुटी: " + err.message); }
            hideLoader();
        }

        function buildTable(fields, responses) {
            let thead = document.getElementById('tableHeaderRow');
            let tbody = document.getElementById('tableBody');
            
            thead.innerHTML = '';
            tbody.innerHTML = '';

            if (responses.length === 0) {
                thead.innerHTML = '<th class="p-4 text-center text-red-500">कोणताही डेटा उपलब्ध नाही!</th>';
                return;
            }

            // Headers तयार करणे
            let headers = ['अ.क्र.', 'महिना/वर्ष', 'गाव', 'भरणाऱ्याचे नाव', 'भरलेली तारीख'];
            fields.forEach(f => headers.push(f.label));

            headers.forEach(h => {
                thead.innerHTML += `<th class="p-3 border text-center">${h}</th>`;
            });

            // Rows तयार करणे
            responses.forEach((res, index) => {
                let vObj = globalVillages.find(v => v.id === res.village_id);
                let eObj = globalEmployees.find(e => e.id === res.employee_id);
                let dateStr = new Date(res.created_at).toLocaleDateString('en-IN');
                
                let tr = `<tr class="hover:bg-purple-50 transition">
                    <td class="p-2 border text-center font-bold">${index + 1}</td>
                    <td class="p-2 border text-center">${res.report_month}/${res.report_year}</td>
                    <td class="p-2 border text-center font-bold text-blue-700">${vObj ? vObj.name : '-'}</td>
                    <td class="p-2 border text-center">${eObj ? eObj.full_name : '-'}</td>
                    <td class="p-2 border text-center text-gray-500 text-xs">${dateStr}</td>
                `;

                fields.forEach(f => {
                    let val = res.response_data[f.id] ? res.response_data[f.id].value : '-';
                    tr += `<td class="p-2 border text-center">${val}</td>`;
                });

                tr += `</tr>`;
                tbody.innerHTML += tr;
            });

            // डेटा असल्यास डाऊनलोड बटण दाखवणे
            document.getElementById('downloadBtn').classList.remove('hidden');
        }

        // ==========================================
        // 🟢 Excel/CSV डाऊनलोड (मराठी फॉन्ट सपोर्टसह)
        // ==========================================
        function downloadCSV() {
            let table = document.getElementById("reportTable");
            let rows = table.querySelectorAll("tr");
            let csv = "\uFEFF"; // मराठी (UTF-8) सपोर्टसाठी BOM आवश्यक

            for (let i = 0; i < rows.length; i++) {
                let cols = rows[i].querySelectorAll("td, th");
                let rowData = [];
                for (let j = 0; j < cols.length; j++) {
                    // दुहेरी अवतरण चिन्हे (Quotes) टाकणे जेणेकरून कॉमा (,) मुळे डेटा ब्रेक होणार नाही
                    let text = cols[j].innerText.replace(/"/g, '""');
                    rowData.push('"' + text + '"');
                }
                csv += rowData.join(",") + "\n";
            }

            let blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            let link = document.createElement("a");
            let url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            
            let formName = document.getElementById('formSelect').options[document.getElementById('formSelect').selectedIndex].text;
            link.setAttribute("download", `अहवाल_${formName}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
