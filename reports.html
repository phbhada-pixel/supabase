<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>प्रगत अहवाल केंद्र</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="css/reports.css">
</head>
<body class="bg-gray-100 p-2 md:p-6 min-h-screen">

    <div class="max-w-7xl mx-auto bg-white p-4 rounded-lg shadow-md flex justify-between items-center mb-6 no-print border-t-8 border-green-700">
        <div>
            <h1 id="mainTitle" class="text-xl font-bold text-green-800">📊 प्रगत अहवाल केंद्र</h1>
            <p class="text-sm font-bold text-blue-600 mt-1" id="roleSubtitle">माहिती लोड होत आहे...</p>
        </div>
        <button onclick="window.location.href='dashboard.html'" class="bg-gray-600 text-white px-4 py-2 rounded font-bold shadow hover:bg-gray-700 transition text-sm">डॅशबोर्डवर परत जा</button>
    </div>

    <div class="max-w-7xl mx-auto bg-white p-6 rounded-lg shadow-md mb-6 no-print">

        <div class="grid grid-cols-1 md:grid-cols-6 gap-4 mb-4 items-end" id="topControlsDiv">

            <div>
                <label class="block text-gray-700 text-xs font-bold mb-1">अहवालाची वारंवारता</label>
                <select id="frequencyFilter" onchange="handleFrequencyChange()" class="w-full p-2 border border-blue-300 rounded bg-blue-50 text-sm font-bold text-blue-800 focus:ring-2 focus:ring-blue-500">
                    <option value="all">सर्व प्रकार (All)</option>
                    <option value="daily">दैनिक (Daily)</option>
                    <option value="weekly">आठवडी (Weekly)</option>
                    <option value="fortnightly">पंधरवाडी (Fortnightly)</option>
                    <option value="monthly">मासिक (Monthly)</option>
                    <option value="onetime">एकदाच (One-Time)</option>
                </select>
            </div>

            <div class="relative md:col-span-2" id="multiSelectContainer">
                <label class="block text-gray-700 text-xs font-bold mb-1">अहवाल / फॉर्म निवडा</label>
                <button onclick="toggleMultiSelect()" class="w-full p-2 border border-gray-300 rounded bg-white text-left text-sm font-medium flex justify-between items-center min-h-[38px] hover:border-green-500">
                    <span id="multiSelectBtnText">अहवाल लोड होत आहेत...</span>
                    <span class="text-xs text-gray-400">▼</span>
                </button>
                <div id="multiSelectDropdown" class="absolute left-0 right-0 mt-1 bg-white border border-gray-300 rounded shadow-2xl z-50 max-h-60 overflow-y-auto hidden">
                    <div class="p-3 border-b bg-gray-50 sticky top-0 flex justify-between items-center">
                        <label class="flex items-center gap-2 font-bold text-sm text-green-700 cursor-pointer">
                            <input type="checkbox" id="chkAllReports" checked onchange="toggleAllReports(this)" class="w-4 h-4"> 
                            सर्व फॉर्म्स निवडा
                        </label>
                    </div>
                    <div id="multiSelectOptions" class="text-sm font-medium"></div>
                </div>
                <select id="reportFormSelect" class="hidden"></select>
            </div>

            <div>
                <label class="block text-gray-700 text-xs font-bold mb-1">कालावधी प्रकार</label>
                <select id="periodType" onchange="togglePeriodInputs()" class="w-full p-2 border border-gray-300 rounded bg-white text-sm font-bold text-blue-700">
                    <option value="monthly">महिन्यानुसार</option>
                    <option value="custom">तारखेनुसार (फक्त यादी)</option>
                </select>
            </div>

            <div id="monthlyInputs" class="col-span-2 flex gap-2">
                <div class="flex-1">
                    <label class="block text-gray-700 text-xs font-bold mb-1">महिना</label>
                    <select id="reportMonth" class="w-full p-2 border border-gray-300 rounded bg-white text-sm font-bold">
                        <option value="जानेवारी">जानेवारी</option><option value="फेब्रुवारी">फेब्रुवारी</option>
                        <option value="मार्च">मार्च</option><option value="एप्रिल">एप्रिल</option>
                        <option value="मे">मे</option><option value="जून">जून</option>
                        <option value="जुलै">जुलै</option><option value="ऑगस्ट">ऑगस्ट</option>
                        <option value="सप्टेंबर">सप्टेंबर</option><option value="ऑक्टोबर">ऑक्टोबर</option>
                        <option value="नोव्हेंबर">नोव्हेंबर</option><option value="डिसेंबर">डिसेंबर</option>
                    </select>
                </div>
                <div class="flex-1">
                    <label class="block text-gray-700 text-xs font-bold mb-1">वर्ष</label>
                    <input type="number" id="reportYear" class="w-full p-2 border border-gray-300 rounded text-sm font-bold text-center" value="2026">
                </div>
            </div>

            <div id="fortnightInputs" class="hidden">
                <label class="block text-orange-700 text-xs font-bold mb-1">पंधरवाडा</label>
                <select id="reportFortnight" class="w-full p-2 border border-orange-400 rounded bg-orange-50 text-sm font-bold text-orange-900">
                    <option value="1">१ ते १५ तारीख</option>
                    <option value="2">१६ ते अखेर</option>
                </select>
            </div>

            <div id="weekInputs" class="hidden">
                <label class="block text-blue-700 text-xs font-bold mb-1">आठवडा</label>
                <select id="reportWeek" class="w-full p-2 border border-blue-400 rounded bg-blue-50 text-sm font-bold text-blue-900">
                    <option value="1">पहिला (Week 1)</option>
                    <option value="2">दुसरा (Week 2)</option>
                    <option value="3">तिसरा (Week 3)</option>
                    <option value="4">चौथा (Week 4)</option>
                    <option value="5">पाचवा (Week 5)</option>
                </select>
            </div>

            <div id="dailyInputs" class="hidden">
                <label class="block text-purple-700 text-xs font-bold mb-1">तारीख (Day)</label>
                <select id="reportDaily" class="w-full p-2 border border-purple-400 rounded bg-purple-50 text-sm font-bold text-purple-900">
                    <!-- JavaScript मधून ३१ तारखा लोड होतील -->
                </select>
            </div>

            <div id="customDateInputs" class="col-span-2 hidden flex gap-2">
                <div class="flex-1">
                    <label class="block text-gray-700 text-xs font-bold mb-1">पासून (Start Date)</label>
                    <input type="date" id="startDate" class="w-full p-2 border border-gray-300 rounded text-sm font-bold text-indigo-700">
                </div>
                <div class="flex-1">
                    <label class="block text-gray-700 text-xs font-bold mb-1">पर्यंत (End Date)</label>
                    <input type="date" id="endDate" class="w-full p-2 border border-gray-300 rounded text-sm font-bold text-indigo-700">
                </div>
            </div>

            <div id="subcenterFilterDiv">
                <label class="block text-gray-700 text-xs font-bold mb-1">उपकेंद्र फिल्टर</label>
                <select id="reportSubCenterFilter" class="w-full p-2 border border-gray-300 rounded bg-white text-sm font-bold">
                    <option value="सर्व">सर्व उपकेंद्र (All Sub-centers)</option>
                </select>
            </div>
        </div>
<div id="roleFilterDiv" class="hidden">
    <label class="block text-gray-700 text-xs font-bold mb-1">पद (Role) फिल्टर</label>
    <select id="reportRoleFilter" class="w-full p-2 border border-gray-300 rounded bg-white text-sm font-bold">
        <option value="सर्व">सर्व पदे (All Roles)</option>
    </select>
</div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-t border-gray-200 pt-4">
            <div id="groupFilterDiv">
                <label class="block text-gray-700 text-xs font-bold mb-1">अहवाल मांडणी प्रकार (Group View)</label>
                <select id="reportGroupFilter" class="w-full p-2 border border-gray-300 rounded bg-blue-50 text-sm font-bold text-blue-800 focus:ring-2 focus:ring-blue-500">
                    <option value="Village">१. गावनिहाय कर्मचारी गटबद्ध यादी (Employee Blocks)</option>
                    <option value="SubCenterFlat">२. सर्व उपकेंद्रांची सलग गावनिहाय यादी (Flat Village List)</option>
                    <option value="SubCenterSum">३. उपकेंद्र निहाय एकूण बेरजेची यादी (SubCenter Wise Sum)</option>
                    <option value="SubCenterConsolidated">४. उपकेंद्र एकत्रित उभी मांडणी (Vertical Consolidated)</option>
                </select>
            </div>

            <div id="pendingFilterDiv">
                <label class="block text-gray-700 text-xs font-bold mb-1">अपूर्ण यादी (Pending List) प्रकार</label>
                <select id="pendingGroupFilter" class="w-full p-2 border border-red-300 rounded bg-red-50 text-sm font-bold text-red-800 focus:ring-2 focus:ring-red-500">
                    <option value="employee">🧑‍⚕️ कर्मचारी नुसार (Employee Wise) - नोटीससाठी उत्तम</option>
                    <option value="form">📄 अहवालानुसार (Form Wise)</option>
                </select>
            </div>

            <div class="flex items-end gap-3 md:col-span-2">
                <button onclick="fetchReportData()" class="flex-1 bg-blue-600 text-white font-extrabold p-3 rounded-lg shadow-lg hover:bg-blue-700 transition transform hover:-translate-y-0.5 text-sm md:text-base">🔍 अहवाल पहा</button>
                <button onclick="generatePendingReport()" id="pendingReportBtn" class="flex-1 bg-red-600 text-white font-extrabold p-3 rounded-lg shadow-lg hover:bg-red-700 transition transform hover:-translate-y-0.5 text-sm md:text-base">⚠️ अपूर्ण यादी शोधा</button>
            </div>
        </div>

    </div>

    <div id="reportLoader" class="text-center py-10 hidden no-print bg-white mx-auto max-w-lg rounded-lg shadow border border-gray-200">
        <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-green-600 border-t-transparent mb-3"></div>
        <p class="text-green-700 font-bold">डेटाबेस मधून प्रगत अहवाल आणि आकडेमोड सुरू आहे, कृपया थांबा...</p>
    </div>

    <div id="downloadButtonsArea" class="max-w-7xl mx-auto mb-4 no-print"></div>

    <div id="reportContentArea" class="max-w-7xl mx-auto bg-white p-2 md:p-6 rounded-lg shadow-md hidden overflow-hidden">
        <div id="reportTableContainer"></div>
    </div>

    <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col border-t-8 border-blue-600">
            <div class="p-4 border-b flex justify-between items-center bg-blue-50">
                <h2 class="text-lg font-bold text-blue-900">✏️ माहिती एडिट करा</h2>
                <button onclick="closeEditModal()" class="text-red-500 font-bold text-2xl hover:text-red-700">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 bg-gray-50" id="editModalBody">
            </div>
            <div class="p-4 border-t flex justify-end gap-3 bg-white">
                <button onclick="closeEditModal()" class="bg-gray-500 text-white px-5 py-2 rounded font-bold shadow">रद्द करा</button>
                <button onclick="saveEditResponse()" class="bg-green-600 text-white px-5 py-2 rounded font-bold shadow hover:bg-green-700">💾 अपडेट करा</button>
            </div>
        </div>
    </div>

    <!-- External JS Scripts -->
    <script src="js/reports/globals.js"></script>
    <script src="js/reports/utils.js"></script>
    <script src="js/reports/ui.js"></script>
    <script src="js/reports/api.js"></script>
    <script src="js/reports/export.js"></script>
    <script src="js/reports/main.js"></script>
</body>
</html>
