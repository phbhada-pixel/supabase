<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मास्टर डेटा मॅनेजमेंट - आरोग्य प्रणाली</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .tab-btn.active { border-bottom: 4px solid #2563eb; color: #1d4ed8; font-weight: bold; background-color: #eff6ff; }
    </style>
</head>
<body class="bg-gray-100 p-2 md:p-6 min-h-screen">

    <div class="max-w-6xl mx-auto bg-white p-4 rounded-lg shadow-md flex justify-between items-center mb-6">
        <div>
            <h1 class="text-xl font-bold text-blue-700">⚙️ मास्टर डेटा मॅनेजमेंट</h1>
            <p class="text-sm text-gray-500">उपकेंद्रे, गावे आणि कर्मचारी यांचे व्यवस्थापन करा</p>
        </div>
        <button onclick="window.location.href='dashboard.html'" class="bg-gray-600 text-white px-4 py-2 rounded font-bold shadow hover:bg-gray-700 transition">डॅशबोर्डवर परत जा</button>
    </div>

    <div class="max-w-6xl mx-auto bg-white rounded-lg shadow-md overflow-hidden">
        <div class="flex flex-wrap border-b bg-gray-50">
            <button id="tabBtnPHC" onclick="switchTab('phcTab')" class="tab-btn hidden flex-1 py-3 px-4 text-gray-600 font-medium hover:bg-gray-100 transition">🏥 PHC व ॲडमिन</button>
            <button id="tabBtnSubCenter" onclick="switchTab('subCenterTab')" class="tab-btn active flex-1 py-3 px-4 text-gray-600 font-medium hover:bg-gray-100 transition">🏢 उपकेंद्रे</button>
            <button id="tabBtnVillage" onclick="switchTab('villageTab')" class="tab-btn flex-1 py-3 px-4 text-gray-600 font-medium hover:bg-gray-100 transition">🏘️ गावे</button>
            <button id="tabBtnEmployee" onclick="switchTab('employeeTab')" class="tab-btn flex-1 py-3 px-4 text-gray-600 font-medium hover:bg-gray-100 transition">🧑‍⚕️ कर्मचारी</button>
        </div>

        <div class="p-6">
            
            <div id="phcTab" class="tab-content hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                        <h3 class="font-bold text-blue-800 mb-3 border-b border-blue-200 pb-2">नवीन प्राथमिक आरोग्य केंद्र (PHC) जोडा</h3>
                        <form onsubmit="addPHC(event)" class="flex gap-2">
                            <input type="text" id="newPHCName" placeholder="उदा. PHC भादा" required class="flex-1 p-2 border border-blue-300 rounded focus:ring-2 focus:ring-blue-500 font-bold">
                            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded font-bold shadow hover:bg-blue-700">जोडा</button>
                        </form>
                        <div class="mt-4 max-h-60 overflow-y-auto">
                            <table class="w-full text-sm text-left border">
                                <thead class="bg-blue-200"><tr><th class="p-2 border">PHC चे नाव</th><th class="p-2 border text-center">काढा</th></tr></thead>
                                <tbody id="phcListTable" class="bg-white"></tbody>
                            </table>
                        </div>
                    </div>

                    <div class="bg-purple-50 p-4 rounded-lg border border-purple-200">
                        <h3 class="font-bold text-purple-800 mb-3 border-b border-purple-200 pb-2">नवीन PHC ॲडमिन जोडा</h3>
                        <form onsubmit="addPHCAdmin(event)" class="space-y-3">
                            <select id="adminPHCSelect" required class="w-full p-2 border border-purple-300 rounded font-bold"><option value="">-- PHC निवडा --</option></select>
                            <input type="text" id="adminName" placeholder="ॲडमिनचे पूर्ण नाव" required class="w-full p-2 border border-purple-300 rounded">
                            <input type="tel" id="adminMobile" placeholder="मोबाईल नंबर (लॉगिन आयडी)" required pattern="[0-9]{10}" class="w-full p-2 border border-purple-300 rounded">
                            <input type="text" id="adminPassword" placeholder="पासवर्ड (उदा. 123456)" required value="123456" class="w-full p-2 border border-purple-300 rounded">
                            <button type="submit" class="w-full bg-purple-600 text-white px-4 py-2 rounded font-bold shadow hover:bg-purple-700">PHC ॲडमिन तयार करा</button>
                        </form>
                    </div>
                </div>
            </div>

            <div id="subCenterTab" class="tab-content">
                <form onsubmit="addSubCenter(event)" class="flex flex-col md:flex-row gap-3 mb-6 bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <select id="scPHCSelect" required class="p-2 border border-gray-300 rounded flex-1 font-bold hidden"><option value="">-- PHC निवडा --</option></select>
                    <input type="text" id="newSubCenterName" placeholder="नवीन उपकेंद्राचे नाव (उदा. उपकेंद्र शिवली)" required class="p-2 border border-gray-300 rounded flex-1 font-bold">
                    <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded font-bold shadow hover:bg-green-700">उपकेंद्र जोडा</button>
                </form>
                <table class="w-full text-left border-collapse border rounded shadow-sm">
                    <thead><tr class="bg-gray-200 text-gray-700"><th class="p-3 border">अ.क्र.</th><th class="p-3 border">उपकेंद्राचे नाव</th><th id="thPHCName" class="p-3 border hidden">संबंधित PHC</th><th class="p-3 border text-center">कृती</th></tr></thead>
                    <tbody id="subCenterTableBody" class="text-sm"></tbody>
                </table>
            </div>

            <div id="villageTab" class="tab-content hidden">
                <form onsubmit="addVillage(event)" class="flex flex-col md:flex-row gap-3 mb-6 bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <select id="villageSubCenterSelect" required class="p-2 border border-gray-300 rounded flex-1 font-bold"><option value="">-- उपकेंद्र निवडा --</option></select>
                    <input type="text" id="newVillageName" placeholder="नवीन गावाचे नाव" required class="p-2 border border-gray-300 rounded flex-1 font-bold">
                    <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded font-bold shadow hover:bg-indigo-700">गाव जोडा</button>
                </form>
                <table class="w-full text-left border-collapse border rounded shadow-sm">
                    <thead><tr class="bg-gray-200 text-gray-700"><th class="p-3 border w-16 text-center">अ.क्र.</th><th class="p-3 border">गावाचे नाव</th><th class="p-3 border">संबंधित उपकेंद्र</th><th class="p-3 border text-center w-24">कृती</th></tr></thead>
                    <tbody id="villageTableBody" class="text-sm"></tbody>
                </table>
            </div>

            <div id="employeeTab" class="tab-content hidden">
                <form onsubmit="addEmployee(event)" class="grid grid-cols-1 md:grid-cols-5 gap-3 mb-6 bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <input type="text" id="empName" placeholder="कर्मचाऱ्याचे नाव" required class="p-2 border border-gray-300 rounded font-bold">
                    <input type="tel" id="empMobile" placeholder="मोबाईल नंबर (१० अंकी)" required pattern="[0-9]{10}" class="p-2 border border-gray-300 rounded font-bold">
                    <select id="empRole" required class="p-2 border border-gray-300 rounded font-bold text-purple-700"><option value="">-- पद / Role --</option><option value="MPW">MPW (आरोग्य सेवक)</option><option value="ANM">ANM (आरोग्य सेविका)</option><option value="CHO">CHO (समुदाय आरोग्य अधिकारी)</option></select>
                    <select id="empSubCenterSelect" required class="p-2 border border-gray-300 rounded font-bold"><option value="">-- उपकेंद्र निवडा --</option></select>
                    <div class="flex gap-2">
                        <input type="text" id="empPassword" placeholder="पासवर्ड" value="123456" required class="p-2 border border-gray-300 rounded font-bold w-1/2">
                        <button type="submit" class="bg-teal-600 text-white p-2 rounded font-bold shadow hover:bg-teal-700 w-1/2">जोडा</button>
                    </div>
                </form>
                <table class="w-full text-left border-collapse border rounded shadow-sm">
                    <thead><tr class="bg-gray-200 text-gray-700"><th class="p-3 border">नाव</th><th class="p-3 border text-center">पद</th><th class="p-3 border text-center">मोबाईल / पासवर्ड</th><th class="p-3 border">उपकेंद्र</th><th class="p-3 border text-center">कृती</th></tr></thead>
                    <tbody id="employeeTableBody" class="text-sm"></tbody>
                </table>
            </div>

        </div>
    </div>

    <div id="loader" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl text-center"><div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent mb-3"></div><p class="text-lg font-bold text-gray-800">प्रोसेसिंग सुरू आहे...</p></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qbmjsfiievcautxybaai.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_sdgZ9G8ko4H_3Mh9RouYFg_JOQ-4Mdx'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let loggedInUser = null;
        let isTalukaAdmin = false;
        
        let allPHCs = [];
        let allSubCenters = [];
        let allVillages = [];
        let allEmployees = [];

        window.onload = async function() {
            const userDataString = localStorage.getItem('loggedInUser');
            if (!userDataString) { window.location.href = "index.html"; return; }
            loggedInUser = JSON.parse(userDataString);

            // रोल तपासणे
            isTalukaAdmin = (loggedInUser.role === 'admin' || loggedInUser.role === 'taluka_admin');

            if (isTalukaAdmin) {
                document.getElementById('tabBtnPHC').classList.remove('hidden');
                document.getElementById('scPHCSelect').classList.remove('hidden'); // उपकेंद्र बनवताना PHC निवडता यावे
                document.getElementById('thPHCName').classList.remove('hidden');
                switchTab('phcTab'); // ॲडमिनसाठी पहिला टॅब ओपन
            } else {
                switchTab('subCenterTab'); // PHC ॲडमिनसाठी उपकेंद्र टॅब ओपन
            }

            await loadMasterData();
        };

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.remove('hidden');
            event.currentTarget.classList.add('active');
        }

        function showLoader() { document.getElementById('loader').classList.remove('hidden'); }
        function hideLoader() { document.getElementById('loader').classList.add('hidden'); }

        // ==========================================
        // 🟢 डेटाबेस मधून माहिती ओढणे (Role-Based Filtering)
        // ==========================================
        async function loadMasterData() {
            showLoader();
            try {
                // १. PHCs
                const { data: pData } = await supabaseClient.from('phcs').select('*').order('phc_name');
                allPHCs = pData || [];

                // २. Sub Centers (जर PHC ॲडमिन असेल तर फक्त त्याचेच उपकेंद्र येतील)
                let scQuery = supabaseClient.from('sub_centers').select('*').order('name');
                if (!isTalukaAdmin && loggedInUser.phc_id) scQuery = scQuery.eq('phc_id', loggedInUser.phc_id);
                const { data: scData } = await scQuery;
                allSubCenters = scData || [];

                // ३. Villages
                const validScIds = allSubCenters.map(sc => sc.id);
                let vQuery = supabaseClient.from('villages').select('*').order('name');
                if (!isTalukaAdmin && validScIds.length > 0) vQuery = vQuery.in('sub_center_id', validScIds);
                const { data: vData } = await vQuery;
                allVillages = vData || [];

                // ४. Employees
                let eQuery = supabaseClient.from('employees').select('*').order('full_name');
                if (!isTalukaAdmin && loggedInUser.phc_id) eQuery = eQuery.eq('phc_id', loggedInUser.phc_id);
                const { data: eData } = await eQuery;
                allEmployees = eData || [];

                renderAllUI();
            } catch (error) { alert("माहिती लोड करताना एरर: " + error.message); }
            hideLoader();
        }

        // ==========================================
        // 🟢 UI रेंडर करणे (ड्रॉपडाउन्स आणि टेबल्स)
        // ==========================================
        function renderAllUI() {
            // Dropdowns
            const adminPhcSel = document.getElementById('adminPHCSelect');
            const scPhcSel = document.getElementById('scPHCSelect');
            adminPhcSel.innerHTML = '<option value="">-- PHC निवडा --</option>';
            scPhcSel.innerHTML = '<option value="">-- PHC निवडा --</option>';
            
            allPHCs.forEach(p => {
                adminPhcSel.innerHTML += `<option value="${p.id}">${p.phc_name}</option>`;
                scPhcSel.innerHTML += `<option value="${p.id}">${p.phc_name}</option>`;
            });

            const vScSel = document.getElementById('villageSubCenterSelect');
            const eScSel = document.getElementById('empSubCenterSelect');
            vScSel.innerHTML = '<option value="">-- उपकेंद्र निवडा --</option>';
            eScSel.innerHTML = '<option value="">-- उपकेंद्र निवडा --</option>';
            
            allSubCenters.forEach(sc => {
                let phcName = isTalukaAdmin ? ` (${getPHCName(sc.phc_id)})` : '';
                vScSel.innerHTML += `<option value="${sc.id}">${sc.name}${phcName}</option>`;
                eScSel.innerHTML += `<option value="${sc.id}">${sc.name}${phcName}</option>`;
            });

            // Tables
            renderPHCTable();
            renderSubCenterTable();
            renderVillageTable();
            renderEmployeeTable();
        }

        function getPHCName(id) { let p = allPHCs.find(x => x.id === id); return p ? p.phc_name : 'Unknown'; }
        function getSCName(id) { let s = allSubCenters.find(x => x.id === id); return s ? s.name : 'Unknown'; }

        function renderPHCTable() {
            let tbody = document.getElementById('phcListTable'); tbody.innerHTML = '';
            allPHCs.forEach(p => {
                tbody.innerHTML += `<tr class="border-b"><td class="p-2 border font-bold text-blue-800">${p.phc_name}</td><td class="p-2 border text-center"><button onclick="deleteRecord('phcs', '${p.id}')" class="text-red-500 font-bold hover:text-red-700">✕</button></td></tr>`;
            });
        }

        function renderSubCenterTable() {
            let tbody = document.getElementById('subCenterTableBody'); tbody.innerHTML = '';
            allSubCenters.forEach((sc, i) => {
                let phcTd = isTalukaAdmin ? `<td class="p-3 border font-semibold text-blue-700">${getPHCName(sc.phc_id)}</td>` : '';
                tbody.innerHTML += `<tr class="hover:bg-gray-50"><td class="p-3 border text-center">${i+1}</td><td class="p-3 border font-bold text-gray-800">${sc.name}</td>${phcTd}<td class="p-3 border text-center"><button onclick="deleteRecord('sub_centers', '${sc.id}')" class="text-red-500 font-bold hover:text-red-700 bg-red-50 px-2 py-1 rounded">काढा</button></td></tr>`;
            });
        }

        function renderVillageTable() {
            let tbody = document.getElementById('villageTableBody'); tbody.innerHTML = '';
            allVillages.forEach((v, i) => {
                tbody.innerHTML += `<tr class="hover:bg-gray-50"><td class="p-3 border text-center">${i+1}</td><td class="p-3 border font-bold text-gray-800">${v.name}</td><td class="p-3 border text-gray-600">${getSCName(v.sub_center_id)}</td><td class="p-3 border text-center"><button onclick="deleteRecord('villages', '${v.id}')" class="text-red-500 font-bold hover:text-red-700 bg-red-50 px-2 py-1 rounded">काढा</button></td></tr>`;
            });
        }

        function renderEmployeeTable() {
            let tbody = document.getElementById('employeeTableBody'); tbody.innerHTML = '';
            allEmployees.forEach(e => {
                let scName = e.role === 'phc_admin' ? `<span class="text-blue-600 font-bold">PHC: ${getPHCName(e.phc_id)}</span>` : getSCName(e.sub_center_id);
                let pwd = e.password || e.possword || 'Set NA';
                tbody.innerHTML += `<tr class="hover:bg-gray-50"><td class="p-3 border font-bold text-gray-800">${e.full_name}</td><td class="p-3 border text-center font-bold text-purple-700">${e.role}</td><td class="p-3 border text-center text-gray-600">📱 ${e.mobile_number}<br><span class="text-xs text-gray-400">🔑 ${pwd}</span></td><td class="p-3 border">${scName}</td><td class="p-3 border text-center"><button onclick="deleteRecord('employees', '${e.id}')" class="text-red-500 font-bold hover:text-red-700 bg-red-50 px-2 py-1 rounded">काढा</button></td></tr>`;
            });
        }

        // ==========================================
        // 🟢 CRUD ऑपरेशन्स (Data Entry)
        // ==========================================
        
        async function addPHC(e) {
            e.preventDefault(); showLoader();
            const name = document.getElementById('newPHCName').value.trim();
            const { error } = await supabaseClient.from('phcs').insert([{ phc_name: name }]);
            hideLoader();
            if (error) alert("एरर: " + error.message);
            else { document.getElementById('newPHCName').value = ''; loadMasterData(); }
        }

        async function addPHCAdmin(e) {
            e.preventDefault(); showLoader();
            const phcId = document.getElementById('adminPHCSelect').value;
            const payload = {
                full_name: document.getElementById('adminName').value.trim(),
                mobile_number: document.getElementById('adminMobile').value.trim(),
                password: document.getElementById('adminPassword').value.trim(),
                role: 'phc_admin',
                phc_id: phcId
            };
            const { error } = await supabaseClient.from('employees').insert([payload]);
            hideLoader();
            if (error) alert("एरर: " + error.message);
            else { 
                document.getElementById('adminName').value = ''; 
                document.getElementById('adminMobile').value = ''; 
                loadMasterData(); 
                alert("PHC ॲडमिन यशस्वीरीत्या तयार झाला!"); 
            }
        }

        async function addSubCenter(e) {
            e.preventDefault(); showLoader();
            // जर तालुका ॲडमिन असेल तर ड्रॉपडाऊन मधून PHC घेईल, नाहीतर स्वतःचा phc_id वापरणार
            let phcId = isTalukaAdmin ? document.getElementById('scPHCSelect').value : loggedInUser.phc_id;
            
            if (!phcId) { alert("कृपया PHC निवडा!"); hideLoader(); return; }

            const payload = {
                name: document.getElementById('newSubCenterName').value.trim(),
                phc_id: phcId
            };
            const { error } = await supabaseClient.from('sub_centers').insert([payload]);
            hideLoader();
            if (error) alert("एरर: " + error.message);
            else { document.getElementById('newSubCenterName').value = ''; loadMasterData(); }
        }

        async function addVillage(e) {
            e.preventDefault(); showLoader();
            const payload = {
                name: document.getElementById('newVillageName').value.trim(),
                sub_center_id: document.getElementById('villageSubCenterSelect').value
            };
            const { error } = await supabaseClient.from('villages').insert([payload]);
            hideLoader();
            if (error) alert("एरर: " + error.message);
            else { document.getElementById('newVillageName').value = ''; loadMasterData(); }
        }

        async function addEmployee(e) {
            e.preventDefault(); showLoader();
            const scId = document.getElementById('empSubCenterSelect').value;
            let targetPhcId = loggedInUser.phc_id; // बाय डिफॉल्ट PHC ॲडमिनचा

            // जर तालुका ॲडमिन असेल, तर उपकेंद्रावरून PHC शोधणे
            if (isTalukaAdmin) {
                let scObj = allSubCenters.find(x => x.id === scId);
                targetPhcId = scObj ? scObj.phc_id : null;
            }

            const payload = {
                full_name: document.getElementById('empName').value.trim(),
                mobile_number: document.getElementById('empMobile').value.trim(),
                password: document.getElementById('empPassword').value.trim(),
                role: document.getElementById('empRole').value,
                sub_center_id: scId,
                phc_id: targetPhcId
            };

            const { error } = await supabaseClient.from('employees').insert([payload]);
            hideLoader();
            if (error) alert("एरर: " + error.message);
            else { 
                document.getElementById('empName').value = ''; 
                document.getElementById('empMobile').value = ''; 
                loadMasterData(); 
            }
        }

        async function deleteRecord(table, id) {
            if (confirm("तुम्हाला खात्री आहे की हा रेकॉर्ड कायमचा डिलीट करायचा आहे?")) {
                showLoader();
                const { error } = await supabaseClient.from(table).delete().eq('id', id);
                hideLoader();
                if (error) alert("डिलीट करताना त्रुटी आली: " + error.message);
                else loadMasterData();
            }
        }
    </script>
</body>
</html>
