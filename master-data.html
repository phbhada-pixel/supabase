<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मास्टर डेटा मॅनेजमेंट</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-6 min-h-screen">

    <!-- Header -->
    <div class="max-w-4xl mx-auto bg-white p-4 rounded-lg shadow-md flex justify-between items-center mb-6">
        <h1 class="text-xl font-bold text-blue-600">मास्टर डेटा मॅनेजमेंट</h1>
        <button onclick="window.location.href='dashboard.html'" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 transition">डॅशबोर्डवर परत जा</button>
    </div>

    <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- उपकेंद्र जोडणे -->
        <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-blue-500">
            <h2 class="text-lg font-bold mb-4 text-gray-700">१. नवीन उपकेंद्र जोडा</h2>
            <input type="text" id="scName" placeholder="उपकेंद्राचे नाव" class="w-full p-2 border rounded mb-4">
            <button onclick="addSubCenter()" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">उपकेंद्र सेव्ह करा</button>
        </div>

        <!-- गाव जोडणे -->
        <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-green-500">
            <h2 class="text-lg font-bold mb-4 text-gray-700">२. नवीन गाव जोडा</h2>
            <input type="text" id="vName" placeholder="गावाचे नाव" class="w-full p-2 border rounded mb-2">
            <select id="vScSelect" class="w-full p-2 border rounded mb-4 bg-white">
                <option value="">-- उपकेंद्र निवडा --</option>
            </select>
            <button onclick="addVillage()" class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600">गाव सेव्ह करा</button>
        </div>

        <!-- कर्मचारी जोडणे -->
        <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-purple-500 md:col-span-2">
            <h2 class="text-lg font-bold mb-4 text-gray-700">३. नवीन कर्मचारी (User) जोडा</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <input type="text" id="empName" placeholder="कर्मचाऱ्याचे पूर्ण नाव" class="p-2 border rounded w-full">
                <input type="number" id="empMobile" placeholder="१० अंकी मोबाईल नंबर" class="p-2 border rounded w-full" onkeypress="if(this.value.length==10) return false;">
                <select id="empRole" class="p-2 border rounded w-full bg-white">
                    <option value="user">User (कर्मचारी)</option>
                    <option value="admin">Admin (एडमिन)</option>
                </select>
                <select id="empScSelect" class="p-2 border rounded w-full bg-white">
                    <option value="">-- उपकेंद्र निवडा (पर्यायी) --</option>
                </select>
            </div>
            <button onclick="addEmployee()" class="w-full bg-purple-500 text-white p-2 rounded hover:bg-purple-600">कर्मचारी सेव्ह करा</button>
        </div>

    </div>

    <script>
        // Supabase जोडणी
        const SUPABASE_URL = 'https://qbmjsfiievcautxybaai.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_sdgZ9G8ko4H_3Mh9RouYFg_JOQ-4Mdx'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // पेज लोड झाल्यावर ऑथेंटिकेशन आणि डेटा लोड करणे
        window.onload = function() {
            const userDataString = localStorage.getItem('loggedInUser');
            if (!userDataString) {
                window.location.href = "index.html";
                return;
            }
            const user = JSON.parse(userDataString);
            
            // फक्त एडमिनला परवानगी
            if (user.role !== 'admin') {
                alert("तुम्हाला या पानावर जाण्याची परवानगी नाही!");
                window.location.href = "dashboard.html";
                return;
            }

            // ड्रॉपडाऊनसाठी उपकेंद्रांची यादी लोड करणे
            loadSubCenters();
        };

        // उपकेंद्रांची यादी डेटाबेसमधून आणणे
        async function loadSubCenters() {
            const { data, error } = await supabaseClient.from('sub_centers').select('id, name');
            if (!error && data) {
                let options = '<option value="">-- उपकेंद्र निवडा --</option>';
                data.forEach(sc => {
                    options += `<option value="${sc.id}">${sc.name}</option>`;
                });
                document.getElementById('vScSelect').innerHTML = options;
                document.getElementById('empScSelect').innerHTML = options;
            }
        }

        // १. नवीन उपकेंद्र डेटाबेसमध्ये टाकणे
        async function addSubCenter() {
            const name = document.getElementById('scName').value;
            if(!name) return alert("कृपया उपकेंद्राचे नाव टाका!");

            const { error } = await supabaseClient.from('sub_centers').insert([{ name: name }]);
            if (error) alert("एरर: " + error.message);
            else {
                alert("उपकेंद्र यशस्वीरीत्या जोडले!");
                document.getElementById('scName').value = '';
                loadSubCenters(); // यादी अपडेट करणे
            }
        }

        // २. नवीन गाव डेटाबेसमध्ये टाकणे
        async function addVillage() {
            const name = document.getElementById('vName').value;
            const scId = document.getElementById('vScSelect').value;
            if(!name || !scId) return alert("कृपया गावाची सर्व माहिती भरा!");

            const { error } = await supabaseClient.from('villages').insert([{ name: name, sub_center_id: scId }]);
            if (error) alert("एरर: " + error.message);
            else {
                alert("गाव यशस्वीरीत्या जोडले!");
                document.getElementById('vName').value = '';
            }
        }

        // ३. नवीन कर्मचारी डेटाबेसमध्ये टाकणे
        async function addEmployee() {
            const name = document.getElementById('empName').value;
            const mobile = document.getElementById('empMobile').value;
            const role = document.getElementById('empRole').value;
            const scId = document.getElementById('empScSelect').value || null;

            if(!name || mobile.length !== 10) return alert("कृपया योग्य नाव आणि १० अंकी मोबाईल नंबर टाका!");

            const { error } = await supabaseClient.from('employees').insert([{ 
                full_name: name, 
                mobile_number: mobile, 
                role: role, 
                sub_center_id: scId 
            }]);
            
            if (error) {
                if(error.code === '23505') alert("हा मोबाईल नंबर आधीच सिस्टीममध्ये नोंदणीकृत आहे!");
                else alert("एरर: " + error.message);
            } else {
                alert("कर्मचारी यशस्वीरीत्या जोडला!");
                document.getElementById('empName').value = '';
                document.getElementById('empMobile').value = '';
            }
        }
    </script>
</body>
</html>
