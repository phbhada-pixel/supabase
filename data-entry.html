<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>माहिती भरा (Data Entry) - आरोग्य प्रणाली</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-2 md:p-6 min-h-screen">

    <div class="max-w-4xl mx-auto bg-white p-4 rounded-lg shadow-md flex justify-between items-center mb-6 border-t-8 border-indigo-600">
        <div>
            <h1 class="text-xl font-bold text-indigo-800">✍️ माहिती भरा (Data Entry)</h1>
            <p class="text-sm font-bold text-gray-500 mt-1" id="userNameDisplay">...</p>
        </div>
        <button onclick="window.location.href='dashboard.html'" class="bg-gray-600 text-white px-4 py-2 rounded font-bold shadow hover:bg-gray-700 transition text-sm">डॅशबोर्डवर परत जा</button>
    </div>

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md mb-8">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6 pb-6 border-b border-gray-200">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">कोणता अहवाल भरायचा आहे? <span class="text-red-500">*</span></label>
                <select id="formSelect" onchange="onFormChange()" class="w-full p-3 border-2 border-indigo-300 rounded-lg focus:ring-2 focus:ring-indigo-500 font-bold bg-indigo-50 text-indigo-900 shadow-sm transition">
                    <option value="">-- फॉर्म निवडा --</option>
                </select>
                <p id="formTypeHint" class="text-xs font-bold text-gray-500 mt-2 hidden"></p>
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">कोणत्या गावाचा अहवाल? <span class="text-red-500">*</span></label>
                <select id="villageSelect" class="w-full p-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 font-bold shadow-sm transition">
                    <option value="">-- आधी फॉर्म निवडा --</option>
                </select>
            </div>
        </div>

        <div id="dynamicFormArea" class="hidden">
            <h2 class="text-lg font-extrabold text-gray-800 mb-4 bg-gray-100 p-3 rounded-lg border border-gray-200" id="formTitleDisplay">फॉर्म भरणे सुरू करा</h2>
            
            <form id="dataEntryForm" onsubmit="event.preventDefault();" class="space-y-4">
                <div id="fieldsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    </div>

                <div class="flex flex-wrap gap-3 mt-8 pt-6 border-t border-gray-200 justify-end" id="actionButtons">
                    
                    <button type="button" id="btnNilReport" onclick="submitData(true, false)" class="hidden bg-gray-500 text-white px-6 py-3 rounded-lg font-extrabold shadow-lg hover:bg-gray-600 transition w-full md:w-auto">
                        🚫 निरंक (NIL) अहवाल सबमिट करा
                    </button>

                    <button type="button" id="btnSaveAndAddMore" onclick="submitData(false, true)" class="hidden bg-indigo-600 text-white px-6 py-3 rounded-lg font-extrabold shadow-lg hover:bg-indigo-700 transition w-full md:w-auto">
                        ➕ सेव्ह करा आणि आणखी जोडा
                    </button>

                    <button type="button" id="btnSaveAndFinish" onclick="submitData(false, false)" class="bg-green-600 text-white px-8 py-3 rounded-lg font-extrabold shadow-lg hover:bg-green-700 transition w-full md:w-auto">
                        ✅ सेव्ह करा
                    </button>

                </div>
            </form>
        </div>

    </div>

    <div id="loader" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl text-center border-t-8 border-indigo-600">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent mb-3"></div>
            <p class="text-lg font-bold text-gray-800" id="loaderText">माहिती लोड होत आहे...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qbmjsfiievcautxybaai.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_sdgZ9G8ko4H_3Mh9RouYFg_JOQ-4Mdx'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let globalForms = [];
        let globalVillages = [];
        let pastResponses = [];
        let currentFormObj = null;

        const CURRENT_MONTH = new Date().getMonth() + 1;
        const CURRENT_YEAR = new Date().getFullYear();

        window.onload = async function() {
            const userStr = localStorage.getItem('loggedInUser');
            if (!userStr) { window.location.href = "index.html"; return; }
            currentUser = JSON.parse(userStr);
            document.getElementById('userNameDisplay').innerText = `🧑‍⚕️ ${currentUser.full_name} (${String(currentUser.role).toUpperCase()})`;

            await fetchData();
        };

        function showLoader(text="प्रक्रिया सुरू आहे...") { document.getElementById('loaderText').innerText = text; document.getElementById('loader').classList.remove('hidden'); }
        function hideLoader() { document.getElementById('loader').classList.add('hidden'); }

        async function fetchData() {
            showLoader("फॉर्म आणि गावे लोड करत आहे...");
            try {
                // फॉर्म्स आणणे
                const { data: fData } = await supabaseClient.from('dynamic_forms').select('*').eq('is_active', true);
                globalForms = fData || [];

                // कर्मचाऱ्यांची गावे आणणे
                const { data: vData } = await supabaseClient.from('villages').select('*').eq('sub_center_id', currentUser.sub_center_id);
                globalVillages = vData || [];

                // या महिन्याचे भरलेले अहवाल आणणे
                const { data: rData } = await supabaseClient.from('form_responses')
                    .select('form_id, village_id, response_data')
                    .eq('employee_id', currentUser.id)
                    .eq('report_month', CURRENT_MONTH)
                    .eq('report_year', CURRENT_YEAR);
                pastResponses = rData || [];

                populateFormsDropdown();
            } catch (error) { alert("एरर: " + error.message); }
            hideLoader();
        }

        function populateFormsDropdown() {
            const sel = document.getElementById('formSelect');
            sel.innerHTML = '<option value="">-- फॉर्म निवडा --</option>';
            globalForms.forEach(f => { sel.innerHTML += `<option value="${f.id}">${f.form_name}</option>`; });
        }

        // ==========================================
        // 🟢 फॉर्म निवडल्यावरची प्रगत प्रक्रिया
        // ==========================================
        function onFormChange() {
            const formId = document.getElementById('formSelect').value;
            const area = document.getElementById('dynamicFormArea');
            const vSel = document.getElementById('villageSelect');
            
            if (!formId) { area.classList.add('hidden'); vSel.innerHTML = '<option value="">-- आधी फॉर्म निवडा --</option>'; return; }

            currentFormObj = globalForms.find(f => f.id === formId);
            const isListForm = (currentFormObj.form_type === 'list');

            // 🟢 १. फॉर्मचा प्रकार दाखवणे
            const hint = document.getElementById('formTypeHint');
            hint.classList.remove('hidden');
            if (isListForm) {
                hint.innerHTML = "📝 हा <b>'यादी (List)'</b> प्रकारचा फॉर्म आहे. यात तुम्ही एकाच गावासाठी अनेक नोंदी करू शकता. माहिती नसल्यास 'निरंक' सबमिट करू शकता.";
                hint.className = "text-xs font-bold text-indigo-600 mt-2 bg-indigo-50 p-2 rounded";
            } else {
                hint.innerHTML = "📊 हा <b>'मासिक (Monthly)'</b> प्रकारचा फॉर्म आहे. एका गावासाठी महिन्यातून एकदाच भरता येईल.";
                hint.className = "text-xs font-bold text-teal-600 mt-2 bg-teal-50 p-2 rounded";
            }

            // 🟢 २. बटणे ॲडजस्ट करणे
            if (isListForm) {
                document.getElementById('btnNilReport').classList.remove('hidden');
                document.getElementById('btnSaveAndAddMore').classList.remove('hidden');
                document.getElementById('btnSaveAndFinish').innerHTML = "✅ सेव्ह करा आणि डॅशबोर्डवर जा";
            } else {
                document.getElementById('btnNilReport').classList.add('hidden');
                document.getElementById('btnSaveAndAddMore').classList.add('hidden');
                document.getElementById('btnSaveAndFinish').innerHTML = "✅ सेव्ह करा";
            }

            // 🟢 ३. गावे फिल्टर करणे (सर्वात महत्त्वाची पायरी)
            vSel.innerHTML = '<option value="">-- गाव निवडा --</option>';
            let availableVillages = 0;

            globalVillages.forEach(v => {
                let hasEntry = pastResponses.some(r => r.form_id === formId && r.village_id === v.id);
                let hasNilEntry = pastResponses.some(r => r.form_id === formId && r.village_id === v.id && r.response_data && r.response_data.is_nil === true);

                let shouldShow = true;
                if (isListForm) {
                    // यादी फॉर्म: जर निरंक (NIL) भरले असेल, तरच गाव गायब होईल. एरवी दिसेल.
                    if (hasNilEntry) shouldShow = false;
                } else {
                    // मासिक फॉर्म: कोणतीही एन्ट्री असली तरी गाव गायब होईल.
                    if (hasEntry) shouldShow = false;
                }

                if (shouldShow) {
                    vSel.innerHTML += `<option value="${v.id}">${v.name}</option>`;
                    availableVillages++;
                }
            });

            if (availableVillages === 0) {
                vSel.innerHTML = '<option value="">🎉 या महिन्याचे सर्व अहवाल पूर्ण झाले आहेत!</option>';
                area.classList.add('hidden');
            } else {
                renderFields(currentFormObj.schema_json.fields);
                document.getElementById('formTitleDisplay').innerText = `📋 ${currentFormObj.form_name}`;
                area.classList.remove('hidden');
            }
        }

        // ==========================================
        // 🟢 फॉर्म फील्ड्स रेंडर करणे
        // ==========================================
        function renderFields(fields) {
            const container = document.getElementById('fieldsContainer');
            container.innerHTML = '';
            
            fields.forEach(f => {
                if (f.type === 'group_header') {
                    const div = document.createElement('div');
                    div.className = "col-span-1 md:col-span-2 bg-indigo-100 p-2 mt-4 rounded border border-indigo-200";
                    div.innerHTML = `<h3 class="font-extrabold text-indigo-900 text-sm">${f.label}</h3>`;
                    container.appendChild(div);
                    return;
                }
                if (f.formula && f.formula.trim() !== "") return; // फॉर्म्युला फील्ड लपवा

                const div = document.createElement('div');
                let requiredHtml = f.required ? '<span class="text-red-500">*</span>' : '';
                let html = `<label class="block text-sm font-bold text-gray-700 mb-1">${f.label} ${requiredHtml}</label>`;
                
                if (f.type === 'text' || f.type === 'mobile') {
                    let tType = f.type === 'mobile' ? 'tel' : 'text';
                    let patt = f.type === 'mobile' ? 'pattern="[0-9]{10}" placeholder="10 अंकी नंबर"' : '';
                    html += `<input type="${tType}" id="${f.id}" ${f.required ? 'required' : ''} ${patt} class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 font-medium">`;
                } else if (f.type === 'number') {
                    html += `<input type="number" id="${f.id}" step="0.01" ${f.required ? 'required' : ''} class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 font-bold text-blue-700">`;
                } else if (f.type === 'date') {
                    html += `<input type="date" id="${f.id}" ${f.required ? 'required' : ''} class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 font-medium">`;
                } else if (f.type === 'dropdown') {
                    html += `<select id="${f.id}" ${f.required ? 'required' : ''} class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 font-medium"><option value="">-- निवडा --</option>`;
                    if(f.options) { f.options.forEach(opt => html += `<option value="${opt}">${opt}</option>`); }
                    html += `</select>`;
                }
                
                div.innerHTML = html;
                container.appendChild(div);
            });
        }

        // ==========================================
        // 🟢 डेटा सबमिट करणे (NIL आणि Add More लॉजिक)
        // ==========================================
        async function submitData(isNilReport, addMoreRecord) {
            const formId = document.getElementById('formSelect').value;
            const villageId = document.getElementById('villageSelect').value;

            if (!villageId) { alert("कृपया अहवाल भरण्यासाठी गाव निवडा!"); return; }

            let responseData = {};

            if (isNilReport) {
                // निरंक (NIL) रिपोर्ट असल्यास
                if(!confirm("तुम्हाला खात्री आहे की या गावासाठी या महिन्याची माहिती 'निरंक (NIL)' आहे? (यानंतर या महिन्यात या गावाची नोंद करता येणार नाही)")) return;
                responseData = { is_nil: true };
            } else {
                // नेहमीची माहिती असल्यास व्हॅलिडेशन करा
                const fields = currentFormObj.schema_json.fields.filter(f => f.type !== 'group_header' && (!f.formula || f.formula.trim() === ""));
                
                // HTML5 Form Validation Check
                const formEl = document.getElementById('dataEntryForm');
                if (!formEl.checkValidity()) { formEl.reportValidity(); return; }

                fields.forEach(f => {
                    let el = document.getElementById(f.id);
                    if (el) responseData[f.id] = { value: el.value.trim() };
                });
            }

            showLoader("डेटा सेव्ह होत आहे...");
            try {
                const payload = {
                    form_id: formId,
                    village_id: villageId,
                    employee_id: currentUser.id,
                    report_month: CURRENT_MONTH,
                    report_year: CURRENT_YEAR,
                    response_data: responseData
                };

                const { error } = await supabaseClient.from('form_responses').insert([payload]);
                if (error) throw error;

                // रेकॉर्ड सक्सेस
                pastResponses.push(payload); // लोकल ॲरे अपडेट करा

                if (isNilReport) {
                    alert("✅ निरंक (NIL) अहवाल यशस्वीरीत्या सबमिट झाला!");
                    onFormChange(); // गाव यादीतून हटवण्यासाठी ड्रॉपडाऊन रिफ्रेश करा
                } else if (addMoreRecord) {
                    alert("✅ माहिती सेव्ह झाली! तुम्ही या गावासाठी पुढची नोंद करू शकता.");
                    document.getElementById('dataEntryForm').reset(); // फॉर्म रिकामा करा पण गाव तेच ठेवा
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    alert("✅ माहिती यशस्वीरीत्या सेव्ह झाली!");
                    window.location.href = "dashboard.html"; // काम संपले, डॅशबोर्डवर जा
                }

            } catch (err) { alert("माहिती सेव्ह करताना एरर: " + err.message); }
            hideLoader();
        }
    </script>
</body>
</html>
