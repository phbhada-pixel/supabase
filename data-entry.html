<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>माहिती भरा - आरोग्य उपकेंद्र</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="bg-gray-100 p-2 md:p-6 min-h-screen">

    <div class="max-w-7xl mx-auto bg-white p-4 rounded-lg shadow-md flex justify-between items-center mb-6 no-print border-t-8 border-indigo-600">
        <div>
            <h1 class="text-xl md:text-2xl font-bold text-indigo-700">📝 नवीन माहिती भरा (Data Entry)</h1>
            <p class="text-xs md:text-sm text-gray-500">तुमच्या सोयीनुसार एक गाव किंवा सर्व गावे निवडा</p>
        </div>
        <button onclick="window.location.href='dashboard.html'" class="bg-gray-500 text-white px-3 py-2 rounded hover:bg-gray-600 transition text-sm font-bold shadow">डॅशबोर्ड</button>
    </div>

    <div class="max-w-7xl mx-auto bg-white p-3 md:p-6 rounded-lg shadow-md">

        <div class="grid grid-cols-1 md:grid-cols-6 gap-4 mb-4 pb-4 border-b border-gray-200">
            <div class="md:col-span-2">
                <label class="block text-gray-700 font-bold mb-2 text-sm">कोणते अहवाल पाहायचे आहेत?</label>
                <select id="frequencyFilter" onchange="updateFormDropdown()" class="w-full p-2.5 border-2 border-blue-400 rounded bg-blue-50 font-bold text-blue-900 text-base shadow-sm">
                    <option value="all">सर्व (All)</option>
                    <option value="daily">दैनिक (Daily)</option>
                    <option value="weekly">आठवडी (Weekly)</option>
                    <option value="fortnightly">पंधरवाडी (Fortnightly)</option>
                    <option value="monthly">मासिक (Monthly)</option>
                    <option value="onetime">एकदाच (One-Time)</option>
                </select>
            </div>

            <div class="md:col-span-4">
                <label class="block text-gray-700 font-bold mb-2 text-sm">अहवाल / फॉर्म निवडा <span class="text-red-500">*</span></label>
                <select id="formSelect" onchange="loadFormSchema()" class="w-full p-2.5 border-2 border-indigo-400 rounded bg-indigo-50 font-extrabold text-indigo-900 shadow-sm text-base transition-all">
                    <option value="">-- फॉर्म लोड होत आहेत --</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-6 gap-4 md:gap-4 mb-6 pb-6 border-b" id="topControlsDiv">
            <div class="md:col-span-1">
                <label class="block text-gray-700 font-bold mb-2 text-sm">अहवाल महिना <span class="text-red-500">*</span></label>
                <select id="reportMonth" onchange="handleMonthYearChange()" class="w-full p-2.5 border-2 border-gray-300 rounded font-bold text-gray-800 text-base">
                    <option value="1">जानेवारी</option><option value="2">फेब्रुवारी</option>
                    <option value="3">मार्च</option><option value="4">एप्रिल</option>
                    <option value="5">मे</option><option value="6">जून</option>
                    <option value="7">जुलै</option><option value="8">ऑगस्ट</option>
                    <option value="9">सप्टेंबर</option><option value="10">ऑक्टोबर</option>
                    <option value="11">नोव्हेंबर</option><option value="12">डिसेंबर</option>
                </select>
            </div>
            
            <div class="md:col-span-1">
                <label class="block text-gray-700 font-bold mb-2 text-sm">अहवाल वर्ष <span class="text-red-500">*</span></label>
                <input type="number" id="reportYear" onchange="handleMonthYearChange()" class="w-full p-2.5 border-2 border-gray-300 rounded text-base font-mono font-bold" value="2026">
            </div>

            <div id="dynamicPeriodDiv" class="hidden md:col-span-2">
                <label id="dynamicPeriodLabel" class="block text-orange-700 font-bold mb-2 text-sm">कालावधी <span class="text-red-500">*</span></label>
                <select id="dynamicPeriodValue" onchange="handleMonthYearChange()" class="w-full p-2.5 border-2 border-orange-400 rounded bg-orange-50 font-bold text-orange-900 text-base shadow-sm">
                </select>
            </div>

            <div class="md:col-span-2" id="villageDivWrapper">
                <label class="block text-gray-700 font-bold mb-2 text-sm flex justify-between items-end">
                    <span>गाव / कार्यक्षेत्र निवडा <span class="text-red-500">*</span></span>
                </label>
                <select id="villageSelect" onchange="renderFormFields()" class="w-full p-2.5 border-2 border-green-400 rounded bg-green-50 font-extrabold text-green-900 shadow-sm text-base disabled:opacity-50">
                    <option value="">-- आधी फॉर्म निवडा --</option>
                </select>
                
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mt-2 gap-2">
                    <p id="villageHint" class="text-[10px] text-green-600 hidden font-bold">✓ काही अहवाल भरून झाले आहेत.</p>
                    
                    <button type="button" id="btnNilAllReport" onclick="submitNilForAll()" class="hidden w-full md:w-auto bg-gray-600 text-white px-3 py-2 md:py-1 rounded text-sm md:text-xs font-bold hover:bg-gray-700 shadow-md transition transform hover:scale-105">
                        🚫 सर्व राहिलेल्या गावांचा 'निरंक' भरा
                    </button>
                </div>
            </div>
        </div>

        <form id="dynamicDataForm" onsubmit="event.preventDefault();">

            <div id="dynamicFieldsContainer" class="mb-8">
                <p class="text-center text-gray-400 font-bold py-10 text-lg">कृपया वरून फॉर्म आणि गाव निवडा. प्रश्नांची यादी येथे दिसेल.</p>
            </div>

            <div class="flex flex-col md:flex-row justify-center md:justify-end gap-3 border-t pt-4" id="actionButtonsContainer">
                <button type="button" id="btnSaveAndAddMore" onclick="submitData(false, true)" class="hidden w-full md:w-auto bg-blue-600 text-white px-6 py-4 md:py-3 rounded-lg font-extrabold text-lg shadow-xl hover:bg-blue-700 transition transform hover:scale-105">
                    ➕ सेव्ह करून आणखी जोडा
                </button>

                <button type="button" id="submitBtn" onclick="submitData(false, false)" class="hidden w-full md:w-auto bg-green-600 text-white px-10 py-4 md:py-3 rounded-lg font-extrabold text-xl md:text-lg shadow-xl hover:bg-green-700 transition transform hover:scale-105">
                    💾 माहिती सेव्ह करा
                </button>
            </div>
        </form>

    </div>

    <div id="loader" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl text-center border-4 border-green-500">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-green-600 border-t-transparent mb-4"></div>
            <p class="text-xl font-extrabold text-gray-800" id="loaderText">डेटा सुरक्षित सेव्ह होत आहे...</p>
            <p class="text-sm font-bold text-gray-500 mt-2">कृपया ब्राउझर बंद करू नका</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qbmjsfiievcautxybaai.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_sdgZ9G8ko4H_3Mh9RouYFg_JOQ-4Mdx'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let loggedInUser = null;
        let allFormsMap = {};
        let userVillages = [];
        let allowedForms = [];
        let currentMonthResponses = [];
        let onetimeResponses = []; 

        let globalPendingVillages = []; 
        let globalNilVillages = []; 
        let currentPendingVillages = []; 
        let currentDataFields = []; 
        let currentFormObj = null;

        window.onload = async function() {
            const userDataString = localStorage.getItem('loggedInUser');
            if (!userDataString) { window.location.href = "index.html"; return; }
            loggedInUser = JSON.parse(userDataString);

            const currentMonth = new Date().getMonth() + 1;
            document.getElementById('reportMonth').value = currentMonth;
            document.getElementById('reportYear').value = new Date().getFullYear();

            await fetchVillages();
            await fetchAvailableForms();
            await fetchOnetimeResponses(); 
            await fetchMonthResponses(); 

            updateFormDropdown(); 

            // 🟢 नवीन जोडलेला कोड: URL मध्ये 'urgent=true' असल्यास 'is_urgent' टिक केलेला फॉर्म शोधा
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('urgent') === 'true') {
                const formSelect = document.getElementById('formSelect');
                let urgentFound = false;
                
                for (let i = 0; i < formSelect.options.length; i++) {
                    if (!formSelect.options[i].value) continue; 

                    let fId = formSelect.options[i].value;
                    let fObj = allFormsMap[fId];
                    
                    if (fObj && fObj.schema_json && fObj.schema_json.is_urgent === true) {
                        formSelect.selectedIndex = i;
                        urgentFound = true;
                        break;
                    }
                }

                if (urgentFound) {
                    loadFormSchema(); 
                    
                    formSelect.classList.remove('border-indigo-400', 'bg-indigo-50', 'text-indigo-900');
                    formSelect.classList.add('border-red-500', 'bg-red-50', 'text-red-900', 'ring-4', 'ring-red-300');
                    
                    document.getElementById('dynamicFieldsContainer').classList.add('border-2', 'border-red-400', 'p-4', 'rounded-lg', 'bg-red-50/30');
                } else {
                    alert('⚠️ तातडीचा फॉर्म (Urgent Form) सध्या उपलब्ध नाही किंवा तो तुम्ही आधीच भरलेला आहे.');
                }
            }
        };

        function getFieldHierarchyChain(fields, fieldObj) {
            let chain = [];
            let current = fieldObj;
            while (current && current.parent_id) {
                let parent = fields.find(f => f.id === current.parent_id);
                if (parent) {
                    if (parent.type === 'group_header') {
                        chain.unshift(parent.label);
                    }
                    current = parent;
                } else {
                    break;
                }
            }
            return chain; 
        }

        async function fetchVillages() {
            let subCenterId = loggedInUser.sub_center_id;
            if(!subCenterId || subCenterId === '00000000-0000-0000-0000-000000000000') {
                if(loggedInUser.role === 'बाह्य रुग्ण विभाग सेविका') subCenterId = null; 
            }

            let query = supabaseClient.from('villages').select('*').order('name');
            
            if (subCenterId) query = query.eq('sub_center_id', subCenterId);
            else if(loggedInUser.phc_id) {
                const scRes = await supabaseClient.from('sub_centers').select('id').eq('phc_id', loggedInUser.phc_id);
                if(scRes.data && scRes.data.length > 0) {
                    query = query.in('sub_center_id', scRes.data.map(s=>s.id));
                }
            }

            const { data, error } = await query;
            userVillages = data || [];
        }

       async function fetchAvailableForms() {
            const { data, error } = await supabaseClient.from('dynamic_forms').select('*').eq('is_active', true);
            
            if (!error && data) {
                let userRole = loggedInUser.role ? String(loggedInUser.role).trim().toUpperCase() : "ALL";
                
                let today = new Date();
                today.setHours(0, 0, 0, 0);

                allowedForms = data.filter(form => {
                    let rolesStr = form.allowed_roles ? String(form.allowed_roles).trim().toUpperCase() : "ALL";
                    let roleAllowed = false;
                    if (rolesStr === "ALL" || loggedInUser.role === "admin") {
                        roleAllowed = true;
                    } else {
                        roleAllowed = rolesStr.split(',').map(r => r.trim()).includes(userRole);
                    }
                    if (!roleAllowed) return false;

                    let activeFrom = form.active_from ? new Date(form.active_from) : null;
                    let activeTo = form.active_to ? new Date(form.active_to) : null;
                    
                    if(activeFrom) activeFrom.setHours(0, 0, 0, 0);
                    if(activeTo) activeTo.setHours(23, 59, 59, 999);

                    if (activeFrom && today < activeFrom) return false;
                    if (activeTo && today > activeTo) return false;

                    return true;
                });
            }
        }

        async function fetchOnetimeResponses() {
            if (userVillages.length === 0) return;
            const onetimeFormIds = allowedForms.filter(f => {
                let freq = f.schema_json && f.schema_json.frequency ? f.schema_json.frequency : (f.form_type === 'fortnightly' ? 'fortnightly' : 'monthly');
                return freq === 'onetime';
            }).map(f => f.id);
            
            if(onetimeFormIds.length === 0) return;
            
            const villageIds = userVillages.map(v => v.id);
            const { data, error } = await supabaseClient
                .from('form_responses')
                .select('form_id, village_id, employee_id, response_data')
                .in('form_id', onetimeFormIds)
                .in('village_id', villageIds);

            onetimeResponses = data || [];
        }

        async function fetchMonthResponses() {
            const m = document.getElementById('reportMonth').value;
            const y = document.getElementById('reportYear').value;
            if (userVillages.length === 0) return;
            const villageIds = userVillages.map(v => v.id);

            const { data, error } = await supabaseClient
                .from('form_responses')
                .select('form_id, village_id, employee_id, response_data, report_fortnight')
                .eq('report_month', parseInt(m))
                .eq('report_year', parseInt(y))
                .in('village_id', villageIds);

            currentMonthResponses = data || [];
        }

        async function handleMonthYearChange() {
            document.getElementById('dynamicFieldsContainer').innerHTML = '<p class="text-center text-blue-500 font-bold py-10 text-lg">महिना/कालावधी बदलला आहे, डेटा तपासला जात आहे...</p>';
            document.getElementById('submitBtn').classList.add('hidden');
            document.getElementById('btnSaveAndAddMore').classList.add('hidden');
            document.getElementById('btnNilAllReport').classList.add('hidden');
            document.getElementById('villageSelect').innerHTML = '<option value="">-- आधी फॉर्म निवडा --</option>';
            document.getElementById('villageHint').classList.add('hidden');

            await fetchMonthResponses();
            updateFormDropdown(); 
            
            if(document.getElementById('formSelect').value) {
                loadFormSchema();
            }
        }

        function updateFormDropdown() {
            const fSelect = document.getElementById('formSelect');
            const freqFilter = document.getElementById('frequencyFilter').value;
            const currentSelection = fSelect.value;
            fSelect.innerHTML = '<option value="">-- फॉर्म निवडा --</option>';
            allFormsMap = {};

            let periodVal = parseInt(document.getElementById('dynamicPeriodValue') ? document.getElementById('dynamicPeriodValue').value : "1") || 1;

            allowedForms.forEach(form => {
                let freq = form.schema_json && form.schema_json.frequency ? form.schema_json.frequency : (form.form_type === 'fortnightly' ? 'fortnightly' : 'monthly');
                
                if (freqFilter !== 'all' && freq !== freqFilter) return;

                let showForm = true;
                
                if (form.form_type === 'list' || freq === 'daily' || freq === 'weekly' || freq === 'fortnightly') {
                    showForm = true;
                } else if (form.form_type === 'subcenter' && userVillages.length > 0) {
                    let isFilled = currentMonthResponses.some(r => 
                        r.form_id === form.id && 
                        (form.data_entry_mode === 'individual' ? r.employee_id === loggedInUser.id : true)
                    );
                    if (isFilled) showForm = false;
                } else if (freq === 'onetime' && userVillages.length > 0) {
                    let filledCount = 0;
                    userVillages.forEach(v => {
                        let isFilled = onetimeResponses.some(r => 
                            r.form_id === form.id && r.village_id === v.id && 
                            (form.data_entry_mode === 'individual' ? r.employee_id === loggedInUser.id : true)
                        );
                        if (isFilled) filledCount++;
                    });
                    if (filledCount >= userVillages.length) showForm = false;
                } else if (form.form_type !== 'list' && userVillages.length > 0) {
                    let filledCount = 0;
                    userVillages.forEach(v => {
                        let isFilled = currentMonthResponses.some(r => 
                            r.form_id === form.id && r.village_id === v.id && 
                            (form.data_entry_mode === 'individual' ? r.employee_id === loggedInUser.id : true)
                        );
                        if (isFilled) filledCount++;
                    });
                    if (filledCount >= userVillages.length) showForm = false; 
                }

                if (showForm) {
                    allFormsMap[form.id] = form;
                    const opt = document.createElement('option');
                    opt.value = form.id; 
                    let tag = "";
                    if(freq === 'daily') tag = " (दैनिक)";
                    else if(freq === 'weekly') tag = " (आठवडी)";
                    else if(freq === 'fortnightly') tag = " (पंधरवाडी)";
                    else if(freq === 'onetime') tag = " (एकदाच)";
                    else if(form.form_type === 'list') tag = " (यादी)";
                    else if(form.form_type === 'subcenter') tag = " (उपकेंद्र एकत्रित)";
                    opt.text = form.form_name + tag;
                    fSelect.appendChild(opt);
                }
            });

            if (allFormsMap[currentSelection]) {
                fSelect.value = currentSelection;
                loadFormSchema(); 
            } else {
                fSelect.value = "";
                document.getElementById('villageSelect').innerHTML = '<option value="">-- आधी फॉर्म निवडा --</option>';
                document.getElementById('villageHint').classList.add('hidden');
                document.getElementById('btnNilAllReport').classList.add('hidden');
                document.getElementById('dynamicFieldsContainer').innerHTML = '<p class="text-center text-gray-400 font-bold py-10 text-lg">कृपया वरून फॉर्म आणि गाव निवडा.</p>';
                document.getElementById('dynamicPeriodDiv').classList.add('hidden');
            }
        }

        function loadFormSchema() {
            const formId = document.getElementById('formSelect').value;
            const container = document.getElementById('dynamicFieldsContainer');
            const vSelect = document.getElementById('villageSelect');
            const vHint = document.getElementById('villageHint');
            const btnNilAll = document.getElementById('btnNilAllReport');

            document.getElementById('submitBtn').classList.add('hidden');
            document.getElementById('btnSaveAndAddMore').classList.add('hidden');
            btnNilAll.classList.add('hidden');
            container.innerHTML = '<p class="text-center text-gray-400 font-bold py-10 text-lg">कृपया गाव / कार्यक्षेत्र निवडा.</p>';

            if (!formId) {
                vSelect.innerHTML = '<option value="">-- आधी फॉर्म निवडा --</option>';
                vHint.classList.add('hidden');
                document.getElementById('dynamicPeriodDiv').classList.add('hidden');
                return;
            }

            currentFormObj = allFormsMap[formId];
            globalPendingVillages = [];
            globalNilVillages = []; 
            let hiddenCount = 0;
            
            let freq = currentFormObj.schema_json && currentFormObj.schema_json.frequency ? currentFormObj.schema_json.frequency : (currentFormObj.form_type === 'fortnightly' ? 'fortnightly' : 'monthly');

            let dDiv = document.getElementById('dynamicPeriodDiv');
            let dLabel = document.getElementById('dynamicPeriodLabel');
            let dSelect = document.getElementById('dynamicPeriodValue');

            let prevPeriodType = dSelect.getAttribute('data-type') || "";

            if (freq === 'onetime') {
                document.getElementById('reportMonth').parentElement.classList.add('opacity-30', 'pointer-events-none');
                document.getElementById('reportYear').parentElement.classList.add('opacity-30', 'pointer-events-none');
                dDiv.classList.add('hidden');
                dSelect.setAttribute('data-type', 'none');
            } else {
                document.getElementById('reportMonth').parentElement.classList.remove('opacity-30', 'pointer-events-none');
                document.getElementById('reportYear').parentElement.classList.remove('opacity-30', 'pointer-events-none');
                
                if (freq === 'daily') {
                    dLabel.innerHTML = 'तारीख निवडा <span class="text-red-500">*</span>';
                    
                    let todayObj = new Date();
                    let yestObj = new Date(); yestObj.setDate(todayObj.getDate() - 1);
                    let tomObj = new Date(); tomObj.setDate(todayObj.getDate() + 1);
                    
                    let allowedDays = [
                        { d: yestObj, type: 'yesterday' },
                        { d: todayObj, type: 'today' },
                        { d: tomObj, type: 'tomorrow' }
                    ];

                    let selM = parseInt(document.getElementById('reportMonth').value);
                    let selY = parseInt(document.getElementById('reportYear').value);
                    
                    let opts = '';
                    let defaultVal = '';
                    allowedDays.forEach(obj => {
                        if((obj.d.getMonth() + 1) === selM && obj.d.getFullYear() === selY) {
                            let dayVal = obj.d.getDate();
                            let monthVal = obj.d.getMonth() + 1;
                            let yearVal = obj.d.getFullYear();
                            
                            let displayDate = `${dayVal < 10 ? '0' + dayVal : dayVal}-${monthVal < 10 ? '0' + monthVal : monthVal}-${yearVal}`;
                            
                            opts += `<option value="${dayVal}">${displayDate}</option>`;
                            if (obj.type === 'today') defaultVal = dayVal.toString();
                        }
                    });

                    if(opts === '') {
                        opts = `<option value="0">-- या महिन्यात अहवाल उपलब्ध नाही --</option>`;
                    }

                    let previousVal = dSelect.value;
                    
                    dSelect.innerHTML = opts;

                    let hasPrevVal = Array.from(dSelect.options).some(opt => opt.value === previousVal);

                    if (prevPeriodType === 'daily' && hasPrevVal && previousVal !== "0") {
                        dSelect.value = previousVal;
                    } else if(defaultVal !== '') {
                        dSelect.value = defaultVal;
                    } else if (dSelect.options.length > 0) {
                        dSelect.value = dSelect.options[0].value;
                    }
                    
                    dSelect.setAttribute('data-type', 'daily');
                    dDiv.classList.remove('hidden');
                } else if (freq === 'weekly') {
                    if(prevPeriodType !== 'weekly') {
                        dLabel.innerHTML = 'आठवडा (Week) <span class="text-red-500">*</span>';
                        dSelect.innerHTML = `<option value="1">पहिला (Week 1)</option><option value="2">दुसरा (Week 2)</option><option value="3">तिसरा (Week 3)</option><option value="4">चौथा (Week 4)</option><option value="5">पाचवा (Week 5)</option>`;
                        dSelect.value = "1"; dSelect.setAttribute('data-type', 'weekly');
                    }
                    dDiv.classList.remove('hidden');
                } else if (freq === 'fortnightly') {
                    if(prevPeriodType !== 'fortnightly') {
                        dLabel.innerHTML = 'पंधरवाडा <span class="text-red-500">*</span>';
                        dSelect.innerHTML = `<option value="1">१ ते १५ तारीख</option><option value="2">१६ ते अखेर</option>`;
                        dSelect.value = "1"; dSelect.setAttribute('data-type', 'fortnightly');
                    }
                    dDiv.classList.remove('hidden');
                } else {
                    dDiv.classList.add('hidden');
                    dSelect.setAttribute('data-type', 'none');
                }
            }

            let pVal = parseInt(dSelect.value);
            if(isNaN(pVal)) pVal = 1;

            if (freq === 'daily' && dSelect.value === "0") {
                vSelect.innerHTML = '<option value="">-- अवैध महिना --</option>';

            if (currentFormObj.form_type === 'subcenter') {

                     (freq === 'weekly' && r.report_fortnight === pVal) ||

                     (freq !== 'daily' && freq !== 'weekly' && freq !== 'fortnightly'))
                );
                
                if (!isFilled && userVillages.length > 0) {
                    let vData = { ...userVillages[0], name: "🏢 संपूर्ण उपकेंद्र (Subcenter Level)" };

                    globalNilVillages.push(vData);

                    hiddenCount++;
                }
            } else if (freq === 'onetime') {
                userVillages.forEach(v => {
                    let isFilled = false;
                    if (currentFormObj.form_type === 'list') {
                        isFilled = false; 
                    } else {
                        isFilled = onetimeResponses.some(r => 
                            r.form_id === formId && r.village_id === v.id && 
                            (currentFormObj.data_entry_mode === 'individual' ? r.employee_id === loggedInUser.id : true)
                        );
                    }
                    
                    if (!isFilled) {
                        globalPendingVillages.push(v);
                        globalNilVillages.push(v);
                    } else {
                        hiddenCount++;
                    }
                });
            } else {
                userVillages.forEach(v => {
                    let isFilled = false;
                    
                    let hasDataMatch = currentMonthResponses.some(r => 
                        r.form_id === formId && r.village_id === v.id && 
                        (currentFormObj.data_entry_mode === 'individual' ? r.employee_id === loggedInUser.id : true) &&
                        ((freq === 'daily' && r.report_fortnight === pVal) ||
                         (freq === 'weekly' && r.report_fortnight === pVal) ||
                         (freq === 'fortnightly' && r.report_fortnight === pVal) ||
                         (freq !== 'daily' && freq !== 'weekly' && freq !== 'fortnightly'))
                    );
                    
                    let hasNilMatch = currentMonthResponses.some(r => 
                        r.form_id === formId && r.village_id === v.id && 
                        r.response_data && r.response_data.is_nil === true &&
                        ((freq === 'daily' && r.report_fortnight === pVal) ||
                         (freq === 'weekly' && r.report_fortnight === pVal) ||
                         (freq === 'fortnightly' && r.report_fortnight === pVal) ||
                         (freq !== 'daily' && freq !== 'weekly' && freq !== 'fortnightly'))
                    );

                    if (currentFormObj.form_type === 'list') {
                        isFilled = false; 
                        if (!hasNilMatch && !hasDataMatch) globalNilVillages.push(v); 
                    } else {
                        isFilled = hasDataMatch;
                        if (!isFilled) globalNilVillages.push(v);

                    if (!isFilled) globalPendingVillages.push(v);

            vSelect.innerHTML = '<option value="">-- गाव / कार्यक्षेत्र निवडा --</option>';

                vSelect.value = globalPendingVillages[0].id;

        window.calculateFormulas = function(vid) {
            if(!currentFormObj) return;
            const allFields = currentFormObj.schema_json.fields;
            const formulaFields = allFields.filter(f => f.formula && String(f.formula).trim() !== "");
            
            formulaFields.forEach(f => {
                let formulaStr = String(f.formula).toLowerCase().trim();
                
                allFields.forEach(af => {
                    if (!af.formula || String(af.formula).trim() === "") {
                        let ph = `[${af.id.toLowerCase()}]`;
                        if (formulaStr.includes(ph)) {
                            let el = document.getElementById(`${af.id}_v${vid}`);
                            let val = el && el.value !== "" ? parseFloat(el.value) : 0;
                            if (isNaN(val)) val = 0;
                            formulaStr = formulaStr.split(ph).join(val); 
                        }
                    }
                });
                
                try {
                    if (/^[0-9.+\-*/() ]+$/.test(formulaStr)) {
                        let res = eval(formulaStr);
                        let finalRes = isNaN(res) || !isFinite(res) ? 0 : res;
                        let targetEl = document.getElementById(`${f.id}_v${vid}`);
                        if (targetEl) {
                            targetEl.value = Number.isInteger(finalRes) ? finalRes : parseFloat(finalRes.toFixed(2));
                        }
                    }
                } catch(e) {}
            });
        };

        // 🟢 नवीन फंक्शन: ऑटो-फील (Auto-fill) लॉजिक हाताळण्यासाठी
        window.checkAutoFill = function(vid) {
            if(!currentFormObj) return;
            const allFields = currentFormObj.schema_json.fields;
            
            allFields.forEach(f => {
                if (f.auto_fill) {
                    let triggerEl = document.getElementById(`${f.auto_fill.trigger_field}_v${vid}`);
                    let targetEl = document.getElementById(`${f.id}_v${vid}`);
                    
                    if (triggerEl && targetEl) {
                        if (triggerEl.value === f.auto_fill.trigger_val) {
                            targetEl.value = f.auto_fill.fill_val;
                            targetEl.style.backgroundColor = "#dcfce3"; 
                        } 
                        else if (targetEl.value === f.auto_fill.fill_val) {
                            targetEl.value = "";
                            targetEl.style.backgroundColor = ""; 
                        }
                    }
                }
            });
        };

        function evaluateValidationFormula(formulaStr, vid, fields) {
            let fStr = String(formulaStr).toLowerCase().trim();
            if (fStr.includes('[')) {
                fields.forEach(af => {
                    let ph = `[${af.id.toLowerCase()}]`;
                    if (fStr.includes(ph)) {
                        let el = document.getElementById(`${af.id}_v${vid}`);
                        let val = el && el.value !== "" ? parseFloat(el.value) : 0;
                        if (isNaN(val)) val = 0;
                        fStr = fStr.split(ph).join(val);
                    }
                });
            }

            try {
                if (/^[0-9.+\-*/() ]+$/.test(fStr)) {
                    let res = eval(fStr);
                    return isNaN(res) || !isFinite(res) ? null : res;
                }
            } catch(e) {}
            
            let simpleNum = parseFloat(fStr);
            return isNaN(simpleNum) ? null : simpleNum;
        }

        async function submitNilForAll() {
            const formId = document.getElementById('formSelect').value;
            const repMonth = document.getElementById('reportMonth').value;
            const repYear = document.getElementById('reportYear').value;
            const periodVal = document.getElementById('dynamicPeriodValue') ? document.getElementById('dynamicPeriodValue').value : "1";

            if (!formId || globalNilVillages.length === 0) {
                alert("फॉर्म निवडलेला नाही किंवा सर्व गावांची माहिती आधीच भरली आहे.");
                return;
            }

            let confirmMsg = currentFormObj.form_type === 'subcenter' 
                ? "तुम्हाला खात्री आहे की या उपकेंद्रासाठी 'निरंक (NIL)' अहवाल भरायचा आहे?" 
                : `तुम्हाला खात्री आहे की सर्व राहिलेल्या ${globalNilVillages.length} गावांसाठी 'निरंक (NIL)' अहवाल भरायचा आहे?\n(यानंतर या कालावधीत या गावांची नोंद करता येणार नाही)`;

            if(!confirm(confirmMsg)) return;

            let btn = document.getElementById('btnNilAllReport');
            if(btn) btn.disabled = true;

            document.getElementById('loaderText').innerText = "सर्व गावांसाठी निरंक रिपोर्ट सेव्ह होत आहे...";
            document.getElementById('loader').classList.remove('hidden');

            let payloads = [];
            let freq = currentFormObj.schema_json && currentFormObj.schema_json.frequency ? currentFormObj.schema_json.frequency : (currentFormObj.form_type === 'fortnightly' ? 'fortnightly' : 'monthly');
            let targetFortnight = (freq === 'fortnightly' || freq === 'weekly' || freq === 'daily') ? parseInt(periodVal) : 0;

            globalNilVillages.forEach(v => {
                let pLoad = {
                    form_id: formId,
                    village_id: v.id,
                    employee_id: loggedInUser.id,
                    report_month: parseInt(repMonth),
                    report_year: parseInt(repYear),
                    report_fortnight: targetFortnight,
                    response_data: { is_nil: true }
                };
                payloads.push(pLoad);
            });

            try {
                const { error } = await supabaseClient.from('form_responses').insert(payloads);
                document.getElementById('loader').classList.add('hidden');
                if(btn) btn.disabled = false;

                if (error) {
                    alert("माहिती सेव्ह करताना त्रुटी आली: " + error.message);
                } else {
                    if (freq === 'onetime') {
                        onetimeResponses.push(...payloads);
                    } else {
                        currentMonthResponses.push(...payloads);
                    }
                    alert(`✅ उत्कृष्ट! निरंक (NIL) अहवाल यशस्वीरीत्या सबमिट झाला!`);
                    updateFormDropdown(); 
                }
            } catch (err) {
                document.getElementById('loader').classList.add('hidden');
                if(btn) btn.disabled = false;
                alert("नेटवर्क किंवा सिस्टीम एरर: " + err.message);
            }
        }

        async function submitData(isNilReport, isAddMore) {
            const formId = document.getElementById('formSelect').value;
            const repMonth = document.getElementById('reportMonth').value;
            const repYear = document.getElementById('reportYear').value;
            const periodVal = document.getElementById('dynamicPeriodValue') ? document.getElementById('dynamicPeriodValue').value : "1";

            if (!formId || currentPendingVillages.length === 0) return;

            const btnSubmit = document.getElementById('submitBtn');
            const btnAddMore = document.getElementById('btnSaveAndAddMore');
            if(btnSubmit) btnSubmit.disabled = true;
            if(btnAddMore) btnAddMore.disabled = true;

            const formEl = document.getElementById('dynamicDataForm');
            if (!formEl.checkValidity()) { 
                formEl.reportValidity(); 
                if(btnSubmit) btnSubmit.disabled = false;
                if(btnAddMore) btnAddMore.disabled = false;
                return; 
            }

            for (let v of currentPendingVillages) {
                for (let f of currentDataFields) {
                    let el = document.getElementById(`${f.id}_v${v.id}`);
                    if (!el || el.value === "") continue;

                    let val = parseFloat(el.value);
                    if (isNaN(val)) continue;

                    if (f.max && String(f.max).trim() !== "") {
                        let maxVal = evaluateValidationFormula(f.max, v.id, currentDataFields);
                        if (maxVal !== null && val > maxVal) {
                            alert(`⚠️ चूक: ${v.name} साठी '${f.label}' मधील आकडा ${maxVal} पेक्षा जास्त असू शकत नाही!`);
                            el.focus();
                            if(btnSubmit) btnSubmit.disabled = false;
                            if(btnAddMore) btnAddMore.disabled = false;
                            return;
                        }
                    }

                    if (f.min && String(f.min).trim() !== "") {
                        let minVal = evaluateValidationFormula(f.min, v.id, currentDataFields);
                        if (minVal !== null && val < minVal) {
                            alert(`⚠️ चूक: ${v.name} साठी '${f.label}' मधील आकडा ${minVal} पेक्षा कमी असू शकत नाही!`);
                            el.focus();
                            if(btnSubmit) btnSubmit.disabled = false;
                            if(btnAddMore) btnAddMore.disabled = false;
                            return;
                        }
                    }
                }
            }

            document.getElementById('loaderText').innerText = "डेटा तपासला व सुरक्षित सेव्ह होत आहे...";
            document.getElementById('loader').classList.remove('hidden');

            let payloads = [];
            let freq = currentFormObj.schema_json && currentFormObj.schema_json.frequency ? currentFormObj.schema_json.frequency : (currentFormObj.form_type === 'fortnightly' ? 'fortnightly' : 'monthly');
            let targetFortnight = (freq === 'fortnightly' || freq === 'weekly' || freq === 'daily') ? parseInt(periodVal) : 0;

            if (currentFormObj.form_type !== 'list') {
                const villageIds = currentPendingVillages.map(v => v.id);
                
                let query = supabaseClient
                    .from('form_responses')
                    .select('id, village_id')
                    .eq('form_id', formId)
                    .eq('report_month', parseInt(repMonth))
                    .eq('report_year', parseInt(repYear))
                    .eq('report_fortnight', targetFortnight)
                    .in('village_id', villageIds);

                if (currentFormObj.data_entry_mode === 'individual') {
                    query = query.eq('employee_id', loggedInUser.id);
                }

                const { data: existingRecords, error: checkError } = await query;

                if (checkError) {
                    document.getElementById('loader').classList.add('hidden');
                    alert("डेटा तपासताना त्रुटी आली: " + checkError.message);
                    if(btnSubmit) btnSubmit.disabled = false;
                    if(btnAddMore) btnAddMore.disabled = false;
                    return;
                }

                if (existingRecords && existingRecords.length > 0) {
                    document.getElementById('loader').classList.add('hidden');
                    alert("⚠️ सावधगिरी: तुम्ही निवडलेल्या गावांपैकी काहींचा अहवाल आधीच सिस्टीममध्ये सबमिट झाला आहे! कृपया एकाच महिन्याचा डेटा दोनदा भरू नका.");
                    await handleMonthYearChange();
                    return;
                }
            }

            currentPendingVillages.forEach(v => {
                let responseDataObj = {};
                currentDataFields.forEach(f => {
                    let el = document.getElementById(`${f.id}_v${v.id}`);
                    responseDataObj[f.id] = { value: el ? el.value : "" };
                });

                let pLoad = {
                    form_id: formId,
                    village_id: v.id,
                    employee_id: loggedInUser.id,
                    report_month: parseInt(repMonth),
                    report_year: parseInt(repYear),
                    report_fortnight: targetFortnight,
                    response_data: responseDataObj
                };
                payloads.push(pLoad);
            });

            try {
                const { error } = await supabaseClient.from('form_responses').insert(payloads);

                document.getElementById('loader').classList.add('hidden');

                if (error) {
                    alert("माहिती सेव्ह करताना त्रुटी आली: " + error.message);
                    if(btnSubmit) btnSubmit.disabled = false;
                    if(btnAddMore) btnAddMore.disabled = false;
                } else {
                    if (freq === 'onetime') {
                        onetimeResponses.push(...payloads);
                    } else {
                        currentMonthResponses.push(...payloads);
                    }

                    if (isAddMore) {
                        alert("✅ माहिती सेव्ह झाली! तुम्ही या गावासाठी पुढची नोंद करू शकता.");
                        document.getElementById('dynamicDataForm').reset();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        setTimeout(() => {
                            currentPendingVillages.forEach(vill => calculateFormulas(vill.id));
                        }, 100);
                        
                        updateFormDropdown(); 
                        if(btnSubmit) btnSubmit.disabled = false;
                        if(btnAddMore) btnAddMore.disabled = false;
                    } else {
                        alert("✅ माहिती यशस्वीरीत्या सेव्ह झाली!");
                        window.location.href = "dashboard.html"; 
                    }
                }
            } catch (err) {
                document.getElementById('loader').classList.add('hidden');
                alert("नेटवर्क किंवा सिस्टीम एरर: " + err.message);
                if(btnSubmit) btnSubmit.disabled = false;
                if(btnAddMore) btnAddMore.disabled = false;
            }
        }
    </script>
</body>
</html>
