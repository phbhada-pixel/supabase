<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>माहिती भरा - आरोग्य उपकेंद्र</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .level-1 { background-color: #f3f4f6; padding: 10px; margin-top: 15px; border-radius: 5px; font-weight: bold; color: #1f2937; border-left: 4px solid #3b82f6; }
        .level-2 { background-color: #f5f3ff; padding: 8px; margin-top: 10px; margin-left: 20px; border-radius: 5px; font-weight: bold; color: #5b21b6; border-left: 4px solid #a855f7; }
        .level-3 { margin-top: 8px; margin-left: 40px; padding-left: 10px; border-left: 2px dashed #cbd5e1; }
    </style>
</head>
<body class="bg-gray-100 p-6 min-h-screen">

    <div class="max-w-4xl mx-auto bg-white p-4 rounded-lg shadow-md flex justify-between items-center mb-6 no-print">
        <div>
            <h1 class="text-xl font-bold text-indigo-700">📝 नवीन माहिती भरा (Data Entry)</h1>
            <p class="text-xs text-gray-500">तुमच्या उपकेंद्राची आणि गावाची मासिक माहिती येथे भरा</p>
        </div>
        <button onclick="window.location.href='dashboard.html'" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 transition text-sm font-bold shadow">डॅशबोर्डवर परत जा</button>
    </div>

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md border-t-4 border-indigo-600">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6 pb-6 border-b">
            <div>
                <label class="block text-gray-700 font-bold mb-2 text-sm">अहवाल महिना <span class="text-red-500">*</span></label>
                <select id="reportMonth" onchange="handleMonthYearChange()" class="w-full p-2 border rounded bg-white text-sm">
                    <option value="1">जानेवारी</option><option value="2">फेब्रुवारी</option>
                    <option value="3">मार्च</option><option value="4">एप्रिल</option>
                    <option value="5">मे</option><option value="6">जून</option>
                    <option value="7">जुलै</option><option value="8">ऑगस्ट</option>
                    <option value="9">सप्टेंबर</option><option value="10">ऑक्टोबर</option>
                    <option value="11">नोव्हेंबर</option><option value="12">डिसेंबर</option>
                </select>
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-2 text-sm">अहवाल वर्ष <span class="text-red-500">*</span></label>
                <input type="number" id="reportYear" onchange="handleMonthYearChange()" class="w-full p-2 border rounded text-sm font-mono font-bold" value="2026">
            </div>
            
            <div>
                <label class="block text-gray-700 font-bold mb-2 text-sm">अहवाल / फॉर्म निवडा <span class="text-red-500">*</span></label>
                <select id="formSelect" onchange="loadFormSchema()" class="w-full p-2 border rounded bg-indigo-50 font-bold text-indigo-900 shadow-sm">
                    <option value="">-- फॉर्म लोड होत आहेत --</option>
                </select>
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-2 text-sm">गाव / कार्यक्षेत्र निवडा <span class="text-red-500">*</span></label>
                <select id="villageSelect" class="w-full p-2 border rounded bg-white font-medium text-gray-800 shadow-sm">
                    <option value="">-- आधी फॉर्म निवडा --</option>
                </select>
                <p id="villageHint" class="text-[10px] text-green-600 mt-1 hidden">✓ फक्त राहिलेली गावे दाखवली आहेत.</p>
            </div>
        </div>

        <form id="dynamicDataForm" onsubmit="submitDataEntry(event)">
            <div id="dynamicFieldsContainer" class="space-y-2 mb-8">
                <p class="text-center text-gray-400 font-medium py-10">कृपया वरून फॉर्म निवडा, प्रश्नांची यादी येथे दिसेल.</p>
            </div>

            <div class="flex justify-end border-t pt-4">
                <button type="submit" id="submitBtn" class="bg-green-600 text-white px-8 py-3 rounded font-bold shadow-lg hover:bg-green-700 transition transform hover:scale-105 hidden">
                    💾 माहिती सेव्ह करा
                </button>
            </div>
        </form>

    </div>

    <div id="loader" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl text-center">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-green-600 border-t-transparent mb-3"></div>
            <p class="text-lg font-bold text-gray-800">माहिती सेव्ह होत आहे...</p>
            <p class="text-xs text-gray-500">कृपया थांबा</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qbmjsfiievcautxybaai.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_sdgZ9G8ko4H_3Mh9RouYFg_JOQ-4Mdx'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let loggedInUser = null;
        let currentFormFields = [];
        
        let userVillages = [];
        let allowedForms = [];
        let allFormsMap = {};
        let currentMonthResponses = []; // चालू महिन्याचे भरलेले अहवाल

        window.onload = async function() {
            const userDataString = localStorage.getItem('loggedInUser');
            if (!userDataString) { window.location.href = "index.html"; return; }
            loggedInUser = JSON.parse(userDataString);

            const currentMonth = new Date().getMonth() + 1;
            document.getElementById('reportMonth').value = currentMonth;
            document.getElementById('reportYear').value = new Date().getFullYear();

            await fetchVillages();
            await fetchAvailableForms();
            await fetchMonthResponses(); // महिन्याचे भरलेले अहवाल आणणे
            
            updateFormDropdown(); // स्मार्ट फॉर्म फिल्टर करणे
        };

        async function fetchVillages() {
            const { data, error } = await supabaseClient
                .from('villages')
                .select('*')
                .eq('sub_center_id', loggedInUser.sub_center_id)
                .order('name');
            userVillages = data || [];
        }

        async function fetchAvailableForms() {
            const { data, error } = await supabaseClient.from('dynamic_forms').select('*').eq('is_active', true);
            if (!error && data) {
                let userRole = loggedInUser.role ? String(loggedInUser.role).trim().toUpperCase() : "ALL";
                allowedForms = data.filter(form => {
                    let rolesStr = form.allowed_roles ? String(form.allowed_roles).trim().toUpperCase() : "ALL";
                    if (rolesStr === "ALL" || loggedInUser.role === "admin") return true;
                    return rolesStr.split(',').includes(userRole);
                });
            }
        }

        // 🟢 डेटाबेसमधून चालू महिना आणि वर्षाचे भरलेले अहवाल आणणे
        async function fetchMonthResponses() {
            const m = document.getElementById('reportMonth').value;
            const y = document.getElementById('reportYear').value;
            
            if (userVillages.length === 0) return;

            const villageIds = userVillages.map(v => v.id);

            const { data, error } = await supabaseClient
                .from('form_responses')
                .select('form_id, village_id, employee_id')
                .eq('report_month', parseInt(m))
                .eq('report_year', parseInt(y))
                .in('village_id', villageIds);
                
            currentMonthResponses = data || [];
        }

        // 🟢 महिना किंवा वर्ष बदलल्यास फॉर्म आणि गावे परत रिफ्रेश करणे
        async function handleMonthYearChange() {
            document.getElementById('dynamicFieldsContainer').innerHTML = '<p class="text-center text-blue-500 font-medium py-10">महिना बदलला आहे, डेटा तपासला जात आहे...</p>';
            document.getElementById('submitBtn').classList.add('hidden');
            document.getElementById('villageHint').classList.add('hidden');
            
            await fetchMonthResponses();
            updateFormDropdown();
        }

        // 🟢 स्मार्ट फॉर्म ड्रॉपडाऊन (भरलेले फॉर्म्स गायब करणे)
        function updateFormDropdown() {
            const fSelect = document.getElementById('formSelect');
            const currentSelection = fSelect.value;
            fSelect.innerHTML = '<option value="">-- फॉर्म निवडा --</option>';
            allFormsMap = {};

            allowedForms.forEach(form => {
                let showForm = true;
                
                // यादी (List) प्रकार सोडून इतरांसाठी चेक करणे
                if (form.form_type !== 'list' && userVillages.length > 0) {
                    let filledVillagesCount = 0;
                    userVillages.forEach(v => {
                        // डेटा एन्ट्री मोड सामायिक असेल तर कुणीही भरलेला चालेल, वैयक्तिक असेल तर याच युझरचा
                        let isFilled = currentMonthResponses.some(r => 
                            r.form_id === form.id && 
                            r.village_id === v.id && 
                            (form.data_entry_mode === 'shared' ? true : r.employee_id === loggedInUser.id)
                        );
                        if (isFilled) filledVillagesCount++;
                    });

                    // जर सर्व गावांची माहिती भरली असेल, तर तो फॉर्म यादीतून गायब होईल
                    if (filledVillagesCount >= userVillages.length) {
                        showForm = false; 
                    }
                }

                if (showForm) {
                    allFormsMap[form.id] = form;
                    const opt = document.createElement('option');
                    opt.value = form.id; opt.text = form.form_name;
                    fSelect.appendChild(opt);
                }
            });

            // जर आधी निवडलेला फॉर्म अजूनही शिल्लक असेल, तर तो तसाच ठेवणे
            if (allFormsMap[currentSelection]) {
                fSelect.value = currentSelection;
                updateVillageDropdown();
            } else {
                fSelect.value = "";
                document.getElementById('villageSelect').innerHTML = '<option value="">-- आधी फॉर्म निवडा --</option>';
                document.getElementById('dynamicFieldsContainer').innerHTML = '<p class="text-center text-gray-400 font-medium py-10">कृपया वरून फॉर्म निवडा, प्रश्नांची यादी येथे दिसेल.</p>';
            }
        }

        // 🟢 स्मार्ट गाव ड्रॉपडाऊन (ज्या गावांची माहिती भरली आहे, ती गायब करणे)
        function updateVillageDropdown() {
            const formId = document.getElementById('formSelect').value;
            const vSelect = document.getElementById('villageSelect');
            const vHint = document.getElementById('villageHint');
            vSelect.innerHTML = '<option value="">-- गाव निवडा --</option>';

            if(!formId) { vHint.classList.add('hidden'); return; }

            let formObj = allFormsMap[formId];
            let hiddenCount = 0;

            userVillages.forEach(v => {
                let showVillage = true;
                
                // यादी प्रकार नसल्यास भरलेले गाव गायब करणे
                if (formObj && formObj.form_type !== 'list') {
                    let isFilled = currentMonthResponses.some(r => 
                        r.form_id === formId && 
                        r.village_id === v.id && 
                        (formObj.data_entry_mode === 'shared' ? true : r.employee_id === loggedInUser.id)
                    );
                    if (isFilled) { showVillage = false; hiddenCount++; }
                }

                if (showVillage) {
                    const opt = document.createElement('option');
                    opt.value = v.id; opt.text = v.name;
                    vSelect.appendChild(opt);
                }
            });

            if (hiddenCount > 0 && formObj.form_type !== 'list') {
                vHint.innerText = `✓ ${hiddenCount} गावे भरून झाली आहेत (ती लपवली आहेत).`;
                vHint.classList.remove('hidden');
            } else {
                vHint.classList.add('hidden');
            }
        }

        // फॉर्मचे प्रश्न स्क्रीनवर दाखवणे
        function loadFormSchema() {
            updateVillageDropdown(); // फॉर्म निवडल्यावर गावे फिल्टर करणे

            const formId = document.getElementById('formSelect').value;
            const container = document.getElementById('dynamicFieldsContainer');
            const submitBtn = document.getElementById('submitBtn');
            
            if (!formId) {
                container.innerHTML = '<p class="text-center text-gray-400 font-medium py-10">कृपया वरून फॉर्म निवडा, प्रश्नांची यादी येथे दिसेल.</p>';
                submitBtn.classList.add('hidden');
                currentFormFields = [];
                return;
            }

            const selectedForm = allFormsMap[formId];
            currentFormFields = selectedForm.schema_json.fields;
            let html = '';

            currentFormFields.forEach(f => {
                let divClass = '';
                if (!f.parent_id) { divClass = f.type === 'group_header' ? 'level-1' : 'mb-4'; } 
                else {
                    let parentField = currentFormFields.find(p => p.id === f.parent_id);
                    if (parentField && !parentField.parent_id) divClass = f.type === 'group_header' ? 'level-2' : 'level-3';
                    else divClass = 'level-3';
                }

                if (f.type === 'group_header') {
                    html += `<div class="${divClass}">${f.label}</div>`;
                } else {
                    let reqStar = f.required ? '<span class="text-red-500 ml-1">*</span>' : '';
                    let reqAttr = f.required ? 'required' : '';
                    
                    html += `<div class="${divClass} flex flex-col md:flex-row md:items-center justify-between gap-2 border-b pb-2">
                        <label class="text-sm font-semibold text-gray-700 md:w-1/2">${f.label} ${reqStar}</label>
                        <div class="md:w-1/2">`;

                    if (f.type === 'number') {
                        html += `<input type="number" id="${f.id}" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 font-bold text-indigo-700 bg-indigo-50" ${reqAttr} placeholder="0">`;
                    } else if (f.type === 'text') {
                        html += `<input type="text" id="${f.id}" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500" ${reqAttr}>`;
                    } else if (f.type === 'yes_no') {
                        html += `<select id="${f.id}" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 font-bold" ${reqAttr}><option value="">- निवडा -</option><option value="होय">होय (Yes)</option><option value="नाही">नाही (No)</option></select>`;
                    } else if (f.type === 'date') {
                        html += `<input type="date" id="${f.id}" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 font-bold text-gray-700" ${reqAttr}>`;
                    } else if (f.type === 'dropdown' && f.options) {
                        html += `<select id="${f.id}" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 font-bold text-gray-700" ${reqAttr}><option value="">- निवडा -</option>`;
                        f.options.split(',').forEach(opt => { html += `<option value="${opt.trim()}">${opt.trim()}</option>`; });
                        html += `</select>`;
                    }
                    html += `</div></div>`;
                }
            });

            container.innerHTML = html;
            submitBtn.classList.remove('hidden');
        }

        // 🟢 डेटा सेव्ह करणे आणि 'सॉफ्ट रिसेट' करणे
        async function submitDataEntry(event) {
            event.preventDefault(); 

            const formId = document.getElementById('formSelect').value;
            const villageId = document.getElementById('villageSelect').value;
            const repMonth = document.getElementById('reportMonth').value;
            const repYear = document.getElementById('reportYear').value;

            if (!formId || !villageId) {
                alert("कृपया फॉर्म आणि गाव अचूक निवडा!"); return;
            }

            document.getElementById('loader').classList.remove('hidden');

            let responseDataObj = {};
            currentFormFields.forEach(f => {
                if (f.type !== 'group_header') {
                    let el = document.getElementById(f.id);
                    responseDataObj[f.id] = { value: el ? el.value : "" };
                }
            });

            const payload = {
                form_id: formId,
                village_id: villageId,
                employee_id: loggedInUser.id,
                report_month: parseInt(repMonth),
                report_year: parseInt(repYear),
                response_data: responseDataObj
            };

            try {
                const { error } = await supabaseClient.from('form_responses').insert([payload]);
                document.getElementById('loader').classList.add('hidden');

                if (error) {
                    alert("माहिती सेव्ह करताना त्रुटी आली: " + error.message);
                } else {
                    alert("✅ उत्कृष्ट! गावाची माहिती यशस्वीरीत्या सेव्ह झाली.");
                    
                    // सॉफ्ट रिसेट: फॉर्ममधील फक्त आकडे पुसणे
                    document.getElementById('dynamicDataForm').reset();
                    
                    // 🟢 स्मार्ट रिफ्रेश: डेटाबेस पुन्हा तपासून ड्रॉपडाऊन अपडेट करणे (गावाचे नाव गायब करणे)
                    await fetchMonthResponses();
                    updateFormDropdown();

                    // जर फॉर्म अजूनही यादीत असेल, तर पुढील गावासाठी 'गाव निवडा' ला फोकस करणे
                    const fSelect = document.getElementById('formSelect');
                    if (fSelect.value) {
                        document.getElementById('villageSelect').focus();
                    } else {
                        // सर्व गावे भरून झाली की फॉर्म आपोआप गायब होईल
                        document.getElementById('dynamicFieldsContainer').innerHTML = `<div class="text-center bg-green-50 p-8 rounded border border-green-200"><h2 class="text-2xl font-bold text-green-700 mb-2">🎉 अभिनंदन!</h2><p class="text-green-600 font-medium">या फॉर्मची सर्व गावांची माहिती भरून पूर्ण झाली आहे!</p></div>`;
                        document.getElementById('submitBtn').classList.add('hidden');
                    }
                }
            } catch (err) {
                document.getElementById('loader').classList.add('hidden');
                alert("नेटवर्क किंवा सिस्टीम एरर: " + err.message);
            }
        }
    </script>
</body>
</html>
